<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Débug Événements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green: #1F3D2B;
            --sand: #F2E8CF;
            --violet: #5B3E96;
            --blue: #3A86C4;
            --bg: #0a1a10;
            --surface: #0f2318;
            --text: #F2E8CF;
            --muted: #a8b8a0;
            --card-bg: rgba(15, 35, 24, 0.72);
            --glass: rgba(31, 61, 43, 0.45);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 18px;
            --tr: 0.4s cubic-bezier(.4, 0, .2, 1);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
        }
        .test-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        button {
            background: var(--violet);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #7b6eea;
        }
        #log {
            font-family: monospace;
            font-size: 0.9rem;
            background: black;
            color: #2ecc71;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Événements</h1>
        
        <div class="test-section">
            <h2>1. Test API getstats</h2>
            <button onclick="testGetStats()">Tester getstats</button>
        </div>
        
        <div class="test-section">
            <h2>2. Test API getall</h2>
            <button onclick="testGetAll()">Tester getall</button>
        </div>
        
        <div class="test-section">
            <h2>📜 Logs</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        function log(msg, isError = false) {
            const logDiv = document.getElementById('log');
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            if (isError) p.classList.add('error');
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testGetStats() {
            log('Test getstats...');
            try {
                const response = await fetch('evenement/list.php?action=getstats');
                log('Response status: ' + response.status);
                const data = await response.json();
                log('getstats data: ' + JSON.stringify(data));
            } catch (e) {
                log('Erreur getstats: ' + e.message, true);
                console.error(e);
            }
        }

        async function testGetAll() {
            log('Test getall...');
            try {
                const response = await fetch('evenement/list.php?action=getall');
                log('Response status: ' + response.status);
                const data = await response.json();
                log('getall data: ' + JSON.stringify(data));
            } catch (e) {
                log('Erreur getall: ' + e.message, true);
                console.error(e);
            }
        }

        log('Page chargée');
        log('Base URL: ' + window.location.href);
    </script>
</body>
</html>
