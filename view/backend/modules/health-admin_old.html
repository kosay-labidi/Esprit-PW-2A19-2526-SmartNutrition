<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 GS Santé - Gestion Médicale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
    <style>
        /* ═══════════════════════════════════════════════════════════
           VARIABLES & RESET
           ═══════════════════════════════════════════════════════════ */
        :root {
            --green: #1F3D2B;
            --sand: #F2E8CF;
            --violet: #5B3E96;
            --blue: #3A86C4;
            --bg: #0a1a10;
            --surface: #0f2318;
            --text: #F2E8CF;
            --muted: #a8b8a0;
            --card-bg: rgba(15, 35, 24, 0.72);
            --glass: rgba(31, 61, 43, 0.45);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 18px;
            --tr: 0.4s cubic-bezier(.4, 0, .2, 1);
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
        }
        
        [data-theme="light"] {
            --bg: #f5f0e8;
            --surface: #ede5d0;
            --text: #1F3D2B;
            --muted: #5a6e5a;
            --card-bg: rgba(242, 232, 207, 0.75);
            --glass: rgba(242, 232, 207, 0.6);
            --shadow: 0 8px 32px rgba(31, 61, 43, 0.15);
        }
        
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background var(--tr), color var(--tr);
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
        }
        
        /* ═══════════════════════════════════════════════════════════
           CONTAINER & LAYOUT
           ═══════════════════════════════════════════════════════════ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
        }
        
        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text);
            letter-spacing: .05em;
        }
        
        /* ═══════════════════════════════════════════════════════════
           BUTTONS
           ═══════════════════════════════════════════════════════════ */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all var(--tr);
            letter-spacing: .04em;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--blue));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(91, 62, 150, 0.4);
        }
        
        .btn-secondary {
            background: var(--glass);
            color: var(--text);
            border: 1.5px solid rgba(91, 62, 150, 0.5);
        }
        
        .btn-secondary:hover {
            background: rgba(91, 62, 150, 0.15);
            border-color: var(--violet);
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 12px;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        a.btn-small {
            display: inline-flex;
        }
        
        /* ═══════════════════════════════════════════════════════════
           STATS GRID
           ═══════════════════════════════════════════════════════════ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(91, 62, 150, .2);
            border-radius: var(--radius);
            padding: 28px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 3px solid var(--bleu);
        }
        
        .stat-card h3 {
            color: var(--vert);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--violet);
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .section h2 {
            color: var(--vert);
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--bleu);
            padding-bottom: 10px;
        }
        
        .filter-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="text"],
        select {
            padding: 12px 15px;
            border: 2px solid var(--bleu);
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
        }
        
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(186, 91, 237, 0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        table th {
            background: var(--vert);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        table tr:hover {
            background: rgba(186, 91, 237, 0.05);
        }
        
        table a {
            color: var(--bleu);
            text-decoration: none;
            font-weight: 600;
            margin-right: 10px;
        }
        
        table a:hover {
            color: var(--violet);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Gestion Santé - Admin</h1>
        
        <div id="alertContainer"></div>
        
        <div class="btn-group">
            <a href="../health/addDossier.php" class="btn btn-primary">+ Nouveau Dossier Médical</a>
            <a href="../health/addRegime.php" class="btn btn-secondary">+ Nouveau Régime</a>
            <a href="../health/exportDossiers.php" target="_blank" class="btn" style="background: #4CAF50; color: white;">📥 Export Dossiers PDF</a>
            <a href="../health/exportRegimes.php" target="_blank" class="btn" style="background: #FF9800; color: white;">📥 Export Régimes PDF</a>
        </div>
        
        <!-- Statistics Section -->
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card">
                <h3>📋 Total Dossiers</h3>
                <div class="stat-value" id="stat-dossiers">0</div>
            </div>
            <div class="stat-card">
                <h3>🥗 Total Régimes</h3>
                <div class="stat-value" id="stat-regimes">0</div>
            </div>
            <div class="stat-card">
                <h3>⚖️ IMC Moyen</h3>
                <div class="stat-value" id="stat-imc">0</div>
            </div>
            <div class="stat-card">
                <h3>⚠️ Allergies</h3>
                <div class="stat-value" id="stat-allergies">0</div>
            </div>
        </div>
        
        <!-- Dossiers Section -->
        <div class="section">
            <h2>📋 Dossiers Médicaux</h2>
            
            <div class="filter-group">
                <input type="text" id="searchDossier" placeholder="🔎 Rechercher...">
                <select id="filterBloodType">
                    <option value="">Tous groupes sanguins</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <select id="sortDossier">
                    <option value="date_mise_a_jour-DESC">Trier: Plus récent</option>
                    <option value="date_mise_a_jour-ASC">Trier: Plus ancien</option>
                    <option value="imc-DESC">Trier: IMC (haut→bas)</option>
                    <option value="imc-ASC">Trier: IMC (bas→haut)</option>
                    <option value="poids-DESC">Trier: Poids (lourd→léger)</option>
                </select>
                <button class="btn btn-secondary btn-small" onclick="searchDossiers()">🔍 Chercher</button>
            </div>
            
            <div id="dossiersContainer" class="loading">Chargement des dossiers...</div>
        </div>
        
        <!-- Regimes Section -->
        <div class="section">
            <h2>🥗 Régimes Alimentaires</h2>
            
            <div class="filter-group">
                <input type="text" id="searchRegime" placeholder="🔎 Rechercher...">
                <select id="filterType">
                    <option value="">Tous types</option>
                    <option value="alimentaire">Alimentaire</option>
                    <option value="medical">Médical</option>
                    <option value="sportif">Sportif</option>
                    <option value="perte_de_poids">Perte de poids</option>
                    <option value="prise_de_masse">Prise de masse</option>
                </select>
                <button class="btn btn-secondary btn-small" onclick="searchRegimes()">🔍 Chercher</button>
            </div>
            
            <div id="regimesContainer" class="loading">Chargement des régimes...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = '../../../controller';
        
        // Load all data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadDossiers();
            loadRegimes();
        });
        
        // Load statistics
        async function loadStats() {
            try {
                const dosRes = await fetch(`${API_BASE}/dossierMedical.controller.php?action=stats`);
                const dosStat = await dosRes.json();
                
                const regRes = await fetch(`${API_BASE}/regime.controller.php?action=stats`);
                const regStat = await regRes.json();
                
                document.getElementById('stat-dossiers').textContent = dosStat.total_dossiers || 0;
                document.getElementById('stat-regimes').textContent = regStat.total_regimes || 0;
                document.getElementById('stat-imc').textContent = (dosStat.avg_imc || 0).toFixed(1);
                document.getElementById('stat-allergies').textContent = dosStat.allergies_count || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
                showAlert('Erreur lors du chargement des statistiques', 'error');
            }
        }
        
        // Load dossiers
        async function loadDossiers() {
            try {
                const response = await fetch(`${API_BASE}/dossierMedical.controller.php?action=list`);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    document.getElementById('dossiersContainer').innerHTML = '<div class="empty-state">Aucun dossier trouvé</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>ID</th><th>Poids</th><th>Taille</th><th>IMC</th><th>Groupe</th><th>Allergie</th><th>Actions</th></tr></thead><tbody>';
                
                data.data.forEach(d => {
                    html += `<tr>
                        <td>${d.id_dossier}</td>
                        <td>${d.poids} kg</td>
                        <td>${d.taille} cm</td>
                        <td>${parseFloat(d.imc).toFixed(1)}</td>
                        <td>${d.groupe_sanguin || '-'}</td>
                        <td>${d.allergie ? d.allergie.substring(0, 30) + '...' : '-'}</td>
                        <td>
                            <a href="../health/showDossier.php?id=${d.id_dossier}" class="btn-small">👁️ Voir</a>
                            <a href="../health/updateDossier.php?id=${d.id_dossier}" class="btn-small">✏️ Éditer</a>
                            <button class="btn btn-danger btn-small" onclick="deleteDossier(${d.id_dossier})">🗑️ Supprimer</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('dossiersContainer').innerHTML = html;
            } catch (error) {
                console.error('Error loading dossiers:', error);
                document.getElementById('dossiersContainer').innerHTML = '<div class="empty-state">Erreur lors du chargement</div>';
            }
        }
        
        // Load regimes
        async function loadRegimes() {
            try {
                const response = await fetch(`${API_BASE}/regime.controller.php?action=list`);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    document.getElementById('regimesContainer').innerHTML = '<div class="empty-state">Aucun régime trouvé</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>Nom</th><th>Type</th><th>Niveau</th><th>Calories</th><th>Actions</th></tr></thead><tbody>';
                
                data.data.forEach(r => {
                    html += `<tr>
                        <td>${r.nom_regime}</td>
                        <td>${r.type_regime}</td>
                        <td>${r.niveau_difficulte}</td>
                        <td>${r.apport_calorique_moyen || '-'} kcal</td>
                        <td>
                            <a href="../health/updateRegime.php?id=${r.id_regime}" class="btn-small">✏️ Éditer</a>
                            <button class="btn btn-danger btn-small" onclick="deleteRegime(${r.id_regime})">🗑️ Supprimer</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('regimesContainer').innerHTML = html;
            } catch (error) {
                console.error('Error loading regimes:', error);
                document.getElementById('regimesContainer').innerHTML = '<div class="empty-state">Erreur lors du chargement</div>';
            }
        }
        
        // Delete dossier
        async function deleteDossier(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce dossier ?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/dossierMedical.controller.php?action=delete&id=${id}`, { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showAlert('✅ Dossier supprimé avec succès!', 'success');
                    loadDossiers();
                    loadStats();
                } else {
                    showAlert('❌ Erreur lors de la suppression', 'error');
                }
            } catch (error) {
                console.error('Error deleting:', error);
                showAlert('❌ Erreur', 'error');
            }
        }
        
        // Delete regime
        async function deleteRegime(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce régime ?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/regime.controller.php?action=delete&id=${id}`, { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showAlert('✅ Régime supprimé avec succès!', 'success');
                    loadRegimes();
                    loadStats();
                } else {
                    showAlert('❌ Erreur lors de la suppression', 'error');
                }
            } catch (error) {
                console.error('Error deleting:', error);
                showAlert('❌ Erreur', 'error');
            }
        }
        
        // Search dossiers
        async function searchDossiers() {
            const query = document.getElementById('searchDossier').value;
            const bloodType = document.getElementById('filterBloodType').value;
            
            try {
                let url = `${API_BASE}/dossierMedical.controller.php?action=search&q=${encodeURIComponent(query)}`;
                if (bloodType) url += `&groupe_sanguin=${bloodType}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    document.getElementById('dossiersContainer').innerHTML = '<div class="empty-state">Aucun résultat trouvé</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>ID</th><th>Poids</th><th>Taille</th><th>IMC</th><th>Groupe</th><th>Allergie</th><th>Actions</th></tr></thead><tbody>';
                
                data.data.forEach(d => {
                    html += `<tr>
                        <td>${d.id_dossier}</td>
                        <td>${d.poids} kg</td>
                        <td>${d.taille} cm</td>
                        <td>${parseFloat(d.imc).toFixed(1)}</td>
                        <td>${d.groupe_sanguin || '-'}</td>
                        <td>${d.allergie ? d.allergie.substring(0, 30) : '-'}</td>
                        <td>
                            <a href="../health/updateDossier.php?id=${d.id_dossier}">✏️ Éditer</a>
                            <button class="btn btn-danger btn-small" onclick="deleteDossier(${d.id_dossier})">🗑️</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('dossiersContainer').innerHTML = html;
            } catch (error) {
                console.error('Search error:', error);
                showAlert('Erreur lors de la recherche', 'error');
            }
        }
        
        // Search regimes
        async function searchRegimes() {
            const query = document.getElementById('searchRegime').value;
            const type = document.getElementById('filterType').value;
            
            try {
                let url = `${API_BASE}/regime.controller.php?action=search&q=${encodeURIComponent(query)}`;
                if (type) url += `&type_regime=${type}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    document.getElementById('regimesContainer').innerHTML = '<div class="empty-state">Aucun résultat trouvé</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>Nom</th><th>Type</th><th>Niveau</th><th>Calories</th><th>Actions</th></tr></thead><tbody>';
                
                data.data.forEach(r => {
                    html += `<tr>
                        <td>${r.nom_regime}</td>
                        <td>${r.type_regime}</td>
                        <td>${r.niveau_difficulte}</td>
                        <td>${r.apport_calorique_moyen || '-'} kcal</td>
                        <td>
                            <a href="../health/updateRegime.php?id=${r.id_regime}">✏️ Éditer</a>
                            <button class="btn btn-danger btn-small" onclick="deleteRegime(${r.id_regime})">🗑️</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('regimesContainer').innerHTML = html;
            } catch (error) {
                console.error('Search error:', error);
                showAlert('Erreur lors de la recherche', 'error');
            }
        }
        
        // Show alert
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 4000);
        }
    </script>
</body>
</html>
