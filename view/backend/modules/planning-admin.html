<!-- planning-admin.html — Vue SPA liste ↔ détail -->
<section class="content-section" id="planning">

  <!-- ══ VUE LISTE ══════════════════════════════════════════════════════ -->
  <div id="planningVueListe">
    <div class="section-header">
      <h2>📅 Gestion du Planning</h2>
      <p>Gérez les demandes · approuvez · générez les plannings</p>
    </div>

    <!-- ── Panel résultats anomalies IA ── -->
    <div id="anomaliesPanel" style="display:none"></div>

    <div class="section">
      <div id="adminPlanningStats"></div>
      <!-- ── Barre recherche + tri ── -->
      <div style="display:flex;flex-direction:column;gap:12px;margin:16px 0">

        <!-- Ligne 1 : Recherche avec sélecteur de champ -->
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;border:1.5px solid rgba(91,62,150,.25);border-radius:10px;overflow:hidden;flex:1;min-width:260px;background:var(--card,rgba(255,255,255,.04))">
            <select id="planningSearchField" onchange="filterPlanningTable()"
              style="padding:9px 10px 9px 14px;border:none;background:rgba(91,62,150,.1);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;outline:none;min-width:110px">
              <option value="id">🔢 ID</option>
              <option value="budget">💰 Budget</option>
              <option value="calories">🔥 Calories</option>
            </select>
            <span style="width:1px;height:24px;background:rgba(91,62,150,.2);flex-shrink:0"></span>
            <input type="text" id="planningSearchInput" placeholder="Valeur à rechercher…"
              oninput="filterPlanningTable()"
              style="flex:1;padding:9px 14px;border:none;background:transparent;color:var(--text);font-size:.87rem;outline:none"/>
            <button onclick="document.getElementById('planningSearchInput').value='';filterPlanningTable()"
              title="Effacer" style="padding:6px 10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem">✕</button>
          </div>

          <!-- Bouton tri -->
          <div style="display:flex;align-items:center;border:1.5px solid rgba(91,62,150,.25);border-radius:10px;overflow:hidden;background:var(--card,rgba(255,255,255,.04))">
            <select id="planningSortField" onchange="applySortPlanning()"
              style="padding:9px 10px 9px 14px;border:none;background:rgba(91,62,150,.1);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;outline:none;min-width:120px">
              <option value="id">🔢 ID</option>
              <option value="calories">🔥 Calories</option>
              <option value="budget">💰 Budget</option>
              <option value="duree">⏱️ Durée</option>
              <option value="date">📅 Date</option>
              <option value="statut">🏷️ Statut</option>
            </select>
            <span style="width:1px;height:24px;background:rgba(91,62,150,.2);flex-shrink:0"></span>
            <button id="planningSortDirBtn" onclick="toggleSortDir()"
              title="Inverser l'ordre"
              style="padding:8px 16px;border:none;background:transparent;color:var(--violet,#a78bfa);font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;min-width:72px">
              ↓ DESC
            </button>
          </div>

          <button onclick="loadPlanningData()" title="Actualiser"
            style="padding:9px 14px;border:1.5px solid rgba(91,62,150,.25);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem">
            🔄
          </button>
          <button id="btnScanAnomalies" onclick="lancerScanAnomalies()"
            style="padding:9px 18px;border:1.5px solid rgba(239,68,68,.4);border-radius:10px;
                   background:rgba(239,68,68,.1);color:#f87171;cursor:pointer;font-size:.82rem;
                   font-weight:700;white-space:nowrap;transition:all .2s;display:inline-flex;align-items:center;gap:6px"
            title="Scan IA — Détecter les anomalies (Groq LLaMA 3)">
            🔍 Scan IA
          </button>
          <button onclick="exportPlanningCSV()" title="Exporter en CSV"
            style="padding:9px 16px;border:1.5px solid rgba(46,204,113,.3);border-radius:10px;background:rgba(46,204,113,.1);color:#2ecc71;cursor:pointer;font-size:.82rem;font-weight:700;white-space:nowrap">
            ⬇️ Export CSV
          </button>
        </div>

        <!-- Ligne 2 : Filtres statut -->
        <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center">
          <span style="font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em">Statut :</span>
          <button class="planning-chip active" onclick="setPlanningFilter('all',this)">Tous</button>
          <button class="planning-chip" onclick="setPlanningFilter('en_attente',this)">⏳ En attente</button>
          <button class="planning-chip" onclick="setPlanningFilter('approuve',this)">✅ Approuvés</button>
          <button class="planning-chip" onclick="setPlanningFilter('rejete',this)">❌ Rejetés</button>
        </div>

      </div>
      <div class="table-container" style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>#ID</th><th>Utilisateur</th><th>Calories</th><th>Budget</th>
              <th>Durée</th><th>Statut</th><th>Planning</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="planningTableBody">
            <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--muted)">⏳ Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ══ VUE DÉTAIL ════════════════════════════════════════════════════ -->
  <div id="planningVueDetail" style="display:none">
    <div class="detail-topbar">
      <button class="btn-retour" onclick="planningRetourListe()">← Retour à la liste</button>
      <div class="detail-breadcrumb">
        <span style="color:var(--muted)">Planning</span>
        <span style="color:var(--muted);margin:0 6px">›</span>
        <span id="detailBreadcrumb">Demande #—</span>
      </div>
      <div id="detailTopActions" style="display:flex;gap:10px;margin-left:auto;flex-wrap:wrap"></div>
    </div>
    <div id="detailContenu">
      <div class="detail-loading"><div class="detail-spinner"></div><p>Chargement...</p></div>
    </div>
  </div>

  <style>
    .badge-statut{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.74rem;font-weight:700;white-space:nowrap}
    .badge-en_attente{background:rgba(243,156,18,.15);border:1px solid rgba(243,156,18,.3);color:#f39c12}
    .badge-approuve{background:rgba(46,204,113,.15);border:1px solid rgba(46,204,113,.3);color:#2ecc71}
    .badge-rejete{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);color:#e74c3c}
    .planning-chip{padding:7px 14px;border:1.5px solid rgba(91,62,150,.2);border-radius:20px;background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
    .planning-chip.active,.planning-chip:hover{border-color:var(--violet,#5B3E96);background:rgba(91,62,150,.12);color:var(--text)}
    .btn-statut-sm{padding:4px 9px;border:none;border-radius:7px;font-size:.76rem;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-approuver{background:rgba(46,204,113,.2);color:#2ecc71;border:1px solid rgba(46,204,113,.3)!important}
    .btn-approuver:hover{background:rgba(46,204,113,.4)}
    .btn-rejeter{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)!important}
    .btn-rejeter:hover{background:rgba(231,76,60,.3)}
    .btn-regen{background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3)!important}
    .btn-regen:hover{background:rgba(52,152,219,.3)}
    .btn-remettre{background:rgba(243,156,18,.15);color:#f39c12;border:1px solid rgba(243,156,18,.3)!important}
    .btn-remettre:hover{background:rgba(243,156,18,.3)}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ════════════════════════════════════════════════
       🔍 SIRI SCAN OVERLAY
    ════════════════════════════════════════════════ */
    #siriScanOverlay{
        position:fixed;inset:0;z-index:99999;
        background:radial-gradient(ellipse at center,rgba(10,5,30,.97) 0%,rgba(4,0,15,.99) 100%);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
        opacity:0;pointer-events:none;
        transition:opacity .4s ease;
    }
    #siriScanOverlay.visible{opacity:1;pointer-events:all}

    /* Blob principal */
    .siri-blob-wrap{position:relative;width:210px;height:210px;margin-bottom:28px;flex-shrink:0}
    .siri-blob{
        position:absolute;inset:0;border-radius:50%;
        background:conic-gradient(
            from 0deg,
            rgba(139,92,246,0)   0%,
            rgba(139,92,246,.9) 20%,
            rgba(167,139,250,.8) 35%,
            rgba(99,102,241,.9)  50%,
            rgba(59,130,246,.6)  65%,
            rgba(239,68,68,.7)   80%,
            rgba(139,92,246,0)  100%
        );
        filter:blur(1.5px);
        animation:siriRotate 2.8s linear infinite;
    }
    .siri-blob-inner{
        position:absolute;inset:12px;border-radius:50%;
        background:radial-gradient(ellipse at 38% 38%,rgba(139,92,246,.3),rgba(4,0,15,.95));
        animation:siriPulse 2s ease-in-out infinite;
    }
    .siri-blob-core{
        position:absolute;inset:34px;border-radius:50%;
        background:radial-gradient(ellipse at center,rgba(167,139,250,.55),rgba(99,102,241,.25),transparent);
        animation:siriCorePulse 1.5s ease-in-out infinite alternate;
    }

    /* Anneaux */
    .siri-rings{position:absolute;inset:-22px;pointer-events:none}
    .siri-ring{position:absolute;border-radius:50%;border:1px solid rgba(139,92,246,.6);transform:scale(0)}
    .siri-ring.r1{inset:28px;animation:siriRing 2.6s ease-out infinite}
    .siri-ring.r2{inset:14px;animation:siriRing 2.6s ease-out .55s infinite}
    .siri-ring.r3{inset:0;  animation:siriRing 2.6s ease-out 1.1s infinite}
    .siri-ring.r4{inset:-16px;animation:siriRing 2.6s ease-out 1.65s infinite}

    /* Ligne de scan */
    .siri-scanline{
        position:absolute;left:-22px;right:-22px;height:2px;
        background:linear-gradient(90deg,transparent 0%,rgba(139,92,246,0) 8%,rgba(167,139,250,.9) 40%,rgba(196,181,253,1) 50%,rgba(167,139,250,.9) 60%,rgba(139,92,246,0) 92%,transparent 100%);
        box-shadow:0 0 14px rgba(139,92,246,.9),0 0 28px rgba(99,102,241,.4);
        animation:siriScanLine 1.7s cubic-bezier(.4,0,.6,1) infinite;
    }

    /* Textes */
    .siri-status-text{
        font-size:1rem;font-weight:800;color:#e9d5ff;letter-spacing:.12em;
        text-transform:uppercase;text-align:center;margin-bottom:6px;
        animation:siriTextBlink 1.6s ease-in-out infinite;
    }
    .siri-sub-text{font-size:.76rem;color:rgba(167,139,250,.65);text-align:center;margin-bottom:24px;min-height:1.1em;letter-spacing:.03em}

    /* Barre de progression */
    .siri-progress-track{
        width:240px;height:3px;background:rgba(139,92,246,.12);
        border-radius:2px;overflow:hidden;position:relative;
    }
    .siri-progress-fill{
        height:100%;width:0;border-radius:2px;
        background:linear-gradient(90deg,#7c3aed,#a78bfa,#c4b5fd);
        transition:width .55s cubic-bezier(.4,0,.2,1);
        box-shadow:0 0 8px rgba(139,92,246,.7);
    }
    .siri-counter{font-size:.68rem;color:rgba(167,139,250,.5);margin-top:7px;text-align:center;letter-spacing:.04em}

    /* Keyframes Siri */
    @keyframes siriRotate{to{transform:rotate(360deg)}}
    @keyframes siriPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes siriCorePulse{from{opacity:.5}to{opacity:1}}
    @keyframes siriRing{
        0%{transform:scale(0);opacity:.75;border-color:rgba(139,92,246,.75)}
        65%{opacity:.15}
        100%{transform:scale(1.7);opacity:0;border-color:rgba(139,92,246,.05)}
    }
    @keyframes siriScanLine{
        0%{top:-8px;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:calc(100% + 8px);opacity:0}
    }
    @keyframes siriTextBlink{0%,100%{opacity:1}50%{opacity:.6}}

    /* ════════════════════════════════════════════════
       ⚠️ ANOMALIES PANEL
    ════════════════════════════════════════════════ */
    #anomaliesPanel{
        background:linear-gradient(135deg,rgba(239,68,68,.05),rgba(220,38,38,.07));
        border:1px solid rgba(239,68,68,.28);border-radius:14px;
        margin-bottom:16px;overflow:hidden;
        animation:aiSlideIn .35s ease;
    }
    .anomaly-panel-hd{
        display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
        padding:11px 18px;
        background:linear-gradient(135deg,rgba(239,68,68,.13),rgba(220,38,38,.18));
        border-bottom:1px solid rgba(239,68,68,.18);
    }
    .anomaly-panel-title{font-size:.8rem;font-weight:800;color:#fca5a5;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:7px}
    .anomaly-panel-close{background:none;border:1px solid rgba(239,68,68,.3);color:rgba(239,68,68,.7);border-radius:6px;padding:3px 10px;font-size:.74rem;cursor:pointer;transition:all .2s}
    .anomaly-panel-close:hover{background:rgba(239,68,68,.15);color:#f87171}
    .anomaly-summary{display:flex;gap:18px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid rgba(239,68,68,.1)}
    .anomaly-stat{display:flex;flex-direction:column;gap:2px}
    .anomaly-stat strong{font-size:1.3rem;font-weight:800;color:#f87171;line-height:1}
    .anomaly-stat span{font-size:.67rem;color:rgba(248,113,113,.55);text-transform:uppercase;letter-spacing:.05em}
    .anomaly-list{padding:12px 16px;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
    .anomaly-item{
        display:flex;align-items:flex-start;gap:10px;
        background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.18);
        border-radius:9px;padding:10px 13px;cursor:pointer;transition:all .2s;
    }
    .anomaly-item:hover{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.38)}
    .anomaly-item-ico{font-size:1.05rem;flex-shrink:0;margin-top:1px}
    .anomaly-item-id{font-size:.7rem;font-weight:700;color:rgba(248,113,113,.75);margin-bottom:3px}
    .anomaly-item-msg{font-size:.79rem;color:#fca5a5;line-height:1.4}
    .anomaly-item-vals{font-size:.7rem;color:rgba(167,139,250,.65);margin-top:3px}
    .anomaly-item-arrow{color:rgba(248,113,113,.35);font-size:.8rem;flex-shrink:0;margin-top:3px;margin-left:auto}

    /* Badge dans la table */
    .badge-anomalie{
        display:inline-flex;align-items:center;gap:3px;
        padding:2px 7px;border-radius:12px;font-size:.63rem;font-weight:800;
        background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.38);
        color:#f87171;white-space:nowrap;vertical-align:middle;margin-left:5px;
        animation:anomaliePop .4s cubic-bezier(.17,.67,.35,1.3);
    }
    @keyframes anomaliePop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    .detail-topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0 20px;border-bottom:1px solid rgba(91,62,150,.2);margin-bottom:24px}
    .btn-retour{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:10px;border:1.5px solid rgba(91,62,150,.35);background:rgba(91,62,150,.1);color:var(--text);font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
    .btn-retour:hover{background:rgba(91,62,150,.25);border-color:rgba(91,62,150,.6)}
    .detail-breadcrumb{font-size:.83rem;color:var(--text)}

    .detail-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;color:var(--muted)}
    .detail-spinner{width:42px;height:42px;border:3px solid rgba(91,62,150,.2);border-top-color:#5B3E96;border-radius:50%;animation:spin .8s linear infinite}

    .detail-bloc{background:rgba(91,62,150,.06);border:1px solid rgba(91,62,150,.15);border-radius:14px;overflow:hidden;margin-bottom:16px}
    .detail-bloc-hd{padding:12px 20px;background:rgba(91,62,150,.12);border-bottom:1px solid rgba(91,62,150,.15);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--violet,#a78bfa)}
    .detail-bloc-bd{padding:18px 20px}
    .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .info-item{display:flex;flex-direction:column;gap:4px}
    .info-lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .info-val{font-size:.92rem;font-weight:600;color:var(--text)}

    .detail-pills{display:flex;gap:12px;flex-wrap:wrap;padding:16px 20px}
    .detail-pill{display:flex;align-items:center;gap:8px;background:rgba(91,62,150,.12);border:1px solid rgba(91,62,150,.25);border-radius:20px;padding:8px 16px;font-size:.83rem}
    .detail-pill strong{color:var(--violet,#a78bfa);font-size:1rem}
    .detail-pill span{color:var(--muted)}

    .planning-table-scroll{overflow-x:auto}
    .planning-cal{width:100%;border-collapse:collapse;font-size:.82rem}
    .planning-cal th{padding:11px 14px;text-align:center;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid rgba(91,62,150,.25);white-space:nowrap;background:rgba(91,62,150,.08)}
    .planning-cal .th-act{color:var(--violet,#a78bfa);width:110px}
    .planning-cal .th-jour{color:var(--muted);min-width:140px}
    .planning-cal td{padding:12px 14px;vertical-align:top;border-bottom:1px solid rgba(91,62,150,.07);line-height:1.6;word-break:break-word}
    .planning-cal tr:last-child td{border-bottom:none}
    .td-act{font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;text-align:center;vertical-align:middle;white-space:nowrap;width:110px}
    .cal-repas .td-act{color:#2ecc71;background:rgba(46,204,113,.07);border-left:3px solid #2ecc71}
    .cal-sport .td-act{color:#f39c12;background:rgba(241,196,15,.07);border-left:3px solid #f39c12}
    .cal-sommeil .td-act{color:#3498db;background:rgba(52,152,219,.07);border-left:3px solid #3498db}
    .cal-repas td{background:rgba(46,204,113,.02)}
    .cal-sport td{background:rgba(241,196,15,.02);border-top:2px solid rgba(241,196,15,.1)}
    .cal-sommeil td{background:rgba(52,152,219,.02);border-top:2px solid rgba(52,152,219,.1)}
    .cal-repas-first td{border-top:2px solid rgba(46,204,113,.1)}

    .btn-detail{padding:10px 22px;border-radius:10px;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .2s;border:1.5px solid transparent}
    .btn-detail-ok  {background:rgba(46,204,113,.15);color:#2ecc71;border-color:rgba(46,204,113,.35)}
    .btn-detail-ok:hover{background:rgba(46,204,113,.35)}
    .btn-detail-err {background:rgba(231,76,60,.12);color:#e74c3c;border-color:rgba(231,76,60,.35)}
    .btn-detail-err:hover{background:rgba(231,76,60,.3)}
    .btn-detail-blue{background:rgba(52,152,219,.12);color:#3498db;border-color:rgba(52,152,219,.35)}
    .btn-detail-blue:hover{background:rgba(52,152,219,.3)}
    .btn-detail-warn{background:rgba(243,156,18,.12);color:#f39c12;border-color:rgba(243,156,18,.35)}
    .btn-detail-warn:hover{background:rgba(243,156,18,.3)}
    /* ── Stats dashboard admin ── */
    .ars-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
    .ars-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .ars-charts-row{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:10px}
    @media(max-width:900px){.ars-kpi-row{grid-template-columns:1fr 1fr}.ars-charts-row{grid-template-columns:1fr}}
    .ars-kpi{background:rgba(255,255,255,.03);border:1px solid rgba(91,62,150,.18);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;cursor:default;transition:transform .2s,box-shadow .2s}
    .ars-kpi:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(91,62,150,.2)}
    .ars-kpi-glow{position:absolute;top:-18px;right:-18px;width:60px;height:60px;border-radius:50%;opacity:.07;pointer-events:none}
    .ars-kpi-ico{font-size:1.2rem;margin-bottom:5px;display:block}
    .ars-kpi-val{font-size:1.75rem;font-weight:800;color:var(--text);line-height:1;margin-bottom:2px}
    .ars-kpi-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
    .ars-kpi-bar{height:3px;border-radius:2px;margin-top:8px;background:rgba(91,62,150,.1);overflow:hidden}
    .ars-kpi-fill{height:100%;border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
    .ars-chart-card{background:rgba(255,255,255,.03);border:1px solid rgba(91,62,150,.18);border-radius:12px;padding:14px 16px}
    .ars-chart-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:12px}
