<!-- planning-admin.html - Module Backend -->
<section class="content-section" id="planning">
  <div class="section-header">
    <h2>📅 Gestion du Planning</h2>
    <p>Gérez les demandes de planning nutritionnel des utilisateurs</p>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">Demandes de Planning</h2>
      <div class="section-actions">
        <button class="btn btn-secondary" onclick="loadPlanningData()">🔄 Actualiser</button>
      </div>
    </div>

    <div class="quick-stats">
      <div class="quick-stat">
        <div class="quick-stat-value" id="stat-total">—</div>
        <div class="quick-stat-label">Total demandes</div>
      </div>
      <div class="quick-stat">
        <div class="quick-stat-value" id="stat-quotidien">—</div>
        <div class="quick-stat-label">Budget quotidien</div>
      </div>
      <div class="quick-stat">
        <div class="quick-stat-value" id="stat-hebdo">—</div>
        <div class="quick-stat-label">Budget hebdomadaire</div>
      </div>
      <div class="quick-stat">
        <div class="quick-stat-value" id="stat-jours">—</div>
        <div class="quick-stat-label">Durée en jours</div>
      </div>
    </div>

    <!-- Zone de détail (cachée par défaut) -->
    <div id="detailPanel" style="display:none; margin-bottom:24px;">
      <div class="table-panel">
        <div class="form-panel-header">
          <h3>👁️ Détail Demande #<span id="detail-id">—</span></h3>
          <button class="btn-reset" onclick="hideDetailPanel()">✕ Fermer</button>
        </div>
        <div class="table-container-admin" style="margin-top:16px;">
          <table class="data-table">
            <tbody id="detailTableBody">
              <tr><td colspan="2" style="text-align:center;padding:20px;">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="planningSearchInput"
             placeholder="🔍 Rechercher..." oninput="filterPlanningTable()"/>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#ID</th>
            <th>Utilisateur</th>
            <th>Calories</th>
            <th>Budget</th>
            <th>Durée</th>
            <th>Date demande</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="planningTableBody">
          <tr>
            <td colspan="7" style="text-align:center;padding:40px;color:var(--muted);">⏳ Chargement...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
