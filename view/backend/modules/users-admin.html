<section class="content-section" id="users">
  <div class="section">
    <div class="section-header">
      <h2 class="module-title">👥 Gestion des Utilisateurs</h2>
      <div class="section-actions">
        <button class="btn btn-secondary" onclick="refreshUsers()">🔄 Actualiser</button>
        <button class="btn btn-primary" onclick="exportData('users')">📥 Exporter</button>
      </div>
    </div>

    <div class="filter-chips">
      <div class="chip active" onclick="filterByChip(this,'all')">Tous</div>
      <div class="chip" onclick="filterByChip(this,'active')">✅ Actifs</div>
      <div class="chip" onclick="filterByChip(this,'inactive')">⭕ Inactifs</div>
      <div class="chip" onclick="filterByChip(this,'admin')">🛡️ Admins</div>
      <div class="chip" onclick="filterByChip(this,'user')">👤 Utilisateurs</div>
    </div>

    <div class="search-bar">
<input type="text" class="search-input" id="searchInput" placeholder="Rechercher par nom ou email..." onkeyup="searchUsers()">
      <select class="form-select" id="roleFilter" onchange="filterUsers()">
    <option value="">Tous les rôles</option>
    <option value="utilisateur">👤 Utilisateur</option>
    <option value="admin">🛡️ Administrateur</option>
    <option value="nutritionniste">🥗 Nutritionniste</option>
    <option value="ecologiste">🌱 Écologiste</option>
</select>
      <select class="form-select" id="triDate" onchange="tri()">
    <option value="">-- Trier par date --</option>
    <option value="desc">📅 Plus récent → Plus ancien</option>
    <option value="asc">📅 Plus ancien → Plus récent</option>
</select>
 <select class="form-select" id="rowsPerPageSelect" onchange="setRowsPerPage(parseInt(this.value))">
        <option value="5">5 par page</option>
        <option value="10">10 par page</option>
        <option value="25">25 par page</option>
        <option value="50">50 par page</option>
    </select>
      <button class="btn btn-primary" onclick="addUser()">➕ Ajouter</button>
    </div>

    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom Complet</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Date d'inscription</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="6" style="text-align:center;">Chargement...</td></tr>
        </tbody>
       </table>
    </div>

    <div class="pagination">
      <button class="page-btn" disabled>◀ Précédent</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">Suivant ▶</button>
    </div>
  </div>
      <!-- ============ NOUVEAU : STATISTIQUES DYNAMIQUES ============ -->
    <div class="stats-section">
      <div class="stats-header">
        <h3>📊 Répartition des utilisateurs par rôle</h3>
        <div class="chart-toggle">
          <button class="toggle-btn active" onclick="switchChartType('pie')">🥧 Camembert</button>
          <button class="toggle-btn" onclick="switchChartType('bar')">📊 Barres</button>
        </div>
      </div>
      
      <div class="stats-grid-custom">
        <!-- Graphique camembert (visible par défaut) -->
        <div class="chart-card" id="pieChartContainer">
          <canvas id="userPieChart" width="400" height="400"></canvas>
        </div>
        
        <!-- Graphique barres (caché par défaut) -->
        <div class="chart-card" id="barChartContainer" style="display: none;">
          <canvas id="userBarChart" width="400" height="400"></canvas>
        </div>
        
        <!-- Légende et statistiques -->
        <div class="stats-legend">
          <div class="legend-title">📈 Résumé</div>
          <div class="legend-stats" id="userStatsLegend">
            <!-- Les statistiques seront injectées dynamiquement -->
            <div class="stat-item">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
</section>
