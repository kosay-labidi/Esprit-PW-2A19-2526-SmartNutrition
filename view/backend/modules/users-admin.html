<section class="content-section" id="users">

  <!-- ══════════════════════════════════
       TABLE DE GESTION UTILISATEURS
  ══════════════════════════════════ -->
  <div class="section">
    <div class="section-header">
      <h2 class="module-title">👥 Gestion des Utilisateurs</h2>
      <div class="section-actions">
        <button class="btn btn-secondary" onclick="refreshUsers()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Actualiser
        </button>
        <button class="btn btn-primary" onclick="exportData('users')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Exporter
        </button>
      </div>
    </div>

    <!-- Filtres rapides -->
    <div class="filter-chips">
      <div class="chip active" onclick="filterByChip(this,'all')">Tous</div>
      <div class="chip" onclick="filterByChip(this,'active')">✅ Actifs</div>
      <div class="chip" onclick="filterByChip(this,'inactive')">⭕ Inactifs</div>
      <div class="chip" onclick="filterByChip(this,'suspended')">🚫 Suspendus</div>
      <div class="chip" onclick="filterByChip(this,'admin')">🛡️ Admins</div>
      <!--<div class="chip" onclick="filterByChip(this,'user')">👤 Utilisateurs</div>-->
    </div>

    <!-- Barre de recherche & filtres -->
    <div class="search-bar">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Rechercher par nom ou email…"
        onkeyup="searchUsers()"
        autocomplete="off"
        spellcheck="false"
      >
      <select class="form-select" id="roleFilter" onchange="filterUsers()">
        <option value="">Tous les rôles</option>
        <option value="utilisateur">👤 Utilisateur</option>
        <option value="admin">🛡️ Administrateur</option>
        <option value="nutritionniste">🥗 Nutritionniste</option>
        <option value="ecologiste">🌱 Écologiste</option>
      </select>
      <select class="form-select" id="triDate" onchange="tri()">
        <option value="">Trier par date</option>
        <option value="desc">📅 Plus récent → Plus ancien</option>
        <option value="asc">📅 Plus ancien → Plus récent</option>
      </select>
      <select class="form-select" id="rowsPerPageSelect" onchange="setRowsPerPage(parseInt(this.value))">
        <option value="5">5 / page</option>
        <option value="10">10 / page</option>
        <option value="25">25 / page</option>
        <option value="50">50 / page</option>
      </select>
      <button class="btn btn-primary" onclick="addUser()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Ajouter
      </button>
    </div>

    <!-- Tableau -->
    <div class="table-container">
      <table class="data-table" aria-label="Liste des utilisateurs">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom complet</th>
            <th>E-mail</th>
            <th>Rôle</th>
            <th>Date d'inscription</th>
            <th>Statut</th>
            <th style="text-align:center;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="7" style="text-align:center; padding:40px; color:var(--muted);">
              <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
                <div class="section-loader-spinner"></div>
                Chargement…
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="page-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="15 18 9 12 15 6"/></svg>
        Précédent
      </button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">
        Suivant
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════
       STATISTIQUES — côte à côte
  ══════════════════════════════════ -->
  <div class="stats-dual-row">

    <!-- Bloc rôle -->
    <div class="stats-section stats-section--compact">
      <div class="stats-header">
        <h3>📊 Par rôle</h3>
        <div class="chart-toggle">
          <button class="toggle-btn active" onclick="switchChartType('pie')">🥧</button>
          <button class="toggle-btn" onclick="switchChartType('bar')">📊</button>
        </div>
      </div>
      <div class="stats-grid-compact">
        <div class="chart-card chart-card--sm" id="pieChartContainer">
          <canvas id="userPieChart" aria-label="Graphique camembert des rôles"></canvas>
        </div>
        <div class="chart-card chart-card--sm" id="barChartContainer" style="display:none;">
          <canvas id="userBarChart" aria-label="Graphique barres des rôles"></canvas>
        </div>
        <div class="stats-legend stats-legend--compact">
          <div class="legend-title">📈 Résumé rôles</div>
          <div class="legend-stats" id="userStatsLegend">
            <div class="stat-item"><span style="color:var(--muted);font-size:.82rem;">Chargement…</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bloc statut -->
    <div class="stats-section stats-section--compact">
      <div class="stats-header">
        <h3>🔵 Par statut</h3>
        <div class="chart-toggle">
          <button class="toggle-btn active" onclick="switchStatusChartType('pie')">🥧</button>
          <button class="toggle-btn" onclick="switchStatusChartType('bar')">📊</button>
        </div>
      </div>
      <div class="stats-grid-compact">
        <div class="chart-card chart-card--sm" id="statusPieChartContainer">
          <canvas id="userStatusPieChart" aria-label="Graphique camembert des statuts"></canvas>
        </div>
        <div class="chart-card chart-card--sm" id="statusBarChartContainer" style="display:none;">
          <canvas id="userStatusBarChart" aria-label="Graphique barres des statuts"></canvas>
        </div>
        <div class="stats-legend stats-legend--compact">
          <div class="legend-title">📈 Résumé statuts</div>
          <div class="legend-stats" id="userStatusStatsLegend">
            <div class="stat-item"><span style="color:var(--muted);font-size:.82rem;">Chargement…</span></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal de modification utilisateur -->
  <div id="editUserModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 500px; width: 90%;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 class="modal-title" style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700;">✏️ Modifier l'utilisateur</h3>
        <button onclick="closeEditModal()" class="modal-close" style="background: none; border: none; font-size: 1.5rem; cursor: none; color: var(--text);">&times;</button>
      </div>
      <form id="editUserForm">
        <input type="hidden" id="editUserId">
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Nom</label>
          <input type="text" id="editUserNom" class="form-input" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Prénom</label>
          <input type="text" id="editUserPrenom" class="form-input" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Email</label>
          <input type="email" id="editUserEmail" class="form-input" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Rôle</label>
          <select id="editUserRole" class="form-select" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
            <option value="utilisateur">👤 Utilisateur</option>
            <option value="admin">🛡️ Administrateur</option>
            <option value="nutritionniste">🥗 Nutritionniste</option>
            <option value="ecologiste">🌱 Écologiste</option>
          </select>
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="button" onclick="closeEditModal()" class="btn btn-secondary" style="flex: 1;">Annuler</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal d'ajout utilisateur -->
  <div id="addUserModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 500px; width: 90%;">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 class="modal-title" style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700;">➕ Ajouter un utilisateur</h3>
        <button onclick="closeAddModal()" class="modal-close" style="background: none; border: none; font-size: 1.5rem; cursor: none; color: var(--text);">&times;</button>
      </div>
      <form id="addUserForm">
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Nom</label>
          <input type="text" id="addUserNom" class="form-input" placeholder="Farhani" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Prénom</label>
          <input type="text" id="addUserPrenom" class="form-input" placeholder="Ahmed" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Email</label>
          <input type="email" id="addUserEmail" class="form-input" placeholder="exemple@email.com" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Mot de passe</label>
          <input type="password" id="addUserMdp" class="form-input" placeholder="••••••••" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
          <label style="display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text);">Rôle</label>
          <select id="addUserRole" class="form-select" style="width: 100%; padding: 12px 16px; border-radius: 12px; background: var(--header-bg); border: 1px solid var(--border); color: var(--text); outline: none;">
            <option value="utilisateur">👤 Utilisateur</option>
            <option value="admin">🛡️ Administrateur</option>
            <option value="nutritionniste">🥗 Nutritionniste</option>
            <option value="ecologiste">🌱 Écologiste</option>
          </select>
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="button" onclick="closeAddModal()" class="btn btn-secondary" style="flex: 1;">Annuler</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

</section>
