<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Événements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --green:#1F3D2B; --sand:#F2E8CF; --violet:#5B3E96; --blue:#3A86C4;
            --bg:#0a1a10; --surface:#0f2318; --text:#F2E8CF; --muted:#a8b8a0;
            --card-bg:rgba(15,35,24,0.72); --glass:rgba(31,61,43,0.45);
            --shadow:0 8px 32px rgba(0,0,0,0.4); --radius:18px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .log {
            font-family: monospace;
            background: black;
            color: #2ecc71;
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .error { color: #e74c3c; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(91,62,150,.1);
        }
        th {
            background: linear-gradient(135deg,rgba(91,62,150,.2),rgba(58,134,196,.1));
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test Événements API</h1>

        <div class="log" id="log">Logs:</div>

        <h2>Stats</h2>
        <div id="stats"></div>

        <h2>Tableau</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Heure</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        const API = 'evenement/list.php';

        function log(msg, isError = false) {
            const p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            if (isError) p.classList.add('error');
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testStats() {
            log('Testing getstats...');
            try {
                const res = await fetch(API + '?action=getstats');
                log('Response status: ' + res.status);
                const data = await res.json();
                log('Stats data: ' + JSON.stringify(data));
                document.getElementById('stats').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                log('ERROR getstats: ' + e.message, true);
                console.error(e);
            }
        }

        async function testGetAll() {
            log('Testing getall...');
            try {
                const res = await fetch(API + '?action=getall');
                log('Response status: ' + res.status);
                const data = await res.json();
                log('getall data: ' + JSON.stringify(data));

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Aucun événement</td></tr>';
                    return;
                }
                data.forEach(e => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${e.id_event}</td>
                        <td>${e.titre}</td>
                        <td>${e.type}</td>
                        <td>${e.date}</td>
                        <td>${e.heure}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                log('ERROR getall: ' + e.message, true);
                console.error(e);
            }
        }

        log('Page loaded, API: ' + API);
        testStats();
        testGetAll();
    </script>
</body>
</html>
