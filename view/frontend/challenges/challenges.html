<!-- ═══════════════════════════════════════════════════════
     Vue Défis Simple — GaiaLumen v3.0
     Vue légère pour challenge section sans dashboard
     ═══════════════════════════════════════════════════════ -->

<section class="content-section" id="challenges">

  <!-- ── EN-TÊTE ──────────────────────────────────────── -->
  <div class="sc-header">
    <div class="sc-header__icon">🏆</div>
    <div class="sc-header__text">
      <h2 class="sc-header__title">Mes Défis</h2>
      <p class="sc-header__sub">Participez aux défis collaboratifs et suivez votre progression</p>
    </div>
    <button class="sc-btn sc-btn--primary" onclick="loadAvailableChallenges()">
      🔍 Découvrir
    </button>
  </div>

  <!-- ── ONGLETS ───────────────────────────────────────── -->
  <div class="sc-tabs-frame">
    <div class="sc-tabs">
      <button class="sc-tab active" onclick="showTab('my-challenges', event)">
        <span class="sc-tab__icon">📊</span>
        <span>Mes Participations</span>
        <span class="sc-tab__badge" id="badge-my">0</span>
      </button>
      <button class="sc-tab" onclick="showTab('available-challenges', event)">
        <span class="sc-tab__icon">🎯</span>
        <span>Défis Disponibles</span>
        <span class="sc-tab__badge" id="badge-avail">0</span>
      </button>
    </div>
  </div>

  <!-- ── PANNEAUX ──────────────────────────────────────── -->

  <!-- Mes défis -->
  <div id="my-challenges" class="sc-panel active">
    <div class="sc-panel__toolbar">
      <h3 class="sc-panel__title">Mes Participations</h3>
    </div>
    <div id="my-challenges-list" class="sc-grid"></div>
  </div>

  <!-- Défis disponibles -->
  <div id="available-challenges" class="sc-panel">
    <div class="sc-panel__toolbar">
      <h3 class="sc-panel__title">Défis Disponibles</h3>
      <div class="sc-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sc-search" class="sc-search" placeholder="Rechercher…" oninput="filterAvailable(this.value)" />
      </div>
    </div>
    <div id="available-challenges-list" class="sc-grid"></div>
  </div>

</section>

<style>
/* ── HEADER ─────────────────────────────────────────────── */

  overflow: hidden;
}

.sc-header::before {
  content: '';

  top: -50%; right: -10%;

  pointer-events: none;
}

[data-theme="light"] .sc-header {

}

.sc-header__icon {

</style>

<script>
/* ── DONNÉES LOCALES ────────────────────────────────────── */
var _availableRaw = [];

/* ── CHARGEMENT MES PARTICIPATIONS ─────────────────────── */
function loadMyChallenges() {
  fetch('../../controller/participant.controller.php?action=read')
    .then(function(r){ return r.json(); })
    .then(function(result){
      if (result && result.success) displayMyChallenges(result.data);
      else displayMyChallenges([]);
    })
    .catch(function(){ displayMyChallenges([]); });
}

/* ── CHARGEMENT DÉFIS DISPONIBLES ──────────────────────── */
function loadAvailableChallenges() {
  fetch('../../controller/challenge.controller.php?action=read')
    .then(function(r){ return r.json(); })
    .then(function(result){
      if (result && result.success) {
        _availableRaw = result.data || [];
        displayAvailableChallenges(_availableRaw);
        showTab('available-challenges', null);
        var el = document.getElementById('badge-avail');
        if(el) el.textContent = _availableRaw.length;
      } else {
        displayAvailableChallenges([]);
      }
    })
    .catch(function(){ displayAvailableChallenges([]); });
}

/* ── FILTRAGE DISPONIBLES ────────────────────────────────── */
function filterAvailable(query) {
  var q = (query || '').toLowerCase();
  var filtered = q
    ? _availableRaw.filter(function(c){
        return (c.titre||'').toLowerCase().includes(q) ||
               (c.description||'').toLowerCase().includes(q);
      })
    : _availableRaw;
  displayAvailableChallenges(filtered);
}

/* ── AFFICHER MES PARTICIPATIONS ────────────────────────── */
function displayMyChallenges(list) {
  var container = document.getElementById('my-challenges-list');
  var badge = document.getElementById('badge-my');
  if(badge) badge.textContent = list ? list.length : 0;

  if (!list || list.length === 0) {
    container.innerHTML =
      '<div class="sc-empty">' +
        '<div class="sc-empty__icon">🏁</div>' +
        '<p class="sc-empty__title">Aucune participation</p>' +
        '<p class="sc-empty__sub">Cliquez sur « Découvrir » pour rejoindre un défi !</p>' +
      '</div>';
    return;
  }

  container.innerHTML = list.map(function(p) {
    var prog = parseFloat(p.progression) || 0;
    var obj  = parseFloat(p.objectif_personnel) || 0;
    return (
      '<article class="sc-card sc-card--participation">' +
        '<div class="sc-card__stripe"></div>' +
        '<span class="sc-badge sc-badge--participation">📊 Ma participation</span>' +
        '<div class="sc-card__body">' +
          '<div class="sc-card__header">' +
            '<span class="sc-card__emoji">🏆</span>' +
            '<div class="sc-card__title-group">' +
              '<h4 class="sc-card__title">' + (p.challenge_titre || 'Défi') + '</h4>' +
              '<span class="sc-card__type">En cours</span>' +
            '</div>' +
          '</div>' +
          '<div class="sc-card__infos">' +
            '<div class="sc-info-item">' +
              '<span class="sc-info-item__icon">🎯</span>' +
              '<span>Objectif : <strong>' + obj + '%</strong></span>' +
            '</div>' +
            '<div class="sc-info-item">' +
              '<span class="sc-info-item__icon">📅</span>' +
              '<span>' + (p.date_inscription || '—') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="sc-progress">' +
            '<div class="sc-progress__header">' +
              '<span class="sc-progress__label">Progression</span>' +
              '<span class="sc-progress__val">' + prog + '%</span>' +
            '</div>' +
            '<div class="sc-progress__bar">' +
              '<div class="sc-progress__fill" style="width:' + prog + '%"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sc-card__footer">' +
          '<button class="sc-card-btn sc-card-btn--update" ' +
            'onclick="window.location.href=\'challenges/updateParticipation.php?id=' + p.id + '\'">' +
            '📊 Mettre à jour' +
          '</button>' +
        '</div>' +
      '</article>'
    );
  }).join('');
}

/* ── AFFICHER DÉFIS DISPONIBLES ─────────────────────────── */
function displayAvailableChallenges(list) {
  var container = document.getElementById('available-challenges-list');
  if (!list || list.length === 0) {
    container.innerHTML =
      '<div class="sc-empty">' +
        '<div class="sc-empty__icon">🔍</div>' +
        '<p class="sc-empty__title">Aucun défi trouvé</p>' +
        '<p class="sc-empty__sub">Revenez plus tard pour de nouveaux défis.</p>' +
      '</div>';
    return;
  }

  container.innerHTML = list.map(function(c) {
    var icon = c.streak_icon || '🌱';
    var statut = (c.statut || 'actif').toLowerCase();
    var isActif = statut === 'actif' || statut === 'active';
    var isTermine = statut === 'termine' || statut === 'terminé';
    var badgeClass = isTermine ? 'sc-badge--termine' : 'sc-badge--available';
    var badgeText = isTermine ? '📦 Terminé' : (isActif ? '✅ Actif' : '🔜 À venir');
    var dateDebut = c.date_debut
      ? new Date(c.date_debut).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})
      : '—';
    var dateFin = c.date_fin
      ? new Date(c.date_fin).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})
      : '—';
    var btnDisabled = isTermine ? ' style="opacity:.4;cursor:not-allowed;"' : '';

    return (
      '<article class="sc-card">' +
        '<div class="sc-card__stripe"></div>' +
        '<span class="sc-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '<div class="sc-card__body">' +
          '<div class="sc-card__header">' +
            '<span class="sc-card__emoji">' + icon + '</span>' +
            '<div class="sc-card__title-group">' +
              '<h4 class="sc-card__title">' + (c.titre || 'Défi') + '</h4>' +
              '<span class="sc-card__type">' + (c.type || 'Collectif') + '</span>' +
            '</div>' +
          '</div>' +
          (c.description ? '<p class="sc-card__desc">' + c.description + '</p>' : '') +
          '<div class="sc-card__infos">' +
            '<div class="sc-info-item">' +
              '<span class="sc-info-item__icon">📅</span>' +
              '<span>' + dateDebut + '</span>' +
            '</div>' +
            '<div class="sc-info-item">' +
              '<span class="sc-info-item__icon">🏁</span>' +
              '<span>' + dateFin + '</span>' +
            '</div>' +
            '<div class="sc-info-item">' +
              '<span class="sc-info-item__icon">🎯</span>' +
              '<span>Objectif : <strong>' + (c.valeur_cible || '—') + '%</strong></span>' +
            '</div>' +
            (c.duree
              ? '<div class="sc-info-item"><span class="sc-info-item__icon">⏱️</span><span>' + c.duree + ' jours</span></div>'
              : '') +
            (c.participants_count
              ? '<div class="sc-info-item sc-info-item--wide">' +
                  '<span class="sc-info-item__icon">👥</span>' +
                  '<span>' + c.participants_count + ' participant(s)</span>' +
                '</div>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="sc-card__footer">' +
          '<button class="sc-card-btn sc-card-btn--participate"' +
            (isTermine ? ' disabled' : '') + btnDisabled +
            ' onclick="' + (isTermine ? '' : 'window.location.href=\'challenges/addParticipation.php?challenge_id=' + c.id + '\'') + '">' +
            (isTermine ? '📦 Terminé' : '✅ Participer') +
          '</button>' +
        '</div>' +
      '</article>'
    );
  }).join('');
}

/* ── GESTION ONGLETS ────────────────────────────────────── */
function showTab(tabId, event) {
  document.querySelectorAll('.sc-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.sc-tab').forEach(function(b){ b.classList.remove('active'); });

  var panel = document.getElementById(tabId);
  if(panel) panel.classList.add('active');

  if (event && event.target) {
    var tab = event.target.closest('.sc-tab');
    if(tab) tab.classList.add('active');
  } else {
    var idx = tabId === 'my-challenges' ? 0 : 1;
    var tabs = document.querySelectorAll('.sc-tab');
    if(tabs[idx]) tabs[idx].classList.add('active');
  }

  if (tabId === 'available-challenges' && _availableRaw.length === 0) {
    loadAvailableChallenges();
  }
}

/* ── INIT ───────────────────────────────────────────────── */
window.addEventListener('load', function() {
  loadMyChallenges();
});
</script>
