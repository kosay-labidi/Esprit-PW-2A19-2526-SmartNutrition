<section class="content-section" id="challenges">
  <div class="section-header">
    <h2 class="module-title">🏆 Mes Défis</h2>
    <p>Participez aux défis collaboratifs et suivez votre progression</p>
  </div>

  <div class="challenges-actions">
    <button class="btn btn-primary" onclick="loadAvailableChallenges()">
      🔍 Découvrir les défis
    </button>
  </div>

  <div class="challenges-tabs">
    <button class="tab-btn active" onclick="showTab('my-challenges')">
      Mes Défis
    </button>
    <button class="tab-btn" onclick="showTab('available-challenges')">
      Défis Disponibles
    </button>
  </div>

  <!-- Mes défis en cours -->
  <div id="my-challenges" class="tab-content active">
    <h3>📊 Mes Participations</h3>
    <div id="my-challenges-list" class="challenges-grid"></div>
  </div>

  <!-- Défis disponibles -->
  <div id="available-challenges" class="tab-content">
    <h3>🎯 Défis Disponibles</h3>
    <div id="available-challenges-list" class="challenges-grid"></div>
  </div>
</section>

<style>
  .module-title {
    background: linear-gradient(135deg, var(--text), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .challenges-actions {
    margin-bottom: 24px;
  }

  .challenges-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 2px solid rgba(168, 184, 160, 0.2);
  }

  .tab-btn {
    padding: 12px 24px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .tab-btn.active {
    color: var(--blue);
    border-bottom-color: var(--blue);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .challenges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .challenge-card {
    background: var(--surface);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(168, 184, 160, 0.2);
    transition: all 0.3s ease;
  }

  .challenge-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  .challenge-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .challenge-icon {
    font-size: 2rem;
  }

  .challenge-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0;
  }

  .challenge-description {
    color: var(--muted);
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .challenge-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(149, 165, 166, 0.2);
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--violet));
    border-radius: 10px;
    transition: width 1s ease;
  }

  .challenge-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .btn-sm {
    padding: 8px 16px;
    font-size: 0.85rem;
  }
</style>

<script>
  // Charger mes défis
  function loadMyChallenges() {
    const userId = 1; // À remplacer par l'ID de l'utilisateur connecté

    fetch("../../controller/participant.controller.php?action=read")
      .then((response) => response.json())
      .then((result) => {
        if (result.success) {
          displayMyChallenges(result.data);
        }
      });
  }

  // Charger les défis disponibles
  function loadAvailableChallenges() {
    fetch("../../controller/challenge.controller.php?action=read")
      .then((response) => response.json())
      .then((result) => {
        if (result.success) {
          displayAvailableChallenges(result.data);
        }
      });
  }

  // Afficher mes défis
  function displayMyChallenges(participations) {
    const container = document.getElementById("my-challenges-list");

    if (participations.length === 0) {
      container.innerHTML =
        "<p>Vous ne participez à aucun défi pour le moment.</p>";
      return;
    }

    const html = participations
      .map(
        (p) => `
    <div class="challenge-card">
      <div class="challenge-header">
        <span class="challenge-icon">🏆</span>
        <h4 class="challenge-title">${p.challenge_titre}</h4>
      </div>
      <div class="challenge-meta">
        <span>🎯 Objectif: ${p.objectif_personnel}%</span>
        <span>📊 Progression: ${p.progression}%</span>
        <span>📅 Inscrit le: ${p.date_inscription}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${p.progression}%"></div>
      </div>
      <div class="challenge-actions">
        <button class="btn btn-primary btn-sm" onclick="window.location.href='challenges/updateParticipation.php?id=${p.id}'">
          📊 Mettre à jour
        </button>
      </div>
    </div>
  `,
      )
      .join("");

    container.innerHTML = html;
  }

  // Afficher les défis disponibles
  function displayAvailableChallenges(challenges) {
    const container = document.getElementById("available-challenges-list");

    const html = challenges
      .map(
        (c) => `
    <div class="challenge-card">
      <div class="challenge-header">
        <span class="challenge-icon">${c.streak_icon}</span>
        <h4 class="challenge-title">${c.titre}</h4>
      </div>
      <p class="challenge-description">${c.description}</p>
      <div class="challenge-meta">
        <span>📅 ${c.date_debut} → ${c.date_fin}</span>
        <span>🎯 Objectif: ${c.valeur_cible}%</span>
        <span>⏱️ ${c.duree} jours</span>
        <span>👥 Type: ${c.type}</span>
      </div>
      <div class="challenge-actions">
        <button class="btn btn-primary btn-sm" onclick="window.location.href='challenges/addParticipation.php?challenge_id=${c.id}'">
          ✅ Participer
        </button>
      </div>
    </div>
  `,
      )
      .join("");

    container.innerHTML = html;
  }

  // Changer d'onglet
  function showTab(tabId) {
    document
      .querySelectorAll(".tab-content")
      .forEach((tab) => tab.classList.remove("active"));
    document
      .querySelectorAll(".tab-btn")
      .forEach((btn) => btn.classList.remove("active"));

    document.getElementById(tabId).classList.add("active");
    event.target.classList.add("active");

    if (tabId === "available-challenges") {
      loadAvailableChallenges();
    }
  }

  // Charger au démarrage
  window.addEventListener("load", function () {
    loadMyChallenges();
  });
</script>
