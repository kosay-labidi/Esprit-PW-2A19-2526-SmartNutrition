<!-- Scripts inline pour le preloader et le curseur -->
<script>
// Set demo token for testing (remove in production)
if (!localStorage.getItem('gaialumen-token')) {
  localStorage.setItem('gaialumen-token', 'demo-token-' + Date.now());
  localStorage.setItem('gaialumen-user', JSON.stringify({
    id: 1,
    name: 'Utilisateur Demo',
    email: 'demo@smartnutrition.local'
  }));
  console.log('✅ Token de démonstration défini');
}

// Preloader animation
(function(){
  const c=document.getElementById('pl-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=140;c.height=140;
  const fill=document.getElementById('pl-fill');
  let a=0,start=null;
  function draw(ts){
    if(!start)start=ts;
    const p=Math.min((ts-start)/2000*100,100);
    if(fill)fill.style.width=p+'%';
    a+=.04;
    ctx.clearRect(0,0,140,140);
    ctx.save();ctx.translate(70,70);ctx.rotate(a);
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(0,0,48-i*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i===0?'58,134,196':i===1?'91,62,150':'31,61,43'},${.6-i*.15})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.rotate(-a*.3);
    const g=ctx.createLinearGradient(-18,-26,18,26);
    g.addColorStop(0,'#1F3D2B');g.addColorStop(1,'#3A86C4');
    ctx.beginPath();ctx.fillStyle=g;
    ctx.moveTo(0,-26);ctx.bezierCurveTo(19,-12,22,7,0,26);
    ctx.bezierCurveTo(-22,7,-19,-12,0,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);
    ctx.strokeStyle='rgba(242,232,207,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    if(p<100)requestAnimationFrame(draw);
    else setTimeout(()=>{
      const pl=document.getElementById('preloader');
      if(pl)pl.classList.add('hidden');
    },300);
  }
  requestAnimationFrame(draw);
})();

// Custom cursor
(function(){
  const cur=document.getElementById('cursor');
  const trail=document.getElementById('cursor-trail');
  if(!cur||!trail)return;
  let mx=0,my=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    cur.style.left=mx+'px';cur.style.top=my+'px';
  });
  (function loop(){
    tx+=(mx-tx)*.12;ty+=(my-ty)*.12;
    trail.style.left=tx+'px';trail.style.top=ty+'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,.info-card').forEach(el=>{
    el.addEventListener('mouseenter',()=>cur.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cur.classList.remove('hover'));
  });
})();
</script>

<!-- Initialize welcome module on page load -->
<script>
document.addEventListener('DOMContentLoaded', async function() {
  console.log('📄 Dashboard chargé - Initialisation du module welcome');
  
  // Wait for module-loader to be ready
  if (typeof showModule === 'function') {
    await showModule('welcome');
    console.log('✅ Module welcome affiché');
  } else {
    // Si showModule n'est pas disponible, réessayer après un délai
    setTimeout(async () => {
      if (typeof showModule === 'function') {
        await showModule('welcome');
        console.log('✅ Module welcome affiché (retry)');
      }
    }, 500);
  }
});
</script>
