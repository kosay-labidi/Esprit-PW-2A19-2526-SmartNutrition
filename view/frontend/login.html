<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Connexion - GaiaLumen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --green:#1F3D2B;--sand:#F2E8CF;--violet:#5B3E96;--blue:#3A86C4;
  --bg:#0a1a10;--text:#F2E8CF;--muted:#a8b8a0;
  --card-bg:rgba(15,35,24,0.85);--glass:rgba(31,61,43,0.45);
  --shadow:0 20px 60px rgba(0,0,0,0.5);
}
[data-theme="light"]{
  --bg:#f5f0e8;--text:#1F3D2B;--muted:#5a6e5a;
  --card-bg:rgba(242,232,207,0.85);--glass:rgba(242,232,207,0.6);
  --shadow:0 20px 60px rgba(31,61,43,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Lato',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:none;
  transition:background 0.3s,color 0.3s;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;}

/* CURSEUR */
#cursor{
  position:fixed;top:0;left:0;z-index:9999;pointer-events:none;
  width:14px;height:14px;border-radius:50%;
  background:var(--violet);
  box-shadow:0 0 12px var(--violet),0 0 24px var(--blue);
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s;
  mix-blend-mode:screen;
}
#cursor.hover{width:28px;height:28px;background:var(--blue);}
#cursor-trail{
  position:fixed;top:0;left:0;z-index:9998;pointer-events:none;
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid rgba(91,62,150,.5);
  transform:translate(-50%,-50%);
}

/* PRELOADER */
#preloader{
  position:fixed;inset:0;z-index:10000;
  background:#050e08;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s,visibility .8s;
}
#preloader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#pl-canvas{width:140px;height:140px;}
#pl-text{
  margin-top:20px;
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;letter-spacing:.3em;color:var(--sand);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* BACKGROUND 3D */
#bg-canvas{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;
}

/* CONTAINER */
.container{
  position:relative;z-index:2;
  max-width:420px;width:90%;
  background:var(--card-bg);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:20px;
  padding:40px 35px;
  box-shadow:var(--shadow);
  border:1px solid rgba(91,62,150,0.3);
  animation:slideUp .8s ease;
  margin-left:auto;
  margin-right:10%;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

/* LOGO */
.logo{text-align:center;margin-bottom:28px;}
.logo svg{width:50px;height:50px;margin-bottom:12px;}
.logo h1{
  font-size:2rem;
  background:linear-gradient(135deg,var(--sand),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
}
.logo p{
  color:rgba(242,232,207,0.7);
  font-size:0.85rem;
}

/* FORM */
.form-group{margin-bottom:20px;}
.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:0.85rem;
  color:var(--sand);
  font-weight:600;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  background:rgba(31,61,43,0.4);
  border:1px solid rgba(91,62,150,0.3);
  border-radius:10px;
  color:var(--sand);
  font-size:0.95rem;
  transition:all 0.3s;
}
.form-group input:focus{
  outline:none;
  border-color:var(--violet);
  background:rgba(31,61,43,0.6);
  box-shadow:0 0 20px rgba(91,62,150,0.3);
}
.form-group input::placeholder{
  color:rgba(242,232,207,0.4);
}

/* CHECKBOX */
.remember{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:20px;
}
.remember input[type="checkbox"]{
  width:16px;
  height:16px;
  cursor:pointer;
}
.remember label{
  font-size:0.85rem;
  color:var(--muted);
  cursor:pointer;
}

/* BUTTON */
.btn-submit{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,var(--violet),var(--blue));
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:0.95rem;
  font-weight:600;
  cursor:none;
  transition:transform 0.2s,box-shadow 0.3s;
  position:relative;
  overflow:hidden;
}
.btn-submit:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(91,62,150,0.5);
}
.btn-submit::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  transform:translate(-50%,-50%);
  transition:width 0.6s,height 0.6s;
}
.btn-submit:active::before{
  width:300px;
  height:300px;
}

/* LINKS */
.links{
  text-align:center;
  margin-top:20px;
}
.links a{
  color:var(--blue);
  text-decoration:none;
  font-size:0.85rem;
  transition:color 0.3s;
}
.links a:hover{
  color:var(--violet);
  text-decoration:underline;
}
.divider{
  margin:16px 0;
  text-align:center;
  color:rgba(242,232,207,0.5);
  font-size:0.8rem;
  position:relative;
}
.divider::before,
.divider::after{
  content:'';
  position:absolute;
  top:50%;
  width:40%;
  height:1px;
  background:rgba(242,232,207,0.2);
}
.divider::before{left:0;}
.divider::after{right:0;}

/* SOCIAL */
.social-login{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.social-btn{
  flex:1;
  padding:10px;
  border:1px solid rgba(91,62,150,0.3);
  border-radius:10px;
  background:rgba(31,61,43,0.3);
  color:var(--sand);
  cursor:none;
  transition:all 0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:0.85rem;
}
.social-btn:hover{
  background:rgba(91,62,150,0.2);
  border-color:var(--violet);
  transform:translateY(-2px);
}

/* PARTICLES */
.particle{
  position:fixed;
  pointer-events:none;
  z-index:1;
  font-size:20px;
  animation:float 3s ease-out forwards;
}
@keyframes float{
  0%{opacity:1;transform:translateY(0) rotate(0deg);}
  100%{opacity:0;transform:translateY(-100px) rotate(360deg);}
}

/* THEME TOGGLE BUTTON */
#theme-toggle{
  position:fixed;top:20px;right:20px;z-index:1000;
  width:50px;height:50px;border-radius:50%;
  border:2px solid rgba(91,62,150,0.4);
  background:var(--glass);
  backdrop-filter:blur(10px);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
#theme-toggle:hover{
  transform:scale(1.1);
  border-color:var(--violet);
  box-shadow:0 6px 20px rgba(91,62,150,0.4);
}
#theme-toggle svg{
  transition:transform 0.3s;
}
#theme-toggle:hover svg{
  transform:rotate(20deg);
}

/* AI TOGGLE BUTTON */
#ai-toggle{
  position:fixed;bottom:30px;left:30px;z-index:1000;
  width:60px;height:60px;border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--violet),var(--blue));
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
  box-shadow:0 8px 25px rgba(91,62,150,0.4);
}
#ai-toggle:hover{
  transform:scale(1.1) translateY(-2px);
  box-shadow:0 12px 35px rgba(91,62,150,0.6);
}

/* TOOLTIP */
.tooltip{
  position:absolute;
  background:rgba(0,0,0,0.9);
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:0.85rem;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s;
  z-index:10001;
}
#theme-toggle:hover .tooltip,
#ai-toggle:hover .tooltip{
  opacity:1;
}
#theme-toggle .tooltip{
  top:60px;right:0;
}
#ai-toggle .tooltip{
  bottom:70px;left:0;
}

/* EARTH HINT */
.earth-hint{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  font-size:0.9rem;
  z-index:100;
  animation:fadeInOut 4s ease-in-out;
  pointer-events:none;
}
@keyframes fadeInOut{
  0%,100%{opacity:0;}
  10%,90%{opacity:1;}
}

@media(max-width:600px){
  .container{
    margin:20px auto;
    padding:30px 25px;
    max-width:95%;
  }
  #theme-toggle{
    width:45px;height:45px;top:15px;right:15px;
  }
  #ai-toggle{
    width:55px;height:55px;bottom:20px;left:20px;
  }
  .tooltip{display:none;}
}
</style>
</head>

</div>

<div id="ai-panel" style="position:fixed;bottom:100px;left:30px;z-index:999;width:350px;height:500px;background:var(--card-bg);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(91,62,150,0.3);box-shadow:0 20px 60px rgba(0,0,0,0.4);display:none;flex-direction:column;overflow:hidden;transition:all 0.3s;">

<script>
/* ═══════════════════════════════════════════════════════════
   PRELOADER
   ═══════════════════════════════════════════════════════════ */
(function(){
  const c=document.getElementById('pl-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=140;c.height=140;
  let a=0,prog=0;
  function draw(){
    prog=Math.min(prog+2,100);
    a+=.04;
    ctx.clearRect(0,0,140,140);
    ctx.save();ctx.translate(70,70);ctx.rotate(a);
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(0,0,48-i*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i===0?'58,134,196':i===1?'91,62,150':'31,61,43'},${.6-i*.15})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.rotate(-a*.3);
    const g=ctx.createLinearGradient(-18,-26,18,26);
    g.addColorStop(0,'#1F3D2B');g.addColorStop(1,'#3A86C4');
    ctx.beginPath();ctx.fillStyle=g;
    ctx.moveTo(0,-26);ctx.bezierCurveTo(19,-12,22,7,0,26);
    ctx.bezierCurveTo(-22,7,-19,-12,0,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);
    ctx.strokeStyle='rgba(242,232,207,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    if(prog<100)requestAnimationFrame(draw);
    else setTimeout(()=>{
      const pl=document.getElementById('preloader');
      if(pl)pl.classList.add('hidden');
    },300);
  }
  requestAnimationFrame(draw);
})();

/* ═══════════════════════════════════════════════════════════
   CURSEUR
   ═══════════════════════════════════════════════════════════ */
(function(){
  const cur=document.getElementById('cursor');
  const trail=document.getElementById('cursor-trail');
  if(!cur||!trail)return;
  let mx=0,my=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    cur.style.left=mx+'px';cur.style.top=my+'px';
  });
  (function loop(){
    tx+=(mx-tx)*.12;ty+=(my-ty)*.12;
    trail.style.left=tx+'px';trail.style.top=ty+'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,input').forEach(el=>{
    el.addEventListener('mouseenter',()=>cur.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cur.classList.remove('hover'));
  });
})();

/* ═══════════════════════════════════════════════════════════
   PARTICULES AU CLIC
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const emojis=['🍃','🌿','🍀','✨','🌱'];
  for(let i=0;i<6;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=e.clientX+'px';
    p.style.top=e.clientY+'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3000);
  }
});

/* ═══════════════════════════════════════════════════════════
   THREE.JS - BACKGROUND 3D
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('load',function(){
  const canvas=document.getElementById('bg-canvas');
  if(!canvas||typeof THREE==='undefined')return;
  
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
  camera.position.set(0,0,6);
  
  function resize(){
    const w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize',resize);
  
  // Lumières
  scene.add(new THREE.AmbientLight(0xffffff,.3));
  const dl=new THREE.DirectionalLight(0x3A86C4,1);
  dl.position.set(5,3,5);
  scene.add(dl);
  const pl=new THREE.PointLight(0x5B3E96,1.5,20);
  pl.position.set(-3,2,2);
  scene.add(pl);
  
  // Globe Terre (centré et plus grand)
  const loader=new THREE.TextureLoader();
  const earth=new THREE.Mesh(
    new THREE.SphereGeometry(2,64,64),
    new THREE.MeshPhongMaterial({
      map:loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
      specular:new THREE.Color(0x3A86C4),
      shininess:28
    })
  );
  earth.position.set(-4,0,-2);
  scene.add(earth);
  
  const clouds=new THREE.Mesh(
    new THREE.SphereGeometry(2.03,64,64),
    new THREE.MeshPhongMaterial({
      map:loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
      transparent:true,
      opacity:.28
    })
  );
  clouds.position.copy(earth.position);
  scene.add(clouds);
  
  const atm=new THREE.Mesh(
    new THREE.SphereGeometry(2.1,64,64),
    new THREE.MeshPhongMaterial({
      color:0x3A86C4,
      transparent:true,
      opacity:.06,
      side:THREE.FrontSide
    })
  );
  atm.position.copy(earth.position);
  scene.add(atm);
  
  // Particules
  const PC=1200,pp=new Float32Array(PC*3),pc=new Float32Array(PC*3);
  const pal=[
    new THREE.Color(0x1F3D2B),
    new THREE.Color(0x3A86C4),
    new THREE.Color(0x5B3E96),
    new THREE.Color(0xF2E8CF)
  ];
  for(let i=0;i<PC;i++){
    pp[i*3]=(Math.random()-.5)*20;
    pp[i*3+1]=(Math.random()-.5)*20;
    pp[i*3+2]=(Math.random()-.5)*10;
    const c=pal[Math.floor(Math.random()*4)];
    pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b;
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(
    pGeo,
    new THREE.PointsMaterial({
      size:.03,
      vertexColors:true,
      transparent:true,
      opacity:.6
    })
  );
  scene.add(pts);
  
  let t=0;
  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=(e.clientX/window.innerWidth-.5)*2;
    my=(e.clientY/window.innerHeight-.5)*2;
  });
  
  (function anim(){
    requestAnimationFrame(anim);
    t+=.01;
    
    earth.rotation.y+=.002;
    clouds.rotation.y+=.0025;
    
    pts.rotation.y+=.0003;
    pts.rotation.x+=.0001;
    
    camera.position.x+=(mx*.5-camera.position.x)*.05;
    camera.position.y+=(-my*.5-camera.position.y)*.05;
    camera.lookAt(0,0,0);
    
    renderer.render(scene,camera);
  })();
  
  console.log('🔐 Scène 3D Login initialisée');
});

const API_URL = 'http://localhost:5000/api';

async function handleLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.btn-submit');
  const email    = document.getElementById('email-input').value;
  const password = document.getElementById('password-input').value;
  const errorDiv = document.getElementById('login-error');

  // Réinitialiser le message d'erreur
  errorDiv.style.display = 'none';
  errorDiv.textContent = '';

  btn.textContent = 'Connexion en cours...';
  btn.disabled = true;

  try {
    const response = await fetch('http://localhost/Esprit-PW-2A19-2526-SmartNutrition/Controller/user.controller.php?action=login',{
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, mdp: password })
    });

    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      const rawText = await response.text();
      console.error('Réponse PHP brute (pas JSON):', rawText);
      throw new Error('Le serveur PHP ne renvoie pas du JSON. Vérifiez que le backend est bien démarré et que le chemin est correct.');
    }

    const result = await response.json();
    console.log('Résultat login:', result);

    if (result.success) {
      localStorage.setItem('gaialumen-user', JSON.stringify(result.data));
      localStorage.setItem('gaialumen-token', 'session-' + Date.now());

      btn.textContent = '✓ Connexion réussie!';

      setTimeout(() => {
        if (result.data.role === 'admin') {
          window.location.href = '../backend/admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);

    } else {
      btn.textContent = 'Se connecter';
      btn.disabled = false;
      errorDiv.textContent = result.message || 'Identifiants incorrects.';
      errorDiv.style.display = 'block';
    }

  } catch (err) {
    console.error('Erreur login:', err);
    btn.textContent = 'Se connecter';
    btn.disabled = false;
    errorDiv.textContent = err.message || 'Impossible de contacter le serveur.';
    errorDiv.style.display = 'block';
  }
}

const aiToggle=document.getElementById('ai-toggle');
const aiPanel=document.getElementById('ai-panel');
const aiClose=document.getElementById('ai-close');
const aiInput=document.getElementById('ai-input');
const aiSend=document.getElementById('ai-send');
const aiMessages=document.getElementById('ai-messages');

aiToggle.addEventListener('click',()=>{
  aiPanel.style.display=aiPanel.style.display==='flex'?'none':'flex';
});
aiClose.addEventListener('click',()=>{
  aiPanel.style.display='none';
});

function addMessage(text,isUser=false){
  const msg=document.createElement('div');
  msg.style.cssText=`padding:12px;border-radius:12px;font-size:0.9rem;${isUser?'background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;align-self:flex-end;max-width:80%;':'background:rgba(91,62,150,0.2);'}`;
  msg.textContent=text;
  aiMessages.appendChild(msg);
  aiMessages.scrollTop=aiMessages.scrollHeight;
}

function aiRespond(question){
  const q=question.toLowerCase();
  if(q.includes('aide')||q.includes('help')){
    return "Je peux vous aider avec la connexion, la récupération de mot de passe, ou répondre à vos questions sur GaiaLumen. 🌿";
  }else if(q.includes('mot de passe')||q.includes('password')){
    return "Pour réinitialiser votre mot de passe, cliquez sur 'Mot de passe oublié?' sous le formulaire. 🔑";
  }else if(q.includes('gaialumen')||q.includes('application')){
    return "GaiaLumen est votre plateforme de nutrition écologique et intelligente. Nous vous aidons à manger sainement tout en respectant la planète! 🌍";
  }else if(q.includes('compte')||q.includes('inscription')){
    return "Pour créer un compte, retournez à la page d'accueil et cliquez sur 'Commencer'. 📝";
  }else{
    return "Je suis là pour vous aider! Posez-moi des questions sur la connexion, votre compte, ou GaiaLumen. 😊";
  }
}

aiSend.addEventListener('click',()=>{
  const text=aiInput.value.trim();
  if(text){
    addMessage(text,true);
    aiInput.value='';
    setTimeout(()=>{
      addMessage(aiRespond(text));
    },500);
  }
});
aiInput.addEventListener('keypress',e=>{
  if(e.key==='Enter'){
    aiSend.click();
  }
});
