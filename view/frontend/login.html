<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Connexion - GaiaLumen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ============================================
   VARIABLES & RESET
   ============================================ */
:root {
  --green: #1F3D2B;
  --sand: #F2E8CF;
  --violet: #6B4E9E;
  --violet-light: #8B6FC9;
  --blue: #4A9FD8;
  --blue-dark: #2E7AB6;
  --gold: #D4AF37;
  --bg-dark: #0A120E;
  --bg-light: #F8F5ED;
  --text-dark: #1A2E22;
  --text-light: #F2E8CF;
  --muted-dark: #8A9A82;
  --muted-light: #6B7A63;
  --card-bg-dark: rgba(15, 30, 20, 0.88);
  --card-bg-light: rgba(248, 245, 237, 0.92);
  --glass-dark: rgba(31, 61, 43, 0.4);
  --glass-light: rgba(242, 232, 207, 0.5);
  --shadow-dark: 0 25px 70px rgba(0, 0, 0, 0.6);
  --shadow-light: 0 25px 70px rgba(31, 61, 43, 0.12);
  --border-glow: rgba(107, 78, 158, 0.35);
  --transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-theme="light"] {
  --bg: var(--bg-light);
  --text: var(--text-dark);
  --muted: var(--muted-light);
  --card-bg: var(--card-bg-light);
  --glass: var(--glass-light);
  --shadow: var(--shadow-light);
}

[data-theme="dark"] {
  --bg: var(--bg-dark);
  --text: var(--text-light);
  --muted: var(--muted-dark);
  --card-bg: var(--card-bg-dark);
  --glass: var(--glass-dark);
  --shadow: var(--shadow-dark);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
  cursor: none;
  transition: var(--transition);
}

h1, h2, h3, .logo-text {
  font-family: 'Cormorant Garamond', serif;
}

/* ============================================
   CUSTOM CURSOR
   ============================================ */
#cursor {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 15px var(--violet), 0 0 30px var(--blue);
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s, background 0.2s;
  mix-blend-mode: screen;
}

#cursor.hover {
  width: 32px;
  height: 32px;
  background: var(--blue);
  box-shadow: 0 0 20px var(--blue), 0 0 40px var(--violet);
}

#cursor-trail {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9998;
  pointer-events: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid rgba(107, 78, 158, 0.4);
  transform: translate(-50%, -50%);
  transition: width 0.3s, height 0.3s;
}

/* ============================================
   PRELOADER
   ============================================ */
#preloader {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: #0A0E0C;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s, visibility 0.8s;
}

#preloader.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#pl-canvas {
  width: 160px;
  height: 160px;
}

#pl-text {
  margin-top: 24px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  letter-spacing: 0.4em;
  color: var(--sand);
  font-weight: 500;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: scale(0.98); }
  50% { opacity: 1; transform: scale(1); }
}

/* ============================================
   BACKGROUND 3D
   ============================================ */
#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ============================================
   BACK BUTTON (TOP LEFT)
   ============================================ */
#back-home {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 1000;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1.5px solid rgba(107, 78, 158, 0.4);
  background: var(--glass);
  backdrop-filter: blur(12px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
  text-decoration: none;
}

#back-home:hover {
  transform: scale(1.1) translateX(-3px);
  border-color: var(--violet);
  box-shadow: 0 8px 25px rgba(107, 78, 158, 0.4);
}

#back-home svg {
  stroke: var(--text);
  transition: var(--transition);
}

#back-home:hover svg {
  stroke: var(--violet-light);
  transform: translateX(-2px);
}

/* ============================================
   MAIN CONTAINER
   ============================================ */
.container {
  position: relative;
  z-index: 2;
  max-width: 480px;
  width: 90%;
  background: var(--card-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: 32px;
  padding: 48px 40px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(107, 78, 158, 0.25);
  animation: slideUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  margin: 0 8% 0 auto;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(50px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ============================================
   LOGO SECTION
   ============================================ */
.logo {
  text-align: center;
  margin-bottom: 36px;
}

.logo svg {
  width: 60px;
  height: 60px;
  margin-bottom: 16px;
  filter: drop-shadow(0 0 12px rgba(107, 78, 158, 0.5));
  transition: var(--transition);
}

.logo:hover svg {
  transform: scale(1.05);
  filter: drop-shadow(0 0 20px rgba(107, 78, 158, 0.8));
}

.logo h1 {
  font-size: 2.2rem;
  background: linear-gradient(135deg, var(--sand) 0%, var(--gold) 50%, var(--blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.logo p {
  color: var(--muted);
  font-size: 0.85rem;
  letter-spacing: 0.5px;
  font-weight: 400;
}

/* ============================================
   FORM STYLES
   ============================================ */
.form-group {
  margin-bottom: 24px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  opacity: 0.85;
  letter-spacing: 0.3px;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(31, 61, 43, 0.3);
  border: 1.5px solid rgba(107, 78, 158, 0.25);
  border-radius: 16px;
  color: var(--text);
  font-size: 0.95rem;
  font-family: 'Inter', sans-serif;
  transition: var(--transition);
}

.form-group input:focus {
  outline: none;
  border-color: var(--violet);
  background: rgba(31, 61, 43, 0.5);
  box-shadow: 0 0 20px rgba(107, 78, 158, 0.25);
}

.form-group input::placeholder {
  color: rgba(242, 232, 207, 0.35);
  font-weight: 400;
}

/* ============================================
   CHECKBOX
   ============================================ */
.remember {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.remember input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--violet);
}

.remember label {
  font-size: 0.85rem;
  color: var(--muted);
  cursor: pointer;
  transition: var(--transition);
}

.remember label:hover {
  color: var(--text);
}

/* ============================================
   BUTTON
   ============================================ */
.btn-submit {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--violet) 0%, var(--blue) 100%);
  border: none;
  border-radius: 16px;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: none;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(107, 78, 158, 0.5);
}

.btn-submit:active {
  transform: translateY(0);
}

.btn-submit::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
  transform: translate(-50%, -50%);
  transition: width 0.5s, height 0.5s;
}

.btn-submit:active::before {
  width: 400px;
  height: 400px;
}

.btn-submit:disabled {
  opacity: 0.7;
  transform: none;
  cursor: not-allowed;
}

/* ============================================
   ERROR MESSAGE
   ============================================ */
#login-error {
  margin-bottom: 20px;
  padding: 14px 18px;
  border-radius: 14px;
  background: rgba(220, 53, 69, 0.12);
  border: 1px solid rgba(220, 53, 69, 0.4);
  color: #ff7b89;
  font-size: 0.88rem;
  text-align: center;
  animation: shake 0.4s ease;
  backdrop-filter: blur(4px);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* ============================================
   LINKS SECTION (sans lignes)
   ============================================ */
.links {
  text-align: center;
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
}

.links a {
  color: var(--blue);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  transition: var(--transition);
  display: inline-block;
}

.links a:hover {
  color: var(--violet-light);
  text-decoration: none;
  transform: translateY(-1px);
}

/* ============================================
   OAUTH BUTTONS (côte à côte)
   ============================================ */
.oauth-buttons {
  display: flex;
  gap: 12px;
  margin-top: 28px;
}

.social-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 8px;
  border-radius: 16px;
  font-size: 0.8rem;
  font-weight: 500;
  text-decoration: none;
  transition: var(--transition);
  cursor: none;
  white-space: nowrap;
}

.social-btn.btn-google {
  background: rgba(255, 255, 255, 0.96);
  color: #2c3e2b;
  border: 1px solid rgba(0, 0, 0, 0.08);
}

.social-btn.btn-google:hover {
  background: #ffffff;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.social-btn.btn-twitter {
  background: #000000;
  color: white;
  border: none;
}

.social-btn.btn-twitter:hover {
  background: #1a1a1a;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.social-btn img,
.social-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* ============================================
   PARTICLES
   ============================================ */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  font-size: 22px;
  animation: floatUp 3s ease-out forwards;
  filter: drop-shadow(0 0 4px rgba(107, 78, 158, 0.5));
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) rotate(0deg) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-120px) rotate(360deg) scale(0.5);
  }
}

/* ============================================
   THEME TOGGLE
   ============================================ */
#theme-toggle {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 1000;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1.5px solid rgba(107, 78, 158, 0.4);
  background: var(--glass);
  backdrop-filter: blur(12px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
}

#theme-toggle:hover {
  transform: scale(1.1) rotate(8deg);
  border-color: var(--violet);
  box-shadow: 0 8px 25px rgba(107, 78, 158, 0.4);
}

/* ============================================
   AI ASSISTANT
   ============================================ */
#ai-toggle {
  position: fixed;
  bottom: 30px;
  left: 30px;
  z-index: 1000;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--violet), var(--blue));
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  box-shadow: 0 10px 30px rgba(107, 78, 158, 0.4);
}

#ai-toggle:hover {
  transform: scale(1.1) translateY(-3px);
  box-shadow: 0 15px 40px rgba(107, 78, 158, 0.6);
}

#ai-toggle:active {
  transform: scale(0.98);
}

/* AI Panel */
#ai-panel {
  position: fixed;
  bottom: 110px;
  left: 30px;
  z-index: 999;
  width: 380px;
  height: 520px;
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  border-radius: 28px;
  border: 1px solid rgba(107, 78, 158, 0.3);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
  display: none;
  flex-direction: column;
  overflow: hidden;
  animation: slideInLeft 0.3s ease;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* ============================================
   TOOLTIP
   ============================================ */
.tooltip {
  position: absolute;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10001;
  font-family: 'Inter', sans-serif;
}

#theme-toggle:hover .tooltip,
#ai-toggle:hover .tooltip,
#back-home:hover .tooltip {
  opacity: 1;
}

#theme-toggle .tooltip {
  top: 60px;
  right: 0;
}

#ai-toggle .tooltip {
  bottom: 75px;
  left: 10px;
}

#back-home .tooltip {
  top: 60px;
  left: 0;
}

/* ============================================
   EARTH HINT
   ============================================ */
.earth-hint {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 12px 28px;
  border-radius: 40px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 100;
  animation: fadeInOut 4s ease-in-out infinite;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

@keyframes fadeInOut {
  0%, 100% { opacity: 0; transform: translateX(-50%) translateY(5px); }
  10%, 90% { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 768px) {
  body {
    justify-content: center;
  }
  
  .container {
    margin: 20px auto;
    padding: 36px 28px;
    max-width: 95%;
  }
  
  #back-home {
    top: 16px;
    left: 16px;
    width: 45px;
    height: 45px;
  }
  
  #theme-toggle {
    width: 45px;
    height: 45px;
    top: 16px;
    right: 16px;
  }
  
  #ai-toggle {
    width: 56px;
    height: 56px;
    bottom: 20px;
    left: 20px;
  }
  
  #ai-panel {
    width: calc(100% - 40px);
    left: 20px;
    bottom: 90px;
    height: 480px;
  }
  
  .tooltip {
    display: none;
  }
  
  .earth-hint {
    font-size: 0.7rem;
    padding: 8px 16px;
    white-space: nowrap;
    bottom: 15px;
  }
  
  .logo h1 {
    font-size: 1.8rem;
  }
  
  .oauth-buttons {
    gap: 8px;
  }
  
  .social-btn {
    padding: 10px 6px;
    font-size: 0.7rem;
    white-space: nowrap;
  }
  
  .social-btn span {
    display: none;
  }
  
  .social-btn img,
  .social-btn svg {
    width: 20px;
    height: 20px;
  }
}

@media (max-width: 480px) {
  .container {
    padding: 30px 22px;
  }
  
  .links {
    gap: 16px;
  }
  
  .links a {
    font-size: 0.75rem;
  }
  
  .earth-hint {
    font-size: 0.65rem;
    padding: 6px 12px;
    white-space: nowrap;
  }
}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursor"></div>
<div id="cursor-trail"></div>

<!-- PRELOADER -->
<div id="preloader">
  <canvas id="pl-canvas"></canvas>
  <div id="pl-text">GAIALUMEN</div>
</div>

<!-- BACKGROUND 3D -->
<canvas id="bg-canvas"></canvas>

<!-- EARTH HINT -->
<div class="earth-hint">🌍 Cliquez et faites glisser pour faire tourner la Terre</div>

<!-- BACK BUTTON (flèche en haut à gauche) -->
<a href="index.html" id="back-home" aria-label="Retour à l'accueil">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
  <span class="tooltip">Accueil</span>
</a>

<!-- THEME TOGGLE -->
<button id="theme-toggle" aria-label="Changer le thème">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <span class="tooltip">Changer le thème</span>
</button>

<!-- AI ASSISTANT BUTTON -->
<button id="ai-toggle" aria-label="Assistant AI">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <circle cx="9" cy="10" r="1" fill="#fff"/>
    <circle cx="15" cy="10" r="1" fill="#fff"/>
    <path d="M9 14c.5.5 1.5 1 3 1s2.5-.5 3-1"/>
  </svg>
  <span class="tooltip">Assistant AI</span>
</button>

<!-- AI ASSISTANT PANEL -->
<div id="ai-panel">
  <div style="padding: 20px 24px; border-bottom: 1px solid rgba(107, 78, 158, 0.2); display: flex; justify-content: space-between; align-items: center;">
    <h3 style="margin: 0; font-size: 1.2rem; color: var(--text); font-weight: 600;">✨ Assistant GaiaLumen</h3>
    <button id="ai-close" style="background: none; border: none; color: var(--text); font-size: 28px; cursor: pointer; padding: 0; width: 32px; height: 32px; opacity: 0.7; transition: opacity 0.2s;">×</button>
  </div>
  <div id="ai-messages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
    <div style="background: linear-gradient(135deg, rgba(107, 78, 158, 0.2), rgba(74, 159, 216, 0.1)); padding: 14px; border-radius: 18px; font-size: 0.9rem; border-left: 3px solid var(--violet);">
      👋 Bonjour ! Je suis votre assistant GaiaLumen. Comment puis-je vous aider aujourd'hui ?
    </div>
  </div>
  <div style="padding: 18px 20px; border-top: 1px solid rgba(107, 78, 158, 0.2);">
    <div style="display: flex; gap: 12px;">
      <input id="ai-input" type="text" placeholder="Posez votre question..." style="flex: 1; padding: 12px 16px; background: rgba(31, 61, 43, 0.4); border: 1px solid rgba(107, 78, 158, 0.3); border-radius: 18px; color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif;">
      <button id="ai-send" style="padding: 12px 22px; background: linear-gradient(135deg, var(--violet), var(--blue)); border: none; border-radius: 18px; color: #fff; cursor: pointer; font-weight: 600; transition: transform 0.2s;">
        ✨
      </button>
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="28" stroke="url(#ag)" stroke-width="1.5" opacity=".6"/>
      <circle cx="30" cy="30" r="22" stroke="url(#ag)" stroke-width=".8" opacity=".3"/>
      <defs>
        <radialGradient id="ag" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4A9FD8"/>
          <stop offset="100%" stop-color="#6B4E9E"/>
        </radialGradient>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1F3D2B"/>
          <stop offset="100%" stop-color="#4A9FD8"/>

<script>
/* ═══════════════════════════════════════════════════════════
   PRELOADER
   ═══════════════════════════════════════════════════════════ */
(function(){
  const c=document.getElementById('pl-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=140;c.height=140;
  let a=0,prog=0;
  function draw(){
    prog=Math.min(prog+2,100);
    a+=.04;
    ctx.clearRect(0,0,140,140);
    ctx.save();ctx.translate(70,70);ctx.rotate(a);
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(0,0,48-i*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i===0?'74,159,216':i===1?'107,78,158':'31,61,43'},${.6-i*.15})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.rotate(-a*.3);
    const g=ctx.createLinearGradient(-18,-26,18,26);
    g.addColorStop(0,'#1F3D2B');g.addColorStop(1,'#4A9FD8');
    ctx.beginPath();ctx.fillStyle=g;
    ctx.moveTo(0,-26);ctx.bezierCurveTo(19,-12,22,7,0,26);
    ctx.bezierCurveTo(-22,7,-19,-12,0,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);
    ctx.strokeStyle='rgba(242,232,207,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    if(prog<100)requestAnimationFrame(draw);
    else setTimeout(()=>{
      const pl=document.getElementById('preloader');
      if(pl)pl.classList.add('hidden');
    },300);
  }
  requestAnimationFrame(draw);
})();

/* ═══════════════════════════════════════════════════════════
   CURSEUR
   ═══════════════════════════════════════════════════════════ */
(function(){
  const cur=document.getElementById('cursor');
  const trail=document.getElementById('cursor-trail');
  if(!cur||!trail)return;
  let mx=0,my=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    cur.style.left=mx+'px';cur.style.top=my+'px';
  });
  (function loop(){
    tx+=(mx-tx)*.12;ty+=(my-ty)*.12;
    trail.style.left=tx+'px';trail.style.top=ty+'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,input,.social-btn').forEach(el=>{
    el.addEventListener('mouseenter',()=>cur.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cur.classList.remove('hover'));
  });
})();

/* ═══════════════════════════════════════════════════════════
   THREE.JS - BACKGROUND 3D
   ═══════════════════════════════════════════════════════════ */
window.addEventListener('load',function(){
  const canvas=document.getElementById('bg-canvas');
  if(!canvas||typeof THREE==='undefined')return;
  
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
  camera.position.set(0,0,6);
  
  function resize(){
    const w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize',resize);
  
  scene.add(new THREE.AmbientLight(0xffffff,.3));
  const dl=new THREE.DirectionalLight(0x4A9FD8,1);
  dl.position.set(5,3,5);
  scene.add(dl);
  const pl=new THREE.PointLight(0x6B4E9E,1.5,20);
  pl.position.set(-3,2,2);
  scene.add(pl);
  
  const loader=new THREE.TextureLoader();
  const earth=new THREE.Mesh(
    new THREE.SphereGeometry(2,64,64),
    new THREE.MeshPhongMaterial({
      map:loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
      specular:new THREE.Color(0x4A9FD8),
      shininess:28
    })
  );
  earth.position.set(-4,0,-2);
  scene.add(earth);
  
  const clouds=new THREE.Mesh(
    new THREE.SphereGeometry(2.03,64,64),
    new THREE.MeshPhongMaterial({
      map:loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
      transparent:true,
      opacity:.28
    })
  );
  clouds.position.copy(earth.position);
  scene.add(clouds);
  
  const atm=new THREE.Mesh(
    new THREE.SphereGeometry(2.1,64,64),
    new THREE.MeshPhongMaterial({
      color:0x4A9FD8,
      transparent:true,
      opacity:.06,
      side:THREE.FrontSide
    })
  );
  atm.position.copy(earth.position);
  scene.add(atm);
  
  const PC=1200,pp=new Float32Array(PC*3),pc=new Float32Array(PC*3);
  const pal=[
    new THREE.Color(0x1F3D2B),
    new THREE.Color(0x4A9FD8),
    new THREE.Color(0x6B4E9E),
    new THREE.Color(0xF2E8CF)
  ];
  for(let i=0;i<PC;i++){
    pp[i*3]=(Math.random()-.5)*20;
    pp[i*3+1]=(Math.random()-.5)*20;
    pp[i*3+2]=(Math.random()-.5)*10;
    const c=pal[Math.floor(Math.random()*4)];
    pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b;
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(
    pGeo,
    new THREE.PointsMaterial({
      size:.03,
      vertexColors:true,
      transparent:true,
      opacity:.6
    })
  );
  scene.add(pts);
  
  let t=0;
  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{
    mx=(e.clientX/window.innerWidth-.5)*2;
    my=(e.clientY/window.innerHeight-.5)*2;
  });
  
  (function anim(){
    requestAnimationFrame(anim);
    t+=.01;
    
    earth.rotation.y+=.002;
    clouds.rotation.y+=.0025;
    
    pts.rotation.y+=.0003;
    pts.rotation.x+=.0001;
    
    camera.position.x+=(mx*.5-camera.position.x)*.05;
    camera.position.y+=(-my*.5-camera.position.y)*.05;
    camera.lookAt(0,0,0);
    
    renderer.render(scene,camera);
  })();
  
  console.log('🔐 Scène 3D Login initialisée');
});

/* ═══════════════════════════════════════════════════════════
   FORMULAIRE LOGIN
   ═══════════════════════════════════════════════════════════ */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const btn = document.getElementById('btn-login');
  const errorDiv = document.getElementById('login-error');
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;

  errorDiv.style.display = 'none';
  errorDiv.textContent = '';

  if (!email && !password) {
    errorDiv.textContent = "L'email et le mot de passe sont obligatoires";
    errorDiv.style.display = 'block';
    return;
  }

  if (!email) {
    errorDiv.textContent = "L'email est obligatoire.";
    errorDiv.style.display = 'block';
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    errorDiv.textContent = "Format d'email invalide. Exemple: nom@domaine.com";
    errorDiv.style.display = 'block';
    return;
  }

  if (!password) {
    errorDiv.textContent = "Le mot de passe est obligatoire.";
    errorDiv.style.display = 'block';
    return;
  }

  btn.textContent = 'Connexion...';
  btn.disabled = true;

  try {
    const response = await fetch('http://localhost/Esprit-PW-2A19-2526-SmartNutrition/view/backend/users/login.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, mdp: password, remember_me: document.getElementById('remember').checked })
    });

    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      const rawText = await response.text();
      console.error('Réponse PHP brute:', rawText);
      throw new Error('Le serveur PHP ne renvoie pas du JSON');
    }

    const result = await response.json();
    console.log('Résultat login complet:', result);

    if (result.success) {
      const userData = result.data;
      const userId = userData.id_utilisateur || userData.id || userData.user_id;
      
      if (userId) {
        sessionStorage.setItem('user_id', userId);
        localStorage.setItem('user_id', userId);
      }
      
      sessionStorage.setItem('user_email', userData.email);
      sessionStorage.setItem('user_nom', userData.nom || '');
      sessionStorage.setItem('user_prenom', userData.prenom || '');
      sessionStorage.setItem('user_role', userData.role || '');
      
      localStorage.setItem('user_email', userData.email);
      localStorage.setItem('user_nom', userData.nom || '');
      localStorage.setItem('user_prenom', userData.prenom || '');
      localStorage.setItem('user_role', userData.role || '');
      
      localStorage.setItem('gaialumen-user', JSON.stringify(userData));
      localStorage.setItem('gaialumen-token', 'session-' + Date.now());

      if (document.getElementById('remember').checked) {
        localStorage.setItem('gaialumen-remember-email', email);
      } else {
        localStorage.removeItem('gaialumen-remember-email');
      }

      btn.textContent = '✓ Connecté !';

      setTimeout(() => {
        if (userData.role === 'admin') {
          window.location.href = '../backend/admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);

    } else {
      btn.textContent = 'Se connecter';
      btn.disabled = false;
      errorDiv.textContent = result.message || 'Identifiants incorrects.';
      errorDiv.style.display = 'block';
    }

  } catch (err) {
    console.error('Erreur login:', err);
    btn.textContent = 'Se connecter';
    btn.disabled = false;
    errorDiv.textContent = err.message || 'Impossible de contacter le serveur.';
    errorDiv.style.display = 'block';
  }
});

localStorage.removeItem('gaialumen-token');
localStorage.removeItem('gaialumen-user');

/* ═══════════════════════════════════════════════════════════
   AI ASSISTANT
   ═══════════════════════════════════════════════════════════ */
const aiToggle=document.getElementById('ai-toggle');
const aiPanel=document.getElementById('ai-panel');
const aiClose=document.getElementById('ai-close');
const aiInput=document.getElementById('ai-input');
const aiSend=document.getElementById('ai-send');
const aiMessages=document.getElementById('ai-messages');

aiToggle.addEventListener('click',()=>{
  aiPanel.style.display=aiPanel.style.display==='flex'?'none':'flex';
});
aiClose.addEventListener('click',()=>{
  aiPanel.style.display='none';
});

function addMessage(text,isUser=false){
  const msg=document.createElement('div');
  msg.style.cssText=`padding:12px 16px;border-radius:18px;font-size:0.9rem;line-height:1.4;${isUser?'background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;align-self:flex-end;max-width:80%;border-bottom-right-radius:4px;':'background:rgba(107,78,158,0.2);align-self:flex-start;max-width:80%;border-bottom-left-radius:4px;'}`;
  msg.textContent=text;
  aiMessages.appendChild(msg);
  aiMessages.scrollTop=aiMessages.scrollHeight;
}

function aiRespond(question){
  const q=question.toLowerCase();
  if(q.includes('aide')||q.includes('help')){
    return "Je peux vous aider avec la connexion, la récupération de mot de passe, ou répondre à vos questions sur GaiaLumen. 🌿 Que puis-je faire pour vous ?";
  }else if(q.includes('mot de passe')||q.includes('password')){
    return "Pour réinitialiser votre mot de passe, cliquez sur 'Mot de passe oublié ?' sous le formulaire. 🔑 Un email vous sera envoyé pour créer un nouveau mot de passe.";
  }else if(q.includes('gaialumen')||q.includes('application')){
    return "GaiaLumen est votre plateforme de nutrition écologique et intelligente. Nous vous aidons à manger sainement tout en respectant la planète ! 🌍 Découvrez nos recettes et conseils personnalisés.";
  }else if(q.includes('compte')||q.includes('inscription')){
    return "Pour créer un compte, cliquez sur 'Créer un compte' sous le formulaire de connexion. L'inscription est gratuite et rapide ! 📝";
  }else if(q.includes('connexion')||q.includes('login')){
    return "Pour vous connecter, entrez votre email et mot de passe, puis cliquez sur 'Se connecter'. Vous pouvez aussi utiliser Google ou X (Twitter) ! 🔐";
  }else{
    return "Je suis là pour vous aider ! Posez-moi des questions sur la connexion, votre compte, ou GaiaLumen. 😊 N'hésitez pas à me demander de l'aide !";
  }
}

aiSend.addEventListener('click',()=>{
  const text=aiInput.value.trim();
  if(text){
    addMessage(text,true);
    aiInput.value='';
    setTimeout(()=>{
      addMessage(aiRespond(text));
    },500);
  }
});
aiInput.addEventListener('keypress',e=>{
  if(e.key==='Enter'){
    aiSend.click();
  }
});

const googleLoginBtn = document.getElementById('google-login-btn');
if (googleLoginBtn) {
    googleLoginBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = '../backend/auth/google-auth.php?action=login';
    });
}

const urlParams = new URLSearchParams(window.location.search);
const error = urlParams.get('error');
if (error === 'google_auth_failed') {
    const errorDiv = document.getElementById('login-error');
    if (errorDiv) {
        errorDiv.textContent = 'La connexion Google a échoué. Veuillez réessayer.';
        errorDiv.style.display = 'block';
        window.history.replaceState({}, document.title, window.location.pathname);
    }
}
