<!-- ═══════════════════════════════════════════════════════════
     MODULE DÉFIS COLLABORATIFS - GaiaLumen
     Interface complète avec steakers 3D, classement, formulaire
     ═══════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="css/challenges-steakers.css" />

<section id="challenges" class="content-section module-section">
  <!-- En-tête -->
  <div class="section-header challenges-header">
    <div class="challenges-title-group">
      <h2>Défis Collaboratifs</h2>
      <p>Participez aux défis et gagnez des steakers 3D!</p>
    </div>
  </div>

  <!-- Filtres et recherche -->
  <div class="challenges-filters">
    <div class="filter-group">
      <input
        type="text"
        id="challenge-search"
        class="filter-input"
        placeholder="Rechercher un défi..."
      />

      <select id="challenge-status-filter" class="filter-select">
        <option value="">Tous les statuts</option>
        <option value="actif">Actifs</option>
        <option value="termine">Terminés</option>
        <option value="futur">À venir</option>
      </select>

      <button id="challenge-refresh" class="btn-icon" title="Actualiser">
        Actualiser
      </button>
    </div>
  </div>

  <!-- Layout principal: Liste (70%) + Classement (30%) -->
  <div class="challenges-layout">
    <!-- Liste des défis -->
    <div class="challenges-list">
      <!-- Loading -->
      <div id="challenges-loading" class="challenges-loading">
        <div class="spinner"></div>
        <p>Chargement des défis...</p>
      </div>

      <!-- Empty state -->
      <div id="challenges-empty" class="challenges-empty" style="display: none">
        <div class="empty-icon">Aucun résultat</div>
        <h3>Aucun défi trouvé</h3>
        <p>Essayez de modifier vos filtres de recherche</p>
      </div>

      <!-- Grille des défis -->
      <div id="challenges-grid" class="challenges-grid" style="display: none">
        <!-- Les cartes seront générées par JavaScript -->
      </div>
    </div>

    <!-- Classement sidebar -->
    <aside class="challenges-ranking">
      <div class="ranking-header">
        <div class="ranking-title-group">
          <h3 class="ranking-title">Classement</h3>
          <select id="ranking-challenge-filter" class="ranking-select">
            <option value="">Global</option>
            <!-- Rempli par JS -->
          </select>
        </div>
      </div>

      <div id="ranking-loader" class="ranking-loader" style="display: none">
        <div class="spinner-small"></div>
        <span>Chargement...</span>
      </div>

      <!-- Section "Mon Rang" -->
      <div id="my-ranking-card" class="my-ranking-card">
        <!-- Généré par JS -->
      </div>

      <!-- Podium Top 3 -->
      <div id="ranking-podium" class="ranking-podium">
        <!-- Généré par JS -->
      </div>

      <div class="ranking-separator"></div>

      <div id="ranking-list" class="ranking-list">
        <!-- Les participants seront générés par JavaScript -->
      </div>
    </aside>
  </div>

<!-- ═══════════════════════════════════════════════════════════
     MODAL UNIFIÉ (DÉTAILS, FORMULAIRE, DASHBOARD)
     ═══════════════════════════════════════════════════════════ -->
<div id="challenge-modal" class="modal-overlay">
  <div class="modal-container modal-large">
    <div id="challenge-modal-body" class="modal-body">
      <!-- Contenu généré dynamiquement par JS -->
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MODAL PROFIL UTILISATEUR & COLLECTION
     ═══════════════════════════════════════════════════════════ -->
<div id="user-profile-modal" class="modal-overlay">
  <div class="modal-container">
    <button
      onclick="window.closeUserProfileModal()"
      class="modal-close"
      title="Fermer"
    >
      ×
    </button>
    <div id="user-profile-body" class="modal-body">
      <!-- Contenu généré par JS -->
    </div>
  </div>
</div>

<div id="participation-drawer" class="participation-drawer" aria-hidden="true"> 
  <div class="drawer-backdrop" onclick="window.closeDrawer()"></div> 
  <div class="drawer-panel" role="dialog" aria-modal="true"> 
    <button class="drawer-close" onclick="window.closeDrawer()" aria-label="Fermer">×</button> 
    <div id="drawer-challenge-summary" class="drawer-summary"></div> 
    <div id="drawer-form-wrapper" class="drawer-form-wrapper"></div> 
  </div> 
</div>

</section>

<!-- ═══════════════════════════════════════════════════════════
     STYLES SPÉCIFIQUES AU MODULE
     ═══════════════════════════════════════════════════════════ -->
<style>
  /* Layout principal */
  .challenges-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 20px;
  }

  .challenges-title-group {
    flex: 1;
    min-width: 300px;
  }

  .challenges-title-group h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.2rem, 5vw, 3rem);
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.9;
  }

  .challenges-title-group p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  .challenges-nav-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-nav {
    padding: 10px 20px;
    border: 1.5px solid rgba(91, 62, 150, 0.3);
    border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    color: var(--text, #f2e8cf);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-nav:hover {
    background: rgba(91, 62, 150, 0.2);
    border-color: var(--violet);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(91, 62, 150, 0.3);
  }

  .challenges-filters {
    margin-bottom: 32px;
    background: rgba(255, 255, 255, 0.03);
    padding: 20px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .filter-group {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .filter-input,
  .filter-select {
    padding: 12px 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.2);
    color: #fff;
    font-size: 0.95rem;
    transition: all 0.3s ease;
  }

  .filter-input {
    flex: 1;
    min-width: 0;
  }

  .filter-select {
    width: 200px;
  }

  .filter-input:focus,
  .filter-select:focus {
    border-color: var(--blue);
    background: rgba(58, 134, 196, 0.1);
    box-shadow: 0 0 0 4px rgba(58, 134, 196, 0.15);
  }

  #challenge-refresh {
    padding: 12px 24px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  #challenge-refresh:hover {
    background: #4a9bd9;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(58, 134, 196, 0.4);
  }

  #challenge-refresh::before {
    content: "🔄";
    font-size: 1.1rem;
  }

  /* Layout liste + classement */
  .challenges-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 30px;
    align-items: start;
  }

  /* Liste des défis */
  .challenges-list {
    min-height: 400px;
  }

  .challenges-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(91, 62, 150, 0.1);
    border-top-color: var(--violet);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .challenges-empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 4rem;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  /* Grille des cartes */
  .challenges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  /* Carte défi */
  .challenge-card {
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: auto;
    overflow: visible;
    cursor: default;
  }

  .challenge-card-main {
    position: relative;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .challenge-card:hover .challenge-card-main {
    transform: translateY(-10px);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border-color: rgba(58, 134, 196, 0.3);
  }

  /* Carte active pendant que le drawer est ouvert */
  .challenge-card-main.card-active { 
    border-color: var(--violet) !important; 
    box-shadow: 0 0 0 2px rgba(91,62,150,0.4), 0 12px 40px rgba(0,0,0,0.5) !important; 
    transform: translateY(-4px);
  }

  .challenge-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .challenge-steaker {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
  }

  .challenge-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 5;
    backdrop-filter: blur(8px);
  }

  .challenge-badge.actif {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: #fff;
  }

  .challenge-badge.termine {
    background: linear-gradient(135deg, #95a5a6, #bdc3c7);
    color: #fff;
  }

  .challenge-badge.futur {
    background: linear-gradient(135deg, #3498db, #5dade2);
    color: #fff;
  }

  .challenge-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  .challenge-title {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  .challenge-description {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
  }

  .challenge-stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 14px;
    margin-top: auto;
    border: 1px solid rgba(255, 255, 255, 0.03);
  }

  .challenge-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .challenge-stat span:first-child {
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* Barre de progression */
  .progress-wrapper {
    margin-top: 8px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .progress-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .progress-value {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .progress-bar-container {
    position: relative;
    width: 100%;
    height: 10px;
    background: rgba(149, 165, 166, 0.2);
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 1.5s ease;
    position: relative;
    animation: fillProgress 1.5s ease;
  }

  .progress-bar-fill.red {
    background: linear-gradient(90deg, var(--progress-red), #c0392b);
  }

  .progress-bar-fill.orange {
    background: linear-gradient(90deg, var(--progress-orange), #e67e22);
  }

  .progress-bar-fill.green {
    background: linear-gradient(90deg, var(--progress-green), #2ecc71);
  }

  @keyframes fillProgress {
    from {
      width: 0%;
    }
  }

  .progress-bar-container:hover .progress-bar-fill {
    transform: scaleY(1.5);
    transition: transform 0.3s ease;
  }

  .progress-bar-container:hover::after {
    content: attr(data-progress) "%";
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    animation: tooltipFadeIn 0.2s ease;
    z-index: 10;
  }

  @keyframes tooltipFadeIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(-5px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  /* Classement sidebar */
  .challenges-ranking {
    position: sticky;
    top: 20px;
    height: fit-content;
    max-height: calc(100vh - 40px);
    background: var(--surface);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(168, 184, 160, 0.1);
    border-radius: 18px;
    padding: 20px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(91,62,150,0.3) transparent;
  }

  .ranking-header {
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(91, 62, 150, 0.2);
  }

  .ranking-title-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .ranking-select {
    padding: 8px 12px;
    border: 1px solid rgba(91, 62, 150, 0.3);
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.2);
    color: var(--text, #f2e8cf);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    max-width: 180px;
  }

  .ranking-loader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .ranking-podium {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    padding: 20px 0 10px;
    margin-bottom: 20px;
    min-height: 180px;
  }

  .podium-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
    position: relative;
  }

  .podium-avatar-wrapper {
    position: relative;
    width: 60px;
    height: 60px;
    z-index: 2;
  }

  .podium-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--glass);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    border: 3px solid transparent;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
  }

  .podium-medal {
    position: absolute;
    bottom: -5px;
    right: -5px;
    font-size: 1.4rem;
    z-index: 3;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  }

  .podium-column {
    width: 100%;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 15px;
    color: #fff;
    font-weight: 800;
    font-size: 1.2rem;
    box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.1);
    transform-origin: bottom;
    animation: podiumRise 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes podiumRise {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }

  .podium-rank-1 .podium-column { height: 100px; background: linear-gradient(180deg, #f1c40f, #d35400); animation-delay: 0.4s; }
  .podium-rank-2 .podium-column { height: 75px; background: linear-gradient(180deg, #bdc3c7, #7f8c8d); animation-delay: 0.2s; }
  .podium-rank-3 .podium-column { height: 55px; background: linear-gradient(180deg, #e67e22, #a04000); animation-delay: 0.6s; }

  .podium-rank-1 .podium-avatar { border-color: #f1c40f; animation: glow-gold 2s infinite ease-in-out; }
  .podium-rank-2 .podium-avatar { border-color: #bdc3c7; }
  .podium-rank-3 .podium-avatar { border-color: #e67e22; }

  @keyframes glow-gold {
    0%, 100% { box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }
    50% { box-shadow: 0 0 25px rgba(241, 196, 15, 0.7); }
  }

  .podium-name {
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    margin-top: 5px;
    color: var(--text, #f2e8cf);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
  }

  .podium-pts {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
  }

  .ranking-separator {
    height: 1px;
    background: rgba(91, 62, 150, 0.2);
    margin: 0 0 20px;
  }

  /* Section "Mon Rang" */
  .my-ranking-card {
    margin-bottom: 24px;
    padding: 16px;
    background: linear-gradient(
      135deg,
      rgba(91, 62, 150, 0.2),
      rgba(58, 134, 196, 0.2)
    );
    border: 1px solid var(--violet);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 15px;
    position: relative;
    overflow: hidden;
    animation: cardPulse 3s infinite ease-in-out;
  }

  @keyframes cardPulse {
    0%,
    100% {
      border-color: var(--violet);
      box-shadow: 0 0 10px rgba(91, 62, 150, 0.2);
    }
    50% {
      border-color: var(--blue);
      box-shadow: 0 0 20px rgba(58, 134, 196, 0.4);
    }
  }

  .my-ranking-card::before {
    content: "VOUS";
    position: absolute;
    top: 0;
    right: 0;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    color: #fff;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 4px 10px;
    border-bottom-left-radius: 12px;
    letter-spacing: 1px;
  }

  .my-ranking-rank {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--blue);
    text-align: center;
    min-width: 40px;
  }

  .my-ranking-details {
    flex: 1;
  }

  .my-ranking-name {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
  }

  .my-ranking-stats,
  .ranking-stats {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .my-ranking-stats span,
  .ranking-stats span {
    font-weight: 600;
    color: var(--text, #f2e8cf);
  }

  .ranking-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 6px;
  }

  .ranking-list::-webkit-scrollbar {
    width: 5px;
  }

  .ranking-list::-webkit-scrollbar-track {
    background: rgba(91, 62, 150, 0.1);
    border-radius: 10px;
  }

  .ranking-list::-webkit-scrollbar-thumb {
    background: rgba(91, 62, 150, 0.3);
    border-radius: 10px;
  }

  .ranking-list::-webkit-scrollbar-thumb:hover {
    background: rgba(91, 62, 150, 0.5);
  }

  /* Item classement */
  .ranking-item {
    display: grid;
    grid-template-columns: 40px 1fr 60px;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ranking-item:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(6px) scale(1.02);
    border-color: rgba(58, 134, 196, 0.3);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .ranking-item.current-user {
    background: linear-gradient(
      135deg,
      rgba(91, 62, 150, 0.25),
      rgba(58, 134, 196, 0.25)
    );
    border-color: var(--violet);
  }

  .ranking-position {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.9rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
  }

  .ranking-position.top3 {
    background: linear-gradient(135deg, var(--blue), #4a9bd9);
    color: #fff;
    box-shadow: 0 0 10px rgba(58, 134, 196, 0.4);
  }

  .ranking-position.red-dot {
    background: var(--danger);
    width: 10px;
    height: 10px;
  }

  .ranking-info {
    flex: 1;

<script src="js/challenges-complete.js"></script>

<script>
// Initialisation du module quand il est chargé
document.addEventListener('moduleLoaded', (e) => {
  if (e.detail.moduleName === 'challenges') {
    if (typeof initChallenges === 'function') {
      initChallenges();
    } else if (typeof loadChallenges === 'function') {
      loadChallenges();
    }
  }
});

// Au cas où le script est chargé après
if (document.getElementById('challenges')) {
  if (typeof initChallenges === 'function') {
    initChallenges();
  } else if (typeof loadChallenges === 'function') {
    loadChallenges();
  }
}
</script>
