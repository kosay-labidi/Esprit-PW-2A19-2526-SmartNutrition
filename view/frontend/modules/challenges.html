<!-- ═══════════════════════════════════════════════════════════
     MODULE DÉFIS COLLABORATIFS - GaiaLumen
     Interface complète avec steakers 3D, classement, formulaire
     ═══════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="css/challenges-steakers.css" />

<section id="challenges" class="content-section module-section">
  <!-- En-tête -->
  <div class="section-header challenges-header">
    <div class="challenges-title-group">
      <h2>Défis Collaboratifs</h2>
      <p>Participez aux défis et gagnez des steakers 3D!</p>
    </div>
  </div>

  <!-- Filtres et recherche -->
  <div class="challenges-filters">
    <div class="filter-group">
      <input
        type="text"
        id="challenge-search"
        class="filter-input"
        placeholder="Rechercher un défi..."
      />

      <select id="challenge-status-filter" class="filter-select">
        <option value="">Tous les statuts</option>
        <option value="actif">Actifs</option>
        <option value="termine">Terminés</option>
        <option value="futur">À venir</option>
      </select>

      <button id="challenge-refresh" class="btn-icon" title="Actualiser">
        Actualiser
      </button>
    </div>
  </div>

  <!-- Layout principal: Liste (70%) + Classement (30%) -->
  <div class="challenges-layout">
    <!-- Liste des défis -->
    <div class="challenges-list">
      <!-- Loading -->
      <div id="challenges-loading" class="challenges-loading">
        <div class="spinner"></div>
        <p>Chargement des défis...</p>
      </div>

      <!-- Empty state -->
      <div id="challenges-empty" class="challenges-empty" style="display: none">
        <div class="empty-icon">Aucun résultat</div>
        <h3>Aucun défi trouvé</h3>
        <p>Essayez de modifier vos filtres de recherche</p>
      </div>

      <!-- Grille des défis -->
      <div id="challenges-grid" class="challenges-grid" style="display: none">
        <!-- Les cartes seront générées par JavaScript -->
      </div>
    </div>

    <!-- Classement sidebar -->
    <aside class="challenges-ranking">
      <div class="ranking-header">
        <h3 class="ranking-title">Classement</h3>
        <div class="ranking-tabs">
          <button class="ranking-tab active" data-type="global">Global</button>
          <button class="ranking-tab" data-type="friends">Amis</button>
        </div>
      </div>

      <!-- Section "Mon Rang" -->
      <div id="my-ranking-card" class="my-ranking-card">
        <!-- Généré par JS -->
      </div>

      <div id="ranking-list" class="ranking-list">
        <!-- Les participants seront générés par JavaScript -->
      </div>
    </aside>
  </div>
</section>

<!-- ═══════════════════════════════════════════════════════════
     MODAL UNIFIÉ (DÉTAILS, FORMULAIRE, DASHBOARD)
     ═══════════════════════════════════════════════════════════ -->
<div id="challenge-modal" class="modal-overlay">
  <div class="modal-container modal-large">
    <div id="challenge-modal-body" class="modal-body">
      <!-- Contenu généré dynamiquement par JS -->
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MODAL PROFIL UTILISATEUR & COLLECTION
     ═══════════════════════════════════════════════════════════ -->
<div id="user-profile-modal" class="modal-overlay">
  <div class="modal-container">
    <button
      onclick="window.closeUserProfileModal()"
      class="modal-close"
      title="Fermer"
    >
      ×
    </button>
    <div id="user-profile-body" class="modal-body">
      <!-- Contenu généré par JS -->
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     STYLES SPÉCIFIQUES AU MODULE
     ═══════════════════════════════════════════════════════════ -->
<style>
  /* Layout principal */
  .challenges-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 20px;
  }

  .challenges-title-group {
    flex: 1;
    min-width: 300px;
  }

  .challenges-title-group h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.2rem, 5vw, 3rem);
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.9;
  }

  .challenges-title-group p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  .challenges-nav-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-nav {
    padding: 10px 20px;
    border: 1.5px solid rgba(91, 62, 150, 0.3);
    border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    color: var(--text, #f2e8cf);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-nav:hover {
    background: rgba(91, 62, 150, 0.2);
    border-color: var(--violet);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(91, 62, 150, 0.3);
  }

  /* Filtres */
  .challenges-filters {
    margin-bottom: 24px;
  }

  .filter-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-input,
  .filter-select {
    padding: 12px 16px;
    border: 1.5px solid rgba(91, 62, 150, 0.3);
    border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(16px);
    color: var(--text, #f2e8cf);
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .filter-input {
    flex: 1;
    min-width: 250px;
  }

  .filter-input::placeholder {
    color: var(--muted);
  }

  .filter-select {
    min-width: 180px;
    cursor: pointer;
  }

  .filter-input:focus,
  .filter-select:focus {
    outline: none;
    border-color: var(--violet);
    background: rgba(91, 62, 150, 0.15);
    box-shadow: 0 0 0 3px rgba(91, 62, 150, 0.1);
  }

  /* Layout liste + classement */
  .challenges-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 30px;
    align-items: start;
  }

  /* Liste des défis */
  .challenges-list {
    min-height: 400px;
  }

  .challenges-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(91, 62, 150, 0.1);
    border-top-color: var(--violet);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .challenges-empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 4rem;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  /* Grille des cartes */
  .challenges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  /* Carte défi */
  .challenge-card {
    position: relative;
    background: var(--surface);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(168, 184, 160, 0.1);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .challenge-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    border-color: var(--blue);
  }

  .challenge-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .challenge-steaker {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
  }

  .challenge-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 5;
    backdrop-filter: blur(8px);
  }

  .challenge-badge.actif {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: #fff;
  }

  .challenge-badge.termine {
    background: linear-gradient(135deg, #95a5a6, #bdc3c7);
    color: #fff;
  }

  .challenge-badge.futur {
    background: linear-gradient(135deg, #3498db, #5dade2);
    color: #fff;
  }

  .challenge-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  .challenge-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0;
    color: var(--text, #f2e8cf);
    line-height: 1.3;
  }

  .challenge-description {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
  }

  .challenge-stats {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    background: rgba(91, 62, 150, 0.08);
    border-radius: 10px;
    margin-top: auto;
  }

  .challenge-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .challenge-stat span:first-child {
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* Barre de progression */
  .progress-wrapper {
    margin-top: 8px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .progress-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .progress-value {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .progress-bar-container {
    position: relative;
    width: 100%;
    height: 10px;
    background: rgba(149, 165, 166, 0.2);
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 1.5s ease;
    position: relative;
    animation: fillProgress 1.5s ease;
  }

  .progress-bar-fill.red {
    background: linear-gradient(90deg, var(--progress-red), #c0392b);
  }

  .progress-bar-fill.orange {
    background: linear-gradient(90deg, var(--progress-orange), #e67e22);
  }

  .progress-bar-fill.green {
    background: linear-gradient(90deg, var(--progress-green), #2ecc71);
  }

  @keyframes fillProgress {
    from {
      width: 0%;
    }
  }

  .progress-bar-container:hover .progress-bar-fill {
    transform: scaleY(1.5);
    transition: transform 0.3s ease;
  }

  .progress-bar-container:hover::after {
    content: attr(data-progress) "%";
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    animation: tooltipFadeIn 0.2s ease;
    z-index: 10;
  }

  @keyframes tooltipFadeIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(-5px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  /* Classement sidebar */
  .challenges-ranking {
    position: sticky;
    top: 20px;
    height: fit-content;
    max-height: calc(100vh - 120px);
    background: var(--surface);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(168, 184, 160, 0.1);
    border-radius: 18px;
    padding: 20px;
    overflow: hidden;
  }

  .ranking-header {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(91, 62, 150, 0.2);
  }

  .ranking-tabs {
    display: flex;
    gap: 8px;
    background: rgba(0, 0, 0, 0.2);
    padding: 4px;
    border-radius: 10px;
    width: 100%;
  }

  .ranking-tab {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .ranking-tab.active {
    background: linear-gradient(135deg, var(--violet), var(--blue));
    color: #fff;
    box-shadow: 0 4px 12px rgba(58, 134, 196, 0.3);
  }

  .ranking-tab:hover:not(.active) {
    background: rgba(91, 62, 150, 0.1);
    color: var(--text, #f2e8cf);
  }

  /* Section "Mon Rang" */
  .my-ranking-card {
    margin-bottom: 24px;
    padding: 16px;
    background: linear-gradient(
      135deg,
      rgba(91, 62, 150, 0.2),
      rgba(58, 134, 196, 0.2)
    );
    border: 1px solid var(--violet);
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 15px;
    position: relative;
    overflow: hidden;
    animation: cardPulse 3s infinite ease-in-out;
  }

  @keyframes cardPulse {
    0%,
    100% {
      border-color: var(--violet);
      box-shadow: 0 0 10px rgba(91, 62, 150, 0.2);
    }
    50% {
      border-color: var(--blue);
      box-shadow: 0 0 20px rgba(58, 134, 196, 0.4);
    }
  }

  .my-ranking-card::before {
    content: "VOUS";
    position: absolute;
    top: 0;
    right: 0;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    color: #fff;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 4px 10px;
    border-bottom-left-radius: 12px;
    letter-spacing: 1px;
  }

  .my-ranking-rank {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--blue);
    text-align: center;
    min-width: 40px;
  }

  .my-ranking-details {
    flex: 1;
  }

  .my-ranking-name {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
  }

  .my-ranking-stats,
  .ranking-stats {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .my-ranking-stats span,
  .ranking-stats span {
    font-weight: 600;
    color: var(--text, #f2e8cf);
  }

  .ranking-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: calc(100vh - 240px);
    overflow-y: auto;
    padding-right: 6px;
  }

  .ranking-list::-webkit-scrollbar {
    width: 5px;
  }

  .ranking-list::-webkit-scrollbar-track {
    background: rgba(91, 62, 150, 0.1);
    border-radius: 10px;
  }

  .ranking-list::-webkit-scrollbar-thumb {
    background: rgba(91, 62, 150, 0.3);
    border-radius: 10px;
  }

  .ranking-list::-webkit-scrollbar-thumb:hover {
    background: rgba(91, 62, 150, 0.5);
  }

  /* Item classement */
  .ranking-item {
    display: grid;
    grid-template-columns: 35px 1fr 55px;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--glass);
    backdrop-filter: blur(8px);
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .ranking-item:hover {
    background: rgba(91, 62, 150, 0.2);
    border-color: var(--violet);
    transform: translateX(4px);
  }

  .ranking-item.current-user {
    background: linear-gradient(
      135deg,
      rgba(91, 62, 150, 0.25),
      rgba(58, 134, 196, 0.25)
    );
    border-color: var(--violet);
  }

  .ranking-position {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 50%;
    background: rgba(91, 62, 150, 0.1);
    flex-shrink: 0;
  }

  .ranking-position.top3 {
    background: linear-gradient(135deg, var(--violet), var(--blue));
    color: #fff;
  }

  .ranking-position.red-dot {
    background: var(--danger);
    width: 10px;
    height: 10px;
  }

  .ranking-info {
    flex: 1;
    min-width: 0;
  }

  .ranking-name {
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ranking-progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(149, 165, 166, 0.2);
    border-radius: 10px;
    overflow: hidden;
  }

  .ranking-progress-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 1s ease;
  }

  .ranking-progress-fill.red {
    background: var(--progress-red);
  }

  .ranking-progress-fill.orange {
    background: var(--progress-orange);
  }

  .ranking-progress-fill.green {
    background: var(--progress-green);
  }

  .ranking-steaker {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Profil Utilisateur Modal */
  .profile-header {
    padding: 40px 32px;
    background: linear-gradient(
      135deg,
      rgba(91, 62, 150, 0.3),
      rgba(58, 134, 196, 0.3)
    );
    text-align: center;
    border-bottom: 1px solid rgba(91, 62, 150, 0.2);
  }

  .profile-avatar {
    font-size: 5rem;
    margin-bottom: 16px;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
  }

  .profile-name {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text, #f2e8cf);
  }

  .profile-pseudo {
    color: var(--muted);
    font-size: 1.1rem;
  }

  .profile-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 24px;
  }

  .profile-stat-card {
    background: var(--glass);
    padding: 16px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid rgba(91, 62, 150, 0.2);
  }

  .profile-stat-value {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--violet);
    margin-bottom: 4px;
  }

  .profile-stat-label {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
  }

  .profile-collection {
    padding: 24px;
  }

  .collection-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 12px;
  }

  .collection-item {
    background: var(--glass);
    border-radius: 12px;
    aspect-ratio: 1/1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    border: 1px solid rgba(91, 62, 150, 0.1);
    transition: all 0.3s ease;
  }

  .collection-item:hover {
    transform: scale(1.1);
    border-color: var(--violet);
  }

  /* Bouton Participer dans la carte */
  .btn-participate {
    width: 100%;
    margin-top: 12px;
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-participate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(91, 62, 150, 0.5);
    background: linear-gradient(135deg, var(--blue), var(--violet));
  }

  .btn-participate:active {
    transform: translateY(0);
  }

  /* Layout du formulaire de participation */
  .participation-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 600px;
  }

  .participation-challenge-info {
    background: var(--surface);
    border-right: 1px solid rgba(91, 62, 150, 0.2);
    overflow-y: auto;
    max-height: 80vh;
  }

  .challenge-info-header {
    position: relative;
    height: 200px;
    background-size: cover;
    background-position: center;
  }

  .challenge-info-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.3),
      rgba(0, 0, 0, 0.7)
    );
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px;
  }

  .challenge-info-overlay h2 {
    color: #fff;
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0 0 12px 0;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }

  .challenge-info-content {
    padding: 24px;
  }

  .info-section {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(91, 62, 150, 0.1);
  }

  .info-section:last-child {
    border-bottom: none;
  }

  .info-section h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--violet);
  }

  .info-section p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
  }

  .info-section strong {
    color: var(--text);
    font-weight: 700;
  }

<!-- Chargement du script principal du module -->
<script src="js/challenges.js"></script>

<script>
(function() {
  // Redéfinir loadChallenges / initChallenges pour utiliser le vrai backend
  function fetchChallenges() {
    const grid    = document.getElementById('challenges-grid');
    const loading = document.getElementById('challenges-loading');
    const empty   = document.getElementById('challenges-empty');
    if (!grid || !loading) return;

    loading.style.display = 'flex';
    if (grid)  grid.style.display  = 'none';
    if (empty) empty.style.display = 'none';

    fetch('../../controller/challenge.controller.php?action=list')
      .then(r => r.json())
      .then(data => {
        loading.style.display = 'none';
        if (!Array.isArray(data) || data.length === 0) {
          if (empty) empty.style.display = 'block';
        } else {
          // Si le script challenges.js expose renderChallenges, l'utiliser
          if (typeof window.renderChallenges === 'function') {
            window.renderChallenges(data);
          } else {
            grid.style.display = 'grid';
            grid.innerHTML = data.map(c => `
              <div class="challenge-card">
                <div class="challenge-content">
                  <h3 class="challenge-title">${c.titre || c.nom || c.name || 'Défi #' + c.id}</h3>
                  <p class="challenge-description">${c.description || ''}</p>
                  <div class="challenge-stats">
                    ${c.date_debut ? `<div class="challenge-stat"><span>📅</span><span>${c.date_debut}</span></div>` : ''}
                    ${c.date_fin   ? `<div class="challenge-stat"><span>🏁</span><span>${c.date_fin}</span></div>` : ''}
                  </div>
                </div>
              </div>
            `).join('');
          }
        }
      })
      .catch(() => {
        loading.style.display = 'none';
        if (empty) empty.style.display = 'block';
      });
  }

  window.loadChallenges  = fetchChallenges;
  window.initChallenges  = fetchChallenges;
})();
</script>
