          '<div class="demandes-grid" id="demandesGrid"><div class="empty-state"><div class="spa-loader-spinner" style="margin:0 auto 16px"></div><p>Chargement...</p></div></div>' +
          '<div class="pagination" id="paginationBar"></div>' +
        '</div>',
        function() {
          setTimeout(function(){
            var si = document.getElementById('listSearch');
            if(si) si.addEventListener('input', function(){ currentPage=1; applyAndRender(); });
            var sf = document.getElementById('listSortField');
            if(sf) sf.addEventListener('change', function(){ applyAndRender(); });
            apiGet(API_BASE+'listMesDemandes.php')
              .then(function(d){ if(!Array.isArray(d)) throw new Error('Format invalide'); allDemandes=d; filteredDemandes=d; renderStats(d); applyAndRender(); })
              .catch(function(err){ var g=document.getElementById('demandesGrid'); if(g) g.innerHTML='<div class="empty-state"><div class="icon">❌</div><h3>Erreur</h3><p>'+err.message+'</p></div>'; });
          }, 50);
        }
      );
    }

    function renderStats(demandes) {
      var el = document.getElementById('listStats');
      if (!el) return;

      // ── Calculs ──────────────────────────────────────────────────────
      var total      = demandes.length;
      var approuves  = demandes.filter(function(d){ return d.statut==='approuve' && d._has_planning; }).length;
      var enAttente  = demandes.filter(function(d){ return d.statut==='en_attente'; }).length;
      var rejetes    = demandes.filter(function(d){ return d.statut==='rejete'; }).length;
      var totalJours = demandes.reduce(function(s,d){
        return s + (d.type_duree==='semaines' ? (parseInt(d.duree)||0)*7 : (parseInt(d.duree)||0));
      }, 0);
      var avgCal = total ? Math.round(demandes.reduce(function(s,d){ return s+(parseFloat(d.calories)||0); },0)/total) : 0;
      var quotidien    = demandes.filter(function(d){ return d.type_budget==='quotidien'; }).length;
      var hebdomadaire = demandes.filter(function(d){ return d.type_budget==='hebdomadaire'; }).length;
      var byDate = demandes.slice().sort(function(a,b){ return new Date(a.date_demande||0)-new Date(b.date_demande||0); });

      var uid = Date.now();

      // ── HTML ──────────────────────────────────────────────────────────
      el.innerHTML = [
        '<div class="rs-wrap">',

        // Ligne 1 : 4 KPI
        '<div class="rs-kpi-row">',
          _kpi('rs-k0','📋', total,      'Total demandes',   '#7b6eea', total, total),
          _kpi('rs-k1','✅', approuves,  'Approuvés',        '#2ecc71', approuves, total),
          _kpi('rs-k2','⏳', enAttente,  'En attente',       '#f39c12', enAttente, total),
          _kpi('rs-k3','📆', totalJours, 'Jours planifiés',  '#3b82f6', Math.min(totalJours,100), 100),
        '</div>',

        // Ligne 2 : Donut + Bars + Sparkline
        '<div class="rs-charts-row">',

          // Donut
          '<div class="rs-chart-card" id="rs-donut-card-'+uid+'">',
            '<div class="rs-chart-title">Répartition statuts</div>',
            '<div class="rs-donut-wrap">',
              '<div style="position:relative;width:110px;height:110px;flex-shrink:0">',
                '<svg id="rs-donut-'+uid+'" width="110" height="110" viewBox="0 0 110 110"></svg>',
                '<div class="rs-donut-center" id="rs-dc-'+uid+'">',
                  '<span class="rs-dc-val">'+total+'</span>',
                  '<span class="rs-dc-lbl">total</span>',
                '</div>',
              '</div>',
              '<div class="rs-donut-legend">',
                '<div class="rs-leg" data-seg="0" onmouseenter="rsHoverSeg(this,'+uid+')" onmouseleave="rsUnhoverSeg('+uid+')">',
                  '<span class="rs-leg-dot" style="background:#2ecc71"></span>',
                  '<span class="rs-leg-lbl">Approuvés</span>',
                  '<span class="rs-leg-val">'+approuves+'</span>',
                '</div>',
                '<div class="rs-leg" data-seg="1" onmouseenter="rsHoverSeg(this,'+uid+')" onmouseleave="rsUnhoverSeg('+uid+')">',
                  '<span class="rs-leg-dot" style="background:#f39c12"></span>',
                  '<span class="rs-leg-lbl">En attente</span>',
                  '<span class="rs-leg-val">'+enAttente+'</span>',
                '</div>',
                '<div class="rs-leg" data-seg="2" onmouseenter="rsHoverSeg(this,'+uid+')" onmouseleave="rsUnhoverSeg('+uid+')">',
                  '<span class="rs-leg-dot" style="background:#e74c3c"></span>',
                  '<span class="rs-leg-lbl">Rejetés</span>',
                  '<span class="rs-leg-val">'+rejetes+'</span>',
                '</div>',
              '</div>',
            '</div>',
          '</div>',

          // Barres budget
          '<div class="rs-chart-card">',
            '<div class="rs-chart-title">Type de budget</div>',
            '<div class="rs-bars-wrap" id="rs-bars-'+uid+'">',
              _bar('Quotidien',    quotidien,    Math.max(quotidien,hebdomadaire,1), '#7b6eea', uid),
              _bar('Hebdomadaire', hebdomadaire, Math.max(quotidien,hebdomadaire,1), '#3b82f6', uid),
            '</div>',
            '<div class="rs-avg-line">Moy. calories : <strong>'+avgCal+' kcal</strong></div>',
          '</div>',

          // Sparkline
          '<div class="rs-chart-card rs-spark-card">',
            '<div class="rs-chart-title">Évolution calories</div>',
            '<div style="position:relative">',
              '<svg id="rs-spark-'+uid+'" class="rs-spark-svg" viewBox="0 0 300 80" preserveAspectRatio="none"></svg>',
              '<div class="rs-tooltip" id="rs-tt-'+uid+'" style="display:none"></div>',
            '</div>',
            '<div class="rs-spark-footer" id="rs-sf-'+uid+'"></div>',
          '</div>',

        '</div>',
        '</div>'
      ].join('');

      // ── CSS injecté une fois ──────────────────────────────────────────
      if (!document.getElementById('rs-styles')) {
        var s = document.createElement('style'); s.id = 'rs-styles';
        s.textContent = [
          '.rs-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}',
          '.rs-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}',
          '@media(max-width:700px){.rs-kpi-row{grid-template-columns:1fr 1fr}}',
          '.rs-kpi{background:var(--card-bg,rgba(255,255,255,.04));border:1px solid rgba(91,62,150,.18);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;cursor:default;transition:transform .2s,box-shadow .2s}',
          '.rs-kpi:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(91,62,150,.22)}',
          '.rs-kpi-glow{position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;opacity:.08;pointer-events:none}',
          '.rs-kpi-ico{font-size:1.3rem;margin-bottom:6px;display:block}',
          '.rs-kpi-val{font-size:1.85rem;font-weight:800;color:var(--text);line-height:1;margin-bottom:2px}',
          '.rs-kpi-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}',
          '.rs-kpi-bar{height:3px;border-radius:2px;margin-top:10px;background:rgba(91,62,150,.1);overflow:hidden}',
          '.rs-kpi-fill{height:100%;border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}',
          '.rs-charts-row{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:12px}',
          '@media(max-width:700px){.rs-charts-row{grid-template-columns:1fr}}',
          '.rs-chart-card{background:var(--card-bg,rgba(255,255,255,.04));border:1px solid rgba(91,62,150,.18);border-radius:14px;padding:16px 18px}',
          '.rs-chart-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px}',
          // Donut
          '.rs-donut-wrap{display:flex;align-items:center;gap:14px}',
          '.rs-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:all .2s}',
          '.rs-dc-val{font-size:1.3rem;font-weight:800;color:var(--text);line-height:1}',
          '.rs-dc-lbl{font-size:.6rem;text-transform:uppercase;color:var(--muted)}',
          '.rs-donut-legend{display:flex;flex-direction:column;gap:8px;flex:1}',
          '.rs-leg{display:flex;align-items:center;gap:7px;font-size:.75rem;padding:3px 6px;border-radius:6px;cursor:pointer;transition:background .15s}',
          '.rs-leg:hover{background:rgba(91,62,150,.1)}',
          '.rs-leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}',
          '.rs-leg-lbl{flex:1;color:var(--muted)}',
          '.rs-leg-val{font-weight:700;color:var(--text)}',
          // Bars
          '.rs-bars-wrap{display:flex;gap:10px;align-items:flex-end;height:80px;margin-bottom:8px}',
          '.rs-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}',
          '.rs-bar-rect{width:100%;border-radius:6px 6px 0 0;transform-origin:bottom;transform:scaleY(0);cursor:pointer;transition:transform .85s cubic-bezier(.4,0,.2,1),filter .2s,opacity .2s}',
          '.rs-bar-rect:hover{filter:brightness(1.25)}',
          '.rs-bar-lbl{font-size:.65rem;color:var(--muted);text-align:center}',
          '.rs-bar-val{font-size:.8rem;font-weight:700;color:var(--text)}',
          '.rs-avg-line{font-size:.72rem;color:var(--muted);margin-top:4px}',
          // Spark
          '.rs-spark-card{display:flex;flex-direction:column}',
          '.rs-spark-svg{width:100%;height:80px;overflow:visible}',
          '.rs-tooltip{position:absolute;background:rgba(20,20,35,.9);border:1px solid rgba(91,62,150,.4);border-radius:8px;padding:6px 10px;font-size:.72rem;color:#fff;pointer-events:none;white-space:nowrap;z-index:10;transform:translateX(-50%);transition:opacity .15s}',
          '.rs-spark-footer{font-size:.68rem;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}',
          '.rs-spark-dot{transition:r .15s,fill .15s;cursor:pointer}',
        ].join('');
        document.head.appendChild(s);
      }

      // ── Animations & interactions — après paint ───────────────────────
      setTimeout(function() {

        // 1. Compteurs KPI
        el.querySelectorAll('.rs-kpi-val[data-t]').forEach(function(v) {
          var target = +v.dataset.t, t0 = null;
          (function raf(ts) {
            if (!t0) t0 = ts;
            var p = Math.min((ts-t0)/900,1), e = 1-Math.pow(2,-10*p);
            v.textContent = Math.round(target*e);
            if (p<1) requestAnimationFrame(raf);
          })(performance.now());
        });

        // 2. Barres KPI fill
        el.querySelectorAll('.rs-kpi-fill[data-p]').forEach(function(b){
          setTimeout(function(){ b.style.width = b.dataset.p+'%'; }, 120);
        });

        // 3. Barres budget scaleY
        el.querySelectorAll('.rs-bar-rect').forEach(function(b,i){
          setTimeout(function(){ b.style.transform='scaleY(1)'; }, 120+i*80);
        });

        // 4. Donut SVG interactif
        var donutSvg = document.getElementById('rs-donut-'+uid);
        var dcVal    = document.getElementById('rs-dc-'+uid).querySelector('.rs-dc-val');
        var dcLbl    = document.getElementById('rs-dc-'+uid).querySelector('.rs-dc-lbl');
        if (donutSvg && total > 0) {
          var cx=55, cy=55, r=38, sw=12;
          var circ = 2*Math.PI*r;
          var segs = [
            {val:approuves, color:'#2ecc71', lbl:'Approuvés'},
            {val:enAttente, color:'#f39c12', lbl:'En attente'},
            {val:rejetes,   color:'#e74c3c', lbl:'Rejetés'}
          ];
          // Fond
          donutSvg.innerHTML = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(91,62,150,.1)" stroke-width="'+sw+'"/>';
          var circles = [];
          var offset  = 0;
          segs.forEach(function(seg, i) {
            var len = (seg.val/total)*circ;
            if (len <= 0) { circles.push(null); return; }
            var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
            c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
            c.setAttribute('fill','none');
            c.setAttribute('stroke',seg.color);
            c.setAttribute('stroke-width',sw);
            c.setAttribute('stroke-dasharray', len+' '+(circ-len));
            c.setAttribute('stroke-linecap','round');
            c.style.transform = 'rotate(-90deg)';
            c.style.transformOrigin = cx+'px '+cy+'px';
            c.style.strokeDashoffset = circ - offset;
            c.style.transition = 'stroke-dashoffset 0s, stroke-width .2s, opacity .2s';
            c.style.cursor = 'pointer';
            donutSvg.appendChild(c);
            circles.push({el:c, len:len, offset:offset, seg:seg, i:i});
            offset += len;
            // Animate draw
            (function(ce, o) {
              setTimeout(function(){
                ce.style.transition = 'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1), stroke-width .2s, opacity .2s';
                ce.style.strokeDashoffset = circ - o - len;
              }, 60 + i*120);
            })(c, offset-len);
            // Hover sur arc
            c.addEventListener('mouseenter', function(){
              circles.forEach(function(x){ if(x && x.el!==c){ x.el.style.opacity='.35'; } });
              c.setAttribute('stroke-width', sw+3);
              dcVal.textContent = seg.val;
              dcLbl.textContent = seg.lbl.toLowerCase();
            });
            c.addEventListener('mouseleave', function(){
              circles.forEach(function(x){ if(x){ x.el.style.opacity='1'; x.el.setAttribute('stroke-width',sw); } });
              dcVal.textContent = total;
              dcLbl.textContent = 'total';
            });
          });
          window['_rsDonutCircles'+uid] = circles;
          window['_rsDonutTotal'+uid]   = total;
          window['_rsDcVal'+uid]        = dcVal;
          window['_rsDcLbl'+uid]        = dcLbl;
        }

        // 5. Sparkline interactive avec tooltip
        var sparkSvg = document.getElementById('rs-spark-'+uid);
        var tooltip  = document.getElementById('rs-tt-'+uid);
        var footer   = document.getElementById('rs-sf-'+uid);
        if (sparkSvg && byDate.length > 0) {
          var W=300, H=80, padX=10, padY=8;
          var vals  = byDate.map(function(d){ return parseFloat(d.calories)||0; });
          var dates = byDate.map(function(d){ return d.date_demande ? new Date(d.date_demande).toLocaleDateString('fr-FR') : '?'; });
          var minV  = Math.min.apply(null,vals), maxV = Math.max.apply(null,vals);
          var rng   = maxV - minV || 1;
          var pts   = vals.map(function(v,i){
            return [
              vals.length===1 ? W/2 : padX + (i/(vals.length-1))*(W-padX*2),
              (H-padY) - ((v-minV)/rng)*(H-padY*2)
            ];
          });

          // Courbe lissée (bezier)
          function bezierPath(pts) {
            if (pts.length===1) return 'M'+pts[0][0]+' '+pts[0][1];
            var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
            for (var i=0;i<pts.length-1;i++) {
              var cp1x = pts[i][0]   + (pts[i+1][0]-pts[i][0])*0.45;
              var cp1y = pts[i][1];
              var cp2x = pts[i+1][0] - (pts[i+1][0]-pts[i][0])*0.45;
              var cp2y = pts[i+1][1];
              d += ' C'+cp1x.toFixed(1)+' '+cp1y.toFixed(1)+','+cp2x.toFixed(1)+' '+cp2y.toFixed(1)+','+pts[i+1][0].toFixed(1)+' '+pts[i+1][1].toFixed(1);
            }
            return d;
          }

          var pathD = bezierPath(pts);
          var fillD = pathD + ' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-padY)+' L'+pts[0][0].toFixed(1)+' '+(H-padY)+' Z';

          sparkSvg.innerHTML = [
            '<defs>',
              '<linearGradient id="rsg'+uid+'" x1="0" y1="0" x2="0" y2="1">',
                '<stop offset="0%" stop-color="#7b6eea" stop-opacity=".4"/>',
                '<stop offset="100%" stop-color="#7b6eea" stop-opacity="0"/>',
              '</linearGradient>',
              '<clipPath id="rscp'+uid+'"><rect x="0" y="0" width="0" height="'+H+'"/></clipPath>',
            '</defs>',
            '<path d="'+fillD+'" fill="url(#rsg'+uid+')" clip-path="url(#rscp'+uid+')" opacity=".7"/>',
            '<path id="rsp'+uid+'" d="'+pathD+'" fill="none" stroke="#7b6eea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
            '<line id="rscross'+uid+'" x1="0" y1="0" x2="0" y2="'+H+'" stroke="rgba(123,110,234,.5)" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>',
          ].join('');

          // Animation draw — via clipPath width
          var clip = sparkSvg.querySelector('clipPath rect');
          var pathEl = document.getElementById('rsp'+uid);
          if (pathEl && clip) {
            var pathLen = pathEl.getTotalLength ? pathEl.getTotalLength() : 400;
            pathEl.style.strokeDasharray  = pathLen;
            pathEl.style.strokeDashoffset = pathLen;
            pathEl.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)';
            setTimeout(function(){
              pathEl.style.strokeDashoffset = 0;
              clip.style.transition = 'width 1.3s cubic-bezier(.4,0,.2,1)';
              clip.setAttribute('width', W);
            }, 80);
          }

          // Points (apparaissent après la courbe)
          var dotEls = [];
          pts.forEach(function(p, i) {
            var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
            c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]);
            c.setAttribute('r','3.5'); c.setAttribute('fill','#7b6eea');
            c.setAttribute('stroke','rgba(255,255,255,.2)'); c.setAttribute('stroke-width','1.5');
            c.classList.add('rs-spark-dot');
            c.style.opacity = '0';
            sparkSvg.appendChild(c);
            dotEls.push(c);
            setTimeout(function(){ c.style.opacity='1'; }, 1100 + i*60);
          });

          // Crosshair + tooltip au survol
          var cross = document.getElementById('rscross'+uid);
          sparkSvg.addEventListener('mousemove', function(ev) {
            var rect = sparkSvg.getBoundingClientRect();
            var svgW = rect.width || 300;
            var mx   = (ev.clientX - rect.left) / svgW * W;
            // Trouver le point le plus proche
            var minD = Infinity, closest = 0;
            pts.forEach(function(p,i){ var dx=Math.abs(p[0]-mx); if(dx<minD){minD=dx;closest=i;} });
            var cp = pts[closest];
            // Crosshair
            if (cross) { cross.setAttribute('x1',cp[0]); cross.setAttribute('x2',cp[0]); cross.style.display=''; }
            // Dots
            dotEls.forEach(function(d,i){
              d.setAttribute('r', i===closest ? '5.5' : '3.5');
              d.setAttribute('fill', i===closest ? '#a78bfa' : '#7b6eea');
            });
            // Tooltip
            if (tooltip) {
              tooltip.style.display = '';
              tooltip.innerHTML = '<strong>' + vals[closest] + ' kcal</strong><br>' + dates[closest];
              var txPct = (cp[0]/W*100);
              tooltip.style.left = txPct+'%';
              tooltip.style.top  = (cp[1]/H*rect.height - 48) + 'px';
              tooltip.style.opacity = '1';
            }
          });
          sparkSvg.addEventListener('mouseleave', function() {
            if (cross) cross.style.display='none';
            dotEls.forEach(function(d){ d.setAttribute('r','3.5'); d.setAttribute('fill','#7b6eea'); });
            if (tooltip) tooltip.style.display='none';
          });

          // Footer min/max
          if (footer) footer.innerHTML = '<span>Min : '+minV+' kcal</span><span>Moy : '+Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length)+' kcal</span><span>Max : '+maxV+' kcal</span>';
        }

      }, 60);
    }

    // ── Helpers HTML stats ────────────────────────────────────────────────
    function _kpi(id, ico, val, lbl, color, num, den) {
      var pct = den ? Math.round(num/den*100) : 0;
      return '<div class="rs-kpi" id="'+id+'">' +
        '<div class="rs-kpi-glow" style="background:'+color+'"></div>' +
        '<span class="rs-kpi-ico">'+ico+'</span>' +
        '<div class="rs-kpi-val" data-t="'+val+'">0</div>' +
        '<div class="rs-kpi-lbl">'+lbl+'</div>' +
        '<div class="rs-kpi-bar"><div class="rs-kpi-fill" data-p="'+pct+'" style="background:'+color+'"></div></div>' +
      '</div>';
    }
    function _bar(lbl, val, max, color, uid) {
      var h = Math.max(Math.round(val/max*68), val>0?4:0);
      return '<div class="rs-bar-col">' +
        '<div class="rs-bar-val">'+val+'</div>' +
        '<div class="rs-bar-rect" style="background:'+color+';height:'+h+'px" title="'+lbl+': '+val+'"></div>' +
        '<div class="rs-bar-lbl">'+lbl+'</div>' +
      '</div>';
    }

    // Exposé sur window car appelé depuis des attributs onmouseenter inline
    window.rsHoverSeg = function(legEl, uid) {
      var i    = parseInt(legEl.dataset.seg, 10);
      var circs = window['_rsDonutCircles'+uid] || [];
      var dcVal = window['_rsDcVal'+uid];
      var dcLbl = window['_rsDcLbl'+uid];
      var segs  = [{lbl:'Approuvés'},{lbl:'En attente'},{lbl:'Rejetés'}];
      circs.forEach(function(x){ if(x){ x.el.style.opacity = x.i===i ? '1' : '.3'; x.el.setAttribute('stroke-width', x.i===i ? '15' : '12'); }});
      if (dcVal) dcVal.textContent = circs[i] ? (circs[i].len/(2*Math.PI*38)*( window['_rsDonutTotal'+uid]||1)).toFixed(0) : '0';
      // Récupérer la valeur depuis la légende directement
      var valEl = legEl.querySelector('.rs-leg-val');
      if (dcVal && valEl) dcVal.textContent = valEl.textContent;
      if (dcLbl) dcLbl.textContent = (segs[i]||{lbl:''}).lbl.toLowerCase();
    };
    window.rsUnhoverSeg = function(uid) {
      var circs = window['_rsDonutCircles'+uid] || [];
      var dcVal = window['_rsDcVal'+uid];
      var dcLbl = window['_rsDcLbl'+uid];
      var tot   = window['_rsDonutTotal'+uid] || 0;
      circs.forEach(function(x){ if(x){ x.el.style.opacity='1'; x.el.setAttribute('stroke-width','12'); }});
      if (dcVal) dcVal.textContent = tot;
      if (dcLbl) dcLbl.textContent = 'total';
    };

    function applyAndRender() {
      // ── Recherche ciblée ─────────────────────────────────────────────
      var searchVal   = ((document.getElementById('listSearch')      || {}).value || '').trim();
      var searchField = ((document.getElementById('listSearchField') || {}).value || 'id');

      filteredDemandes = allDemandes.filter(function(d) {
        if (!searchVal) return true;
        var fieldVal = '';
        switch (searchField) {
          case 'id':       fieldVal = String(d.id       != null ? d.id       : ''); break;
          case 'calories': fieldVal = String(d.calories != null ? d.calories : ''); break;
          case 'budget':   fieldVal = String(d.budget   != null ? d.budget   : '').replace(',', '.'); break;
          default:         fieldVal = '';
        }
        return fieldVal.toLowerCase().includes(searchVal.toLowerCase());
      });

      // ── Synchroniser colonne de tri depuis le select ─────────────────
      var sortFieldEl = document.getElementById('listSortField');
      if (sortFieldEl && sortFieldEl.value) listSort.col = sortFieldEl.value;

      // ── Tri ──────────────────────────────────────────────────────────
      var col = listSort.col;
      var dir = listSort.dir;

      filteredDemandes = filteredDemandes.slice().sort(function(a, b) {
        var va, vb;
        switch (col) {
          case 'id':
            va = parseInt(a.id, 10)  || 0;
            vb = parseInt(b.id, 10)  || 0;
            break;
          case 'calories':
            va = parseFloat(a.calories) || 0;
            vb = parseFloat(b.calories) || 0;
            break;
          case 'budget':
            va = parseFloat(a.budget) || 0;
            vb = parseFloat(b.budget) || 0;
            break;
          case 'duree':
            va = a.type_duree === 'semaines' ? (parseInt(a.duree, 10) || 0) * 7 : (parseInt(a.duree, 10) || 0);

            break;
          case 'statut': {
            var ord = { en_attente: 0, approuve: 1, rejete: 2 };
            va = ord[a.statut] != null ? ord[a.statut] : 9;
            vb = ord[b.statut] != null ? ord[b.statut] : 9;
            break;
          }
          case 'date':
            va = a.date_demande ? new Date(a.date_demande).getTime() : 0;
            vb = b.date_demande ? new Date(b.date_demande).getTime() : 0;
            break;
          default:
            va = 0; vb = 0;
        }
        if (va === vb) return 0;
        return dir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
      });

      renderDemandes(filteredDemandes);
    }

    function renderDemandes(demandes) {

      var pb=document.getElementById('paginationBar'); if(!pb) return;
      if(totalPages<=1){pb.innerHTML='';return;}

      html+='<button class="page-btn" onclick="planningApp.goPage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>›</button>';
      pb.innerHTML=html;
    }

    function restoLoadLeaflet(cb) {
      if (window.L) { cb(); return; }
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload = cb;
      document.head.appendChild(script);

    function restoPopulateSelect(approuvees) {
      var sel = document.getElementById('restoDemandeSelect');
      if (!sel) return;
      if (!approuvees.length) {
        sel.innerHTML = '<option>Aucune demande approuvée</option>';
        return;
      }
      sel.innerHTML = approuvees.map(function(d) {
        return '<option value="'+d.id+'">Demande #'+d.id+' — '+d.calories+' kcal / '+parseFloat(d.budget||0).toFixed(0)+' TND</option>';
      }).join('');
      _restoState.demandeId = approuvees[0].id;
      _restoState.demande   = approuvees[0];
    }

    function restoOnDemandeChange(val) {
      _restoState.demandeId = parseInt(val) || null;
      _restoState.demande   = allDemandes.find(function(d){ return d.id == val; }) || null;
    }

    function restoOnRadiusChange(val) {
      _restoState.radius = parseInt(val) || 1500;
      if (_restoState.map && _restoState.userLat) restoUpdateCircle();
    }

    var _restoCircle = null;
    function restoUpdateCircle() {
      if (_restoCircle) _restoCircle.remove();
      _restoCircle = L.circle([_restoState.userLat, _restoState.userLon], {
        radius: _restoState.radius,
        color: '#7c3aed', fillColor: '#7c3aed', fillOpacity: 0.07, weight: 2, dashArray: '6,4'
      }).addTo(_restoState.map);
    }

    function restoStartGeoloc() {
      var btn = document.getElementById('btnGeoloc');
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Localisation…'; }

      if (!navigator.geolocation) {
        if (btn) { btn.disabled = false; btn.innerHTML = '📡 Réessayer'; }
        restoShowManualInput();
        return;
      }

      // Fallback auto après 6s si le navigateur bloque
      var safetyTimer = setTimeout(function() {
        if (btn) { btn.disabled = false; btn.innerHTML = '📡 Réessayer'; }
        restoShowManualInput();
      }, 6000);

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          clearTimeout(safetyTimer);
          _restoState.userLat = pos.coords.latitude;
          _restoState.userLon = pos.coords.longitude;
          restoLoadLeaflet(function() {
            restoInitMap();
            var overlay = document.getElementById('restoMapOverlay');
            if (overlay) { overlay.style.transition = 'opacity .4s'; overlay.style.opacity = '0'; setTimeout(function(){ overlay.style.display = 'none'; }, 420); }
            var bar = document.getElementById('restoSelectBar');
            if (bar) bar.style.display = 'flex';
            var btnSearch = document.getElementById('btnRestoSearch');
            if (btnSearch) btnSearch.disabled = false;
            showToast('📍 Localisation OK — sélectionnez un profil puis cliquez Analyser', 'success');
          });
        },
        function() {
          clearTimeout(safetyTimer);
          if (btn) { btn.disabled = false; btn.innerHTML = '📡 Réessayer'; }
          restoShowManualInput();
        },
        { timeout: 5000, maximumAge: 60000, enableHighAccuracy: false }
      );
    }

    function restoShowManualInput() {
      var existing = document.getElementById('restoManualInput');
      if (existing) { existing.style.display = 'flex'; return; }
      var overlay = document.getElementById('restoMapOverlay');
      if (!overlay) return;
      var manual = document.createElement('div');
      manual.id = 'restoManualInput';
      manual.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px';
      manual.innerHTML =
        '<p style="color:rgba(255,255,255,.6);font-size:.78rem;margin:0;text-align:center">⚠️ Géolocalisation refusée — entrez vos coordonnées :</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">' +
        '  <input id="restoManLat" placeholder="Latitude (ex: 36.8190)" type="number" step="any" style="padding:7px 12px;border-radius:8px;border:1.5px solid rgba(91,62,150,.5);background:rgba(255,255,255,.08);color:#fff;font-size:.82rem;width:155px;font-family:Lato,sans-serif">' +
        '  <input id="restoManLon" placeholder="Longitude (ex: 10.1658)" type="number" step="any" style="padding:7px 12px;border-radius:8px;border:1.5px solid rgba(91,62,150,.5);background:rgba(255,255,255,.08);color:#fff;font-size:.82rem;width:155px;font-family:Lato,sans-serif">' +
        '</div>' +
        '<button onclick="restoApplyManual()" style="padding:8px 22px;background:linear-gradient(135deg,#7c3aed,#3a86c4);border:none;border-radius:50px;color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;font-family:Lato,sans-serif">✅ Valider la position</button>';
      overlay.appendChild(manual);
    }

    function restoApplyManual() {
      var lat = parseFloat(document.getElementById('restoManLat').value);
      var lon = parseFloat(document.getElementById('restoManLon').value);
      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        showToast('⚠️ Coordonnées invalides', 'error'); return;
      }
      _restoState.userLat = lat;
      _restoState.userLon = lon;
      restoLoadLeaflet(function() {
        restoInitMap();
        var overlay = document.getElementById('restoMapOverlay');
        if (overlay) { overlay.style.transition = 'opacity .4s'; overlay.style.opacity = '0'; setTimeout(function(){ overlay.style.display = 'none'; }, 420); }
        var bar = document.getElementById('restoSelectBar');
        if (bar) bar.style.display = 'flex';
        var btnSearch = document.getElementById('btnRestoSearch');
        if (btnSearch) btnSearch.disabled = false;
        showToast('📍 Position définie — cliquez Analyser', 'success');
      });

    function restoInitMap() {
      var lat = _restoState.userLat, lon = _restoState.userLon;
      if (_restoState.map) { _restoState.map.remove(); _restoState.map = null; }
      _restoState.map = L.map('restoMap', { zoomControl: true }).setView([lat, lon], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(_restoState.map);
      // Marker utilisateur
      L.marker([lat, lon], {
        icon: L.divIcon({ className:'', html:'<div style="width:18px;height:18px;background:linear-gradient(135deg,#7c3aed,#3a86c4);border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(124,58,237,.6)"></div>', iconSize:[18,18], iconAnchor:[9,9] })
      }).addTo(_restoState.map).bindPopup('<strong>📍 Vous êtes ici</strong>');
      restoUpdateCircle();
    }

    function restoLancer() {
      if (!_restoState.userLat || !_restoState.demandeId) {
        showToast('⚠️ Sélectionnez un profil et activez la localisation', 'error'); return;
      }
      var cardsEl = document.getElementById('restoCards');
      var bannerEl = document.getElementById('restoIaBanner');
      if (cardsEl) cardsEl.innerHTML = '<div class="resto-loading"><div class="resto-loader-spin"></div><p>🤖 L\'IA analyse les restaurants autour de vous…</p></div>';
      if (bannerEl) bannerEl.innerHTML = '';

      // 1. Chercher restaurants via Overpass API (OSM) dans le rayon
      var r = _restoState.radius;
      var lat = _restoState.userLat, lon = _restoState.userLon;
      var query = '[out:json][timeout:20];(node["amenity"="restaurant"](around:'+r+','+lat+','+lon+');node["amenity"="cafe"](around:'+r+','+lat+','+lon+');node["amenity"="fast_food"](around:'+r+','+lat+','+lon+'););out body;';

      fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query))
        .then(function(res){ return res.json(); })
        .then(function(data) {
          var elements = (data.elements || []).filter(function(e){ return e.tags && e.tags.name; });
          // Garder max 12, trier par distance
          elements = elements.map(function(e) {
            var dist = restoCalcDist(lat, lon, e.lat, e.lon);
            return Object.assign({}, e, { _dist: dist });
          }).sort(function(a,b){ return a._dist - b._dist; }).slice(0, 12);

          _restoState.restaurants = elements;

          if (!elements.length) {
            if (cardsEl) cardsEl.innerHTML = '<div class="resto-empty-state"><span class="big-icon">🍽️</span><p>Aucun restaurant trouvé dans ce rayon.<br>Essayez d\'augmenter le rayon.</p></div>';
            return;
          }

          // 2. Appel IA backend
          var d = _restoState.demande || {};
          fetch(API_BASE + 'restaurant_ia.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id_demande: _restoState.demandeId,
              restaurants: elements.map(function(e){
                return { name: e.tags.name, cuisine: e.tags.cuisine||'', type: e.tags.amenity, dist: Math.round(e._dist) };
              })
            })
          })
          .then(function(r){ return r.json(); })
          .then(function(res) {
            if (!res.success) { showToast('❌ Erreur IA : '+(res.error||'?'), 'error'); return; }
            restoAfficher(elements, res.analysis, res.conseils, res.top_pick);
          })
          .catch(function() {
            restoAfficher(elements, [], null, null);
          });
        })
        .catch(function() {
          if (cardsEl) cardsEl.innerHTML = '<div class="resto-empty-state"><span class="big-icon">❌</span><p>Impossible de charger les restaurants.<br>Vérifiez votre connexion.</p></div>';
        });
    }

    function restoCalcDist(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2-lat1) * Math.PI/180;
      var dLon = (lon2-lon1) * Math.PI/180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function restoAfficher(elements, analysis, conseils, topPick) {
      // Nettoyer anciens markers
      _restoState.markers.forEach(function(m){ m.remove(); });
      _restoState.markers = [];

      // Map IA par nom (flexible : insensible à la casse)
      var iaMap = {};
      if (Array.isArray(analysis)) {
        analysis.forEach(function(a){ if(a.name) iaMap[a.name.trim().toLowerCase()] = a; });
      }

      var bannerEl = document.getElementById('restoIaBanner');
      var html = '';

      // ── TOP PICK ──────────────────────────────────────────────────────────
      if (topPick && topPick.name) {
        html +=
          '<div style="background:linear-gradient(135deg,rgba(46,204,113,.12),rgba(39,174,96,.06));border:2px solid rgba(46,204,113,.4);border-radius:16px;padding:20px 22px;margin-bottom:18px;position:relative;overflow:hidden">' +
          '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#2ecc71,#27ae60)"></div>' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
          '  <span style="font-size:1.8rem">🏆</span>' +
          '  <div>' +
          '    <div style="font-size:1rem;font-weight:800;color:#2ecc71">Meilleur choix selon votre régime</div>' +
          '    <div style="font-size:.8rem;color:var(--muted)">Sélectionné par l\'IA selon vos calories et budget</div>' +
          '  </div>' +
          '</div>' +
          '<div style="font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:10px">📍 '+escHtml(topPick.name)+'</div>' +
          '<div style="font-size:.85rem;color:var(--muted);line-height:1.65;margin-bottom:12px">'+escHtml(topPick.raison||'')+'</div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px">' +
          '  <div style="background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.25);border-radius:10px;padding:10px 12px">' +
          '    <div style="font-size:.7rem;color:#2ecc71;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">🍽️ Que commander</div>' +

      coachLoading = true;
      if (btn) btn.disabled = true;
      showCoachTyping();

      fetch(API_BASE + 'coach_ia.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_demande: coachDemandeId, question: question, history: coachHistory.slice(-10) })
      })
      .then(function(r){ return r.json(); })
      .then(function(data) {
        removeCoachTyping();
        coachLoading = false;
        if (btn) btn.disabled = false;
        if (data.success) {
          appendCoachMsg('bot', data.response);
          coachHistory.push({ role: 'assistant', content: data.response });
        } else {
          appendCoachMsg('bot', '❌ Erreur : ' + (data.error || 'Réessayez'));
        }

        removeCoachTyping();
        coachLoading = false;
        if (btn) btn.disabled = false;
        appendCoachMsg('bot', '❌ Erreur réseau. Vérifiez votre connexion.');
      });
    }

    /* ══ LECTURE VOCALE (Web Speech API) ══ */
    var _ttsUtterance = null;
    var _ttsSpeaking  = false;

    function ttsExtractText(idDemande) {
      var lines = [];
      var grid  = document.getElementById('pwGrid');
      if (!grid) return '';

      lines.push('Planning nutritionnel numéro ' + idDemande + '.');

      var semBtn = document.querySelector('.pw-sem-btn.active');
      if (semBtn) lines.push(semBtn.textContent.trim() + '.');

      var dayCols  = grid.querySelectorAll('.pw-gh-day');
      var mealCols = grid.querySelectorAll('.pw-mc');
      var slotRows = grid.querySelectorAll('.pw-sl-row');
      var slots    = [];
      slotRows.forEach(function(r){ slots.push(r.textContent.replace(/[🌅☀️🌙🏃💤]/g,'').trim()); });

      var nbDays  = dayCols.length;
      var nbSlots = slots.length;

      for (var d = 0; d < nbDays; d++) {
        var dayEl   = dayCols[d];
        var dayName = dayEl.querySelector('.pw-gh-day-name') ? dayEl.querySelector('.pw-gh-day-name').textContent : '';
        var dayNum  = dayEl.querySelector('.pw-gh-day-num')  ? dayEl.querySelector('.pw-gh-day-num').textContent  : '';
        lines.push(dayName + ' ' + dayNum + '.');

        for (var s = 0; s < nbSlots; s++) {
          var idx  = s * nbDays + d;
          var cell = mealCols[idx];
          if (!cell) continue;
          var empty = cell.querySelector('.pw-mc-empty');
          if (empty) continue;
          var cards = cell.querySelectorAll('.pw-card-txt, .pw-sport-name, .pw-sleep-t');
          var texts = [];
          cards.forEach(function(c){ var t = c.textContent.trim(); if (t && t !== '—') texts.push(t); });
          if (texts.length) lines.push(slots[s] + ' : ' + texts.join(', ') + '.');
        }
      }

      var footer = document.getElementById('pwSummary');
      if (footer) {
        var vals = footer.querySelectorAll('.pw-fc');
        vals.forEach(function(v){
          var lbl = v.querySelector('.pw-fc-lbl'), val = v.querySelector('.pw-fc-val');
          if (lbl && val) lines.push(lbl.textContent.replace(/[🥗💰🍳🏃]/g,'').trim() + ' : ' + val.textContent.trim() + '.');
        });
      }

      return lines.join(' ');
    }

    function ttsLire(idDemande) {
      if (!window.speechSynthesis) {
        showToast('❌ Votre navigateur ne supporte pas la lecture vocale', 'error');
        return;
      }
      var btn = document.getElementById('ttsBtnMain');

      if (_ttsSpeaking) {
        window.speechSynthesis.cancel();
        _ttsSpeaking = false;
        if (btn) { btn.classList.remove('speaking'); btn.innerHTML = '🔊 Écouter le planning'; }
        return;
      }

      var texte = ttsExtractText(idDemande);
      if (!texte.trim()) { showToast('⚠️ Aucun contenu à lire', 'error'); return; }

      _ttsUtterance         = new SpeechSynthesisUtterance(texte);
      _ttsUtterance.lang    = 'fr-FR';
      _ttsUtterance.rate    = 0.95;
      _ttsUtterance.pitch   = 1;
      _ttsUtterance.volume  = 1;

      // Sélectionner une voix française si disponible
      var trySpeak = function() {
        var voices  = window.speechSynthesis.getVoices();
        var voiceFr = voices.find(function(v){ return v.lang === 'fr-FR'; })
                   || voices.find(function(v){ return v.lang.startsWith('fr'); });
        if (voiceFr) _ttsUtterance.voice = voiceFr;

        _ttsUtterance.onstart = function() {
          _ttsSpeaking = true;
          if (btn) { btn.classList.add('speaking'); btn.innerHTML = '⏹️ Arrêter la lecture'; }
        };
        _ttsUtterance.onend = _ttsUtterance.onerror = function() {
          _ttsSpeaking = false;
          if (btn) { btn.classList.remove('speaking'); btn.innerHTML = '🔊 Écouter le planning'; }
        };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(_ttsUtterance);
      };

      // Les voix peuvent ne pas être chargées immédiatement (Chrome)
      if (window.speechSynthesis.getVoices().length > 0) {
        trySpeak();
      } else {
        window.speechSynthesis.onvoiceschanged = function() { trySpeak(); };
      }
    }
    

/* ══ MÉTÉO INTELLIGENTE ══ */
    var _meteoCache = null;

    function meteoGetCondition(wmo, pluie) {
      if (pluie)          return { label: 'Pluvieux',   emoji: '🌧️', classe: 'rain' };
      if (wmo >= 95)      return { label: 'Orageux',    emoji: '⛈️',  classe: 'rain' };
      if (wmo >= 71)      return { label: 'Neigeux',    emoji: '❄️',  classe: 'rain' };
      if (wmo >= 51)      return { label: 'Bruineux',   emoji: '🌦️', classe: 'rain' };
      if (wmo >= 3)       return { label: 'Nuageux',    emoji: '☁️',  classe: 'wind' };
      if (wmo === 2)      return { label: 'Partiellement nuageux', emoji: '⛅', classe: 'wind' };
      return              { label: 'Ensoleillé',  emoji: '☀️',  classe: 'good' };
    }

    function meteoSportAujourdhui(groupes, todayStr) {
      var g = groupes[todayStr] || {};
      return (g['sport'] || []).map(function(s){
        return s.split(/[—–-]+/)[0].trim();
      });
    }

    function pwOuvrirMeteo(idDemande, groupes, todayStr) {
      var oldPanel = document.getElementById('pw-meteo-panel');
      if (oldPanel) { oldPanel.remove(); return; }

      var btn = document.getElementById('pw-meteo-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Localisation…'; }

      var anchor = document.getElementById('pwToolbar');
      if (!anchor) return;

      if (!navigator.geolocation) {
        if (btn) { btn.disabled = false; btn.innerHTML = '🌤️ Météo & Sport'; }
        showToast('❌ Géolocalisation non supportée par votre navigateur', 'error');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude.toFixed(4);
          var lon = pos.coords.longitude.toFixed(4);
          if (btn) btn.innerHTML = '⏳ Météo en cours…';

          fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
            + '&current=temperature_2m,precipitation,windspeed_10m,weathercode'
            + '&timezone=auto&forecast_days=1')
          .then(function(r){ return r.json(); })
          .then(function(mData) {
            var cur    = mData.current || {};
            var temp   = Math.round(cur.temperature_2m   || 0);
            var pluie  = (cur.precipitation              || 0) > 0.5;
            var vent   = Math.round(cur.windspeed_10m    || 0);
            var wmo    = cur.weathercode                 || 0;
            var cond   = meteoGetCondition(wmo, pluie);
            var sports = meteoSportAujourdhui(groupes, todayStr);

            var meteo = { temp: temp, pluie: pluie, vent: vent, condition: cond.label, emoji: cond.emoji, classe: cond.classe };
            _meteoCache = meteo;

            if (btn) btn.innerHTML = '⏳ Analyse IA…';

            fetch(API_BASE + 'meteo_sport.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id_demande: idDemande, meteo: meteo, sports: sports })
            })
            .then(function(r){ return r.json(); })
            .then(function(res) {
              if (btn) { btn.disabled = false; btn.innerHTML = '🌤️ Météo & Sport'; }
              if (!res.success) { showToast('❌ ' + (res.error || 'Erreur IA'), 'error'); return; }
              pwAfficherMeteo(idDemande, meteo, res.reco, anchor, cond);
            })
            .catch(function() {
              if (btn) { btn.disabled = false; btn.innerHTML = '🌤️ Météo & Sport'; }
              showToast('❌ Erreur réseau meteo_sport.php', 'error');
            });
          })
          .catch(function() {
            if (btn) { btn.disabled = false; btn.innerHTML = '🌤️ Météo & Sport'; }
            showToast('❌ Impossible de récupérer la météo', 'error');
          });
        },
        function() {
          if (btn) { btn.disabled = false; btn.innerHTML = '🌤️ Météo & Sport'; }
          showToast('⚠️ Accès à la localisation refusé', 'error');
        },
        { timeout: 8000 }
      );
    }

    function pwAfficherMeteo(idDemande, meteo, reco, anchor, cond) {
      var old = document.getElementById('pw-meteo-panel');
      if (old) old.remove();

      var lieuIcon  = reco.lieu === 'intérieur' ? '🏠' : '🌳';
      var intensIcon = { légère: '🟢', modérée: '🟡', intense: '🔴' }[reco.intensite] || '⚪';
      var conseil_cls = reco.alerte ? 'alerte' : cond.classe;

      var panel = document.createElement('div');
      panel.className = 'meteo-panel';
      panel.id = 'pw-meteo-panel';
      panel.innerHTML =
        '<div class="meteo-panel-header ' + cond.classe + '">'
        +  '<span>' + meteo.emoji + ' ' + meteo.temp + '°C — ' + meteo.condition
        +    (meteo.pluie ? ' · 🌧️ Pluie' : '') + (meteo.vent > 30 ? ' · 💨 ' + meteo.vent + ' km/h' : '') + '</span>'
        +  '<button onclick="document.getElementById(\'pw-meteo-panel\').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.85rem;line-height:1">✕</button>'
        + '</div>'
        + '<div class="meteo-panel-body">'
        +  '<div class="meteo-kv"><div class="meteo-kv-lbl">🏃 Sport recommandé</div><div class="meteo-kv-val">' + escHtml(reco.sport_recommande) + '</div></div>'
        +  '<div class="meteo-kv"><div class="meteo-kv-lbl">⏱️ Durée</div><div class="meteo-kv-val">' + escHtml(reco.duree) + '</div></div>'
        +  '<div class="meteo-kv"><div class="meteo-kv-lbl">' + lieuIcon + ' Lieu</div><div class="meteo-kv-val">' + escHtml(reco.lieu) + '</div></div>'
        +  '<div class="meteo-kv"><div class="meteo-kv-lbl">' + intensIcon + ' Intensité</div><div class="meteo-kv-val">' + escHtml(reco.intensite) + '</div></div>'
        +  '<div class="meteo-conseil ' + conseil_cls + '">💡 ' + escHtml(reco.conseil) + '</div>'
        + '</div>';

      anchor.parentNode.insertBefore(panel, anchor.nextSibling);
    }


    /* ══ QR CODE PLANNING ══ */
    function pwOuvrirQR(idDemande) {
      var old = document.getElementById('pw-qr-panel');
      if (old) { old.remove(); return; }

      var anchor = document.getElementById('pwToolbar');
      if (!anchor) return;

      // URL du planning : page courante + param id_demande
      // Construit l'URL absolue vers planning_public.php quelle que soit la page courante
      var _path = window.location.pathname; // ex: /SmartNutrition/view/frontend/dashboard.html
      var _base = _path.substring(0, _path.lastIndexOf('/') + 1); // ex: /SmartNutrition/view/frontend/
      var url = window.location.origin + _base + 'planning/planning_public.php?id=' + idDemande;

      var panel = document.createElement('div');
      panel.id = 'pw-qr-panel';
      panel.className = 'qr-panel';
      panel.innerHTML =
        '<div id="pw-qr-canvas-wrap"></div>' +
        '<div class="qr-info">' +
          '<div class="qr-info-title">📱 QR Code — Planning #' + idDemande + '</div>' +
          '<div class="qr-info-sub">Scannez ce code pour accéder directement à ce planning sur n&#39;importe quel appareil.</div>' +
          '<button class="qr-dl-btn" id="pw-qr-dl">⬇️ Télécharger</button>' +
          '<button onclick="document.getElementById(\'pw-qr-panel\').remove()" style="margin-left:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;">✕ Fermer</button>' +
        '</div>';

      // Insérer le panel sous le toolbar
      anchor.parentNode.insertBefore(panel, anchor);

      // Charger qrcode.js depuis CDN et générer
      if (typeof QRCode === 'undefined') {
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        script.onload = function() { _pwGenQR(idDemande, url); };
        document.head.appendChild(script);
      } else {
        _pwGenQR(idDemande, url);
      }
    }

    function _pwGenQR(idDemande, url) {
      var wrap = document.getElementById('pw-qr-canvas-wrap');
      if (!wrap) return;
      var qr = new QRCode(wrap, {
        text: url,
        width:  180,
        height: 180,
        colorDark:  '#0d1117',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      // Bouton télécharger
      var dlBtn = document.getElementById('pw-qr-dl');
      if (dlBtn) {
        dlBtn.onclick = function() {
          // Attendre que le canvas soit prêt
          setTimeout(function() {
            var canvas = wrap.querySelector('canvas');
            if (canvas) {
              var link = document.createElement('a');
              link.download = 'planning-' + idDemande + '-qrcode.png';
              link.href = canvas.toDataURL('image/png');
              link.click();
            }
          }, 300);
        };
      }
    }

    window.planningApp = {
      showView:showView, showDemande:showDemande, showPlanning:showPlanning,
      goSportSommeil:goSportSommeil, deleteDemande:deleteDemande, closeModal:closeModal,
      goPage:goPage, init:init,
      sendCoachMessage:sendCoachMessage, resetCoachChat:resetCoachChat,
      selectCoachDemande:selectCoachDemande, sendCoachQuestion:sendCoachQuestion,
      ttsLire:ttsLire,
      pwOuvrirMeteo:pwOuvrirMeteo,
      pwOuvrirQR:pwOuvrirQR,
      renderRestaurants:renderRestaurants,
      _setSemaine:function(){}, _pwW:function(){}, _pwF:function(){},
      _applyAndRender: function() { currentPage = 1; applyAndRender(); },
      _applySort: function() { applyAndRender(); },
      _toggleSortDir: function() {
        listSort.dir = listSort.dir === 'asc' ? 'desc' : 'asc';
        var btn = document.getElementById('listSortDirBtn');
        if (btn) {
          btn.textContent = listSort.dir === 'asc' ? '↑ ASC' : '↓ DESC';
          btn.style.color = listSort.dir === 'asc' ? '#2ecc71' : 'var(--violet, #a78bfa)';
        }
        applyAndRender();
      }
    };

    var attempts=0, poll=setInterval(function(){
      attempts++;
      if(document.getElementById('planningContent')){clearInterval(poll);init();}
      else if(attempts>60){clearInterval(poll);console.error('❌ Timeout planning init');}
    },50);

  })();
  </script>
