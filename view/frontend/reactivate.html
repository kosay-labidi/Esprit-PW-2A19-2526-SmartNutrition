<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Réactiver mon compte - GaiaLumen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --green: #1F3D2B;
  --sand: #F2E8CF;
  --violet: #6B4E9E;
  --blue: #4A9FD8;
  --bg-dark: #0A120E;
  --bg-light: #F8F5ED;
  --text-dark: #1A2E22;
  --text-light: #F2E8CF;
  --card-bg-dark: rgba(15, 30, 20, 0.88);
  --card-bg-light: rgba(248, 245, 237, 0.92);
  --border: rgba(107, 78, 158, 0.25);
}

[data-theme="light"] {
  --bg: var(--bg-light);
  --text: var(--text-dark);
  --card-bg: var(--card-bg-light);
}

[data-theme="dark"] {
  --bg: var(--bg-dark);
  --text: var(--text-light);
  --card-bg: var(--card-bg-dark);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 450px;
  width: 90%;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 40px 36px;
  border: 1px solid var(--border);
  text-align: center;
}

.logo {
  margin-bottom: 30px;
}

.logo svg {
  width: 60px;
  height: 60px;
  margin-bottom: 15px;
}

.logo h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  background: linear-gradient(135deg, var(--sand), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.email-display {
  background: rgba(107, 78, 158, 0.15);
  padding: 14px;
  border-radius: 14px;
  margin: 20px 0;
  font-weight: 600;
  word-break: break-all;
}

.oauth-info {
  background: rgba(74, 159, 216, 0.12);
  padding: 16px;
  border-radius: 16px;
  margin: 15px 0;
  display: none;
  border-left: 3px solid var(--blue);
  text-align: left;
}

.form-group {
  margin-bottom: 20px;
  text-align: left;
}

label {
  display: block;
  font-size: 0.75rem;
  margin-bottom: 8px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted);
}

input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(31, 61, 43, 0.3);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-size: 0.95rem;
}

.btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--violet), var(--blue));
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(107, 78, 158, 0.4);
}

.btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.message {
  padding: 12px 16px;
  border-radius: 12px;
  margin: 15px 0;
  display: none;
  font-size: 0.85rem;
}

.message.success {
  background: rgba(46, 204, 113, 0.12);
  color: #2ecc71;
  border-left: 3px solid #2ecc71;
}

.message.error {
  background: rgba(231, 76, 60, 0.12);
  color: #e74c3c;
  border-left: 3px solid #e74c3c;
}

.links {
  margin-top: 25px;
}

.links a {
  color: var(--blue);
  text-decoration: none;
  font-size: 0.85rem;
}

#theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 1.2rem;
}
</style>
</head>
<body>

<button id="theme-toggle">🌙</button>

<div class="container">
  <div class="logo">
    <svg viewBox="0 0 60 60" fill="none" width="60" height="60">
      <circle cx="30" cy="30" r="28" stroke="url(#ag)" stroke-width="1.5" opacity=".6"/>
      <circle cx="30" cy="30" r="22" stroke="url(#ag)" stroke-width=".8" opacity=".3"/>
      <defs>
        <radialGradient id="ag" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4A9FD8"/>
          <stop offset="100%" stop-color="#6B4E9E"/>
        </radialGradient>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1F3D2B"/>
          <stop offset="100%" stop-color="#4A9FD8"/>
        </linearGradient>
      </defs>
      <path d="M30 10 C42 18,46 30,30 50 C14 30,18 18,30 10Z" fill="url(#lg)"/>
      <path d="M30 14 L30 46" stroke="rgba(242,232,207,.5)" stroke-width="1"/>
    </svg>
    <h1>GaiaLumen</h1>
  </div>

  <div style="font-size: 48px; margin-bottom: 10px;">⚠️</div>
  <h2>Compte désactivé</h2>
  
  <div id="emailDisplay" class="email-display">Chargement...</div>
  
  <div id="oauthInfo" class="oauth-info">
    <p>🔐 Compte connecté via réseau social</p>
    <p style="font-size: 0.75rem;">Vous n'avez pas besoin de mot de passe pour réactiver ce compte.</p>
  </div>
  
  <div id="messageArea" class="message"></div>
  
  <form id="reactivateForm">
    <div class="form-group" id="passwordGroup">
      <label>🔐 MOT DE PASSE</label>
      <input type="password" id="password" placeholder="Entrez votre mot de passe" autocomplete="new-password" value="">
    </div>
    <button type="submit" class="btn" id="submitBtn">🔄 Réactiver mon compte</button>
  </form>
  
  <div class="links">
    <a href="login.html">← Retour à la connexion</a>
  </div>
</div>

<script>
const BASE_URL = '';
let userEmail = '';
let isOAuthAccount = false;

// Récupérer l'email
const urlParams = new URLSearchParams(window.location.search);
userEmail = urlParams.get('email');
document.getElementById('emailDisplay').textContent = userEmail || 'Email non spécifié';

function showMessage(msg, type) {
  const div = document.getElementById('messageArea');
  div.textContent = msg;
  div.className = `message ${type}`;
  div.style.display = 'block';
  setTimeout(() => { div.style.display = 'none'; }, 5000);
}

// Vérifier le type de compte
async function checkAccountType() {
  if (!userEmail || userEmail === 'Email non spécifié') return;
  
  try {
    const response = await fetch(BASE_URL + '/view/backend/users/check_account_type.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail })
    });
    const result = await response.json();
    
    if (result.is_oauth) {
      isOAuthAccount = true;
      document.getElementById('passwordGroup').style.display = 'none';
      document.getElementById('oauthInfo').style.display = 'block';
    }
  } catch (error) {
    console.error('Erreur:', error);
  }
}

// Réactiver le compte
async function reactivateAccount(e) {
  e.preventDefault();
  
  const submitBtn = document.getElementById('submitBtn');
  const password = isOAuthAccount ? '' : document.getElementById('password').value;
  
  if (!isOAuthAccount && !password) {
    showMessage('Veuillez entrer votre mot de passe', 'error');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ Réactivation...';
  
  try {
    const response = await fetch(BASE_URL + '/view/backend/users/reactivate_account.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail, password: password })
    });
    
    const result = await response.json();
    
    if (result.success) {
      showMessage('✅ ' + result.message, 'success');
      // Redirection après 2 secondes
      setTimeout(() => {
        window.location.href = 'login.html?reactivated=success';
      }, 2000);
    } else {
      showMessage(result.message || 'Erreur lors de la réactivation', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = '🔄 Réactiver mon compte';
    }
  } catch (error) {
    showMessage('Erreur de connexion au serveur', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '🔄 Réactiver mon compte';
  }
}

// Theme
const themeToggle = document.getElementById('theme-toggle');
const html = document.documentElement;
let isDark = localStorage.getItem('gaialumen-theme') !== 'light';
html.setAttribute('data-theme', isDark ? 'dark' : 'light');
themeToggle.textContent = isDark ? '☀️' : '🌙';
themeToggle.addEventListener('click', () => {
  isDark = !isDark;
  html.setAttribute('data-theme', isDark ? 'dark' : 'light');
  localStorage.setItem('gaialumen-theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
});

// Initialisation
document.getElementById('reactivateForm').addEventListener('submit', reactivateAccount);
checkAccountType();
</script>
</body>
</html>
