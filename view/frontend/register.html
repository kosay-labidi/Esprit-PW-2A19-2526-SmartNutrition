<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Inscription - GaiaLumen</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --green: #1F3D2B;
  --sand: #F2E8CF;
  --violet: #6B4E9E;
  --violet-light: #8B6FC9;
  --blue: #4A9FD8;
  --blue-dark: #2E7AB6;
  --gold: #D4AF37;
  --bg-dark: #0A120E;
  --bg-light: #F8F5ED;
  --text-dark: #1A2E22;
  --text-light: #F2E8CF;
  --muted-dark: #8A9A82;
  --muted-light: #6B7A63;
  --card-bg-dark: rgba(15, 30, 20, 0.88);
  --card-bg-light: rgba(248, 245, 237, 0.92);
  --glass-dark: rgba(31, 61, 43, 0.4);
  --glass-light: rgba(242, 232, 207, 0.5);
  --shadow-dark: 0 25px 70px rgba(0, 0, 0, 0.6);
  --shadow-light: 0 25px 70px rgba(31, 61, 43, 0.12);
  --border-glow: rgba(107, 78, 158, 0.35);
  --transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-theme="light"] {
  --bg: var(--bg-light);
  --text: var(--text-dark);
  --muted: var(--muted-light);
  --card-bg: var(--card-bg-light);
  --glass: var(--glass-light);
  --shadow: var(--shadow-light);
}

[data-theme="dark"] {
  --bg: var(--bg-dark);
  --text: var(--text-light);
  --muted: var(--muted-dark);
  --card-bg: var(--card-bg-dark);
  --glass: var(--glass-dark);
  --shadow: var(--shadow-dark);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  overflow:auto;
  cursor:none;
  transition:var(--transition);
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;}

/* Scrollbar */
body::-webkit-scrollbar{width:8px;}
body::-webkit-scrollbar-track{background:rgba(107,78,158,0.1);border-radius:4px;}
body::-webkit-scrollbar-thumb{background:var(--violet);border-radius:4px;}

/* CURSEUR */
#cursor{
  position:fixed;top:0;left:0;z-index:9999;pointer-events:none;
  width:8px;height:8px;border-radius:50%;
  background:var(--violet);
  box-shadow:0 0 15px var(--violet),0 0 30px var(--blue);
  transform:translate(-50%,-50%);
  transition:width 0.2s,height 0.2s;
  mix-blend-mode:screen;
}
#cursor.hover{width:32px;height:32px;background:var(--blue);}
#cursor-trail{
  position:fixed;top:0;left:0;z-index:9998;pointer-events:none;
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid rgba(107,78,158,0.4);
  transform:translate(-50%,-50%);
}

/* PRELOADER */
#preloader{
  position:fixed;inset:0;z-index:10000;
  background:#0A0E0C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.8s,visibility 0.8s;
}
#preloader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#pl-canvas{width:160px;height:160px;}
#pl-text{
  margin-top:24px;
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem;letter-spacing:0.4em;color:var(--sand);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.98)}50%{opacity:1;transform:scale(1)}}

/* BACKGROUND 3D */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* BACK BUTTON */
#back-home{
  position:fixed;top:24px;left:24px;z-index:99999;
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(107,78,158,0.4);
  background:var(--glass);
  backdrop-filter:blur(12px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);text-decoration:none;
  pointer-events:auto;
}
#back-home:hover{transform:scale(1.1) translateX(-3px);border-color:var(--violet);}
#back-home svg{stroke:var(--text);transition:var(--transition);}
#back-home:hover svg{stroke:var(--violet-light);transform:translateX(-2px);}

/* CONTAINER */
.container {
  position: relative;
  z-index: 2;
  max-width: 520px;
  width: 90%;
  background: var(--card-bg);
  border-radius: 32px;
  padding: 48px 40px;
  box-shadow: var(--shadow);
  margin: 40px 8% 40px auto;
}
.container::-webkit-scrollbar{width:5px;}
.container::-webkit-scrollbar-track{background:rgba(107,78,158,0.1);border-radius:10px;}
.container::-webkit-scrollbar-thumb{background:var(--violet);border-radius:10px;}

@keyframes slideUp{from{opacity:0;transform:translateY(50px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}

/* LOGO */
.logo{text-align:center;margin-bottom:32px;}
.logo h1{
  font-size:2rem;
  background:linear-gradient(135deg,var(--sand) 0%,var(--gold) 50%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.logo p{color:var(--muted);font-size:0.85rem;}

/* FORM */
.form-group{margin-bottom:20px;}
.form-group label{
  display:block;
  margin-bottom:8px;
  font-size:0.85rem;
  font-weight:600;
  color:var(--text);
  opacity:0.85;
}
.form-group input, .form-group select{
  width:100%;
  padding:14px 16px;
  background:rgba(31,61,43,0.3);
  border:1.5px solid rgba(107,78,158,0.25);
  border-radius:16px;
  color:var(--text);
  font-size:0.95rem;
  font-family:'Inter',sans-serif;
  transition:var(--transition);
}
.form-group input:focus, .form-group select:focus{
  outline:none;
  border-color:var(--violet);
  background:rgba(31,61,43,0.5);
  box-shadow:0 0 20px rgba(107,78,158,0.25);
}
.form-group input::placeholder{color:rgba(242,232,207,0.35);}
.form-group select option{background:var(--bg);}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:560px){.form-row{grid-template-columns:1fr;}}

/* PASSWORD STRENGTH */
.password-strength{margin-top:10px;}
.strength-bars{display:flex;gap:6px;margin-bottom:8px;}
.bar{flex:1;height:6px;background:rgba(255,255,255,0.15);border-radius:6px;transition:all 0.2s;}
.bar.active.weak{background:#e74c3c;box-shadow:0 0 6px #e74c3c;}
.bar.active.medium{background:#f39c12;box-shadow:0 0 6px #f39c12;}
.bar.active.strong{background:#2ecc71;box-shadow:0 0 6px #2ecc71;}
.strength-text{font-size:0.7rem;font-weight:600;letter-spacing:0.5px;color:var(--muted);}
.strength-text.weak{color:#e74c3c;}
.strength-text.medium{color:#f39c12;}
.strength-text.strong{color:#2ecc71;}

/* BUTTON */
.btn-submit{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,var(--violet) 0%,var(--blue) 100%);
  border:none;
  border-radius:16px;
  color:#fff;
  font-size:1rem;
  font-weight:600;
  font-family:'Inter',sans-serif;
  cursor:none;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  margin-top:8px;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(107,78,158,0.5);}
.btn-submit:active{transform:translateY(0);}
.btn-submit::before{
  content:'';position:absolute;top:50%;left:50%;
  width:0;height:0;border-radius:50%;
  background:rgba(255,255,255,0.35);
  transform:translate(-50%,-50%);
  transition:width 0.5s,height 0.5s;
}
.btn-submit:active::before{width:400px;height:400px;}
.btn-submit:disabled{opacity:0.7;transform:none;cursor:not-allowed;}

/* MESSAGES */
.msg{margin-top:16px;padding:12px 16px;border-radius:14px;font-size:0.88rem;display:none;}
.msg.error{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.3);color:#e74c3c;}
.msg.ok{background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);color:#2ecc71;}
.field-error{font-size:0.75rem;color:#e74c3c;margin-top:6px;display:none;}
input.invalid, select.invalid{border-color:#e74c3c !important;}

/* LINKS */
.links{text-align:center;margin-top:24px;}
.links a{color:var(--blue);text-decoration:none;font-size:0.85rem;font-weight:500;transition:var(--transition);}
.links a:hover{color:var(--violet-light);text-decoration:underline;}

/* PARTICLES */
.particle{
  position:fixed;pointer-events:none;z-index:1;
  font-size:22px;
  animation:floatUp 3s ease-out forwards;
  filter:drop-shadow(0 0 4px rgba(107,78,158,0.5));
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}
  100%{opacity:0;transform:translateY(-120px) rotate(360deg) scale(0.5);}
}

/* THEME TOGGLE */
#theme-toggle{
  position:fixed;top:24px;right:24px;z-index:1000;
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(107,78,158,0.4);
  background:var(--glass);
  backdrop-filter:blur(12px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
#theme-toggle:hover{transform:scale(1.1) rotate(8deg);border-color:var(--violet);}

/* AI ASSISTANT */
#ai-toggle{
  position:fixed;bottom:30px;left:30px;z-index:1000;
  width:64px;height:64px;border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--violet),var(--blue));
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
  box-shadow:0 10px 30px rgba(107,78,158,0.4);
}
#ai-toggle:hover{transform:scale(1.1) translateY(-3px);}
#ai-panel{
  position:fixed;bottom:110px;left:30px;z-index:999;
  width:380px;height:520px;
  background:var(--card-bg);
  backdrop-filter:blur(24px);
  border-radius:28px;
  border:1px solid rgba(107,78,158,0.3);
  display:none;flex-direction:column;overflow:hidden;
  animation:slideInLeft 0.3s ease;
}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:translateX(0);}}

/* TOOLTIP */
.tooltip{
  position:absolute;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(8px);
  color:#fff;
  padding:8px 14px;
  border-radius:12px;
  font-size:0.8rem;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s;
  z-index:10001;
}
#theme-toggle:hover .tooltip,#ai-toggle:hover .tooltip,#back-home:hover .tooltip{opacity:1;}
#theme-toggle .tooltip{top:60px;right:0;}
#ai-toggle .tooltip{bottom:75px;left:10px;}
#back-home .tooltip{top:60px;left:0;}

/* EARTH HINT */
.earth-hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);
  color:#fff;padding:12px 28px;border-radius:40px;
  font-size:0.85rem;z-index:100;
  animation:fadeInOut 4s ease-in-out infinite;
  pointer-events:none;white-space:nowrap;
}
@keyframes fadeInOut{0%,100%{opacity:0;transform:translateX(-50%) translateY(5px);}10%,90%{opacity:1;transform:translateX(-50%) translateY(0);}}

/* RESPONSIVE */
@media(max-width:768px){
  body{justify-content:center;align-items:flex-start;padding:20px 0;}
  .container{margin:20px auto;padding:36px 28px;max-width:95%;max-height:none;}
  #back-home{top:16px;left:16px;width:45px;height:45px;}
  #theme-toggle{width:45px;height:45px;top:16px;right:16px;}
  #ai-toggle{width:56px;height:56px;bottom:20px;left:20px;}
  #ai-panel{width:calc(100% - 40px);left:20px;bottom:90px;height:480px;}
  .tooltip{display:none;}
  .earth-hint{font-size:0.7rem;padding:8px 16px;bottom:15px;}
}
/* Styles pour reCAPTCHA */
.recaptcha-container {
  margin: 20px 0;
  display: flex;
  justify-content: center;
}

[data-theme="dark"] .g-recaptcha {
  filter: brightness(0.9) contrast(1.1);
}

[data-theme="light"] .g-recaptcha {
  filter: brightness(1);
}

@media (max-width: 768px) {
  .recaptcha-container {
    transform: scale(0.9);
  }
}
</style>
</head>

<script>
/* PRELOADER */
(function(){
  const c=document.getElementById('pl-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=140;c.height=140;
  let a=0,prog=0;
  function draw(){
    prog=Math.min(prog+2,100);a+=.04;
    ctx.clearRect(0,0,140,140);
    ctx.save();ctx.translate(70,70);ctx.rotate(a);
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(0,0,48-i*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i===0?'74,159,216':i===1?'107,78,158':'31,61,43'},${.6-i*.15})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.rotate(-a*.3);
    const g=ctx.createLinearGradient(-18,-26,18,26);
    g.addColorStop(0,'#1F3D2B');g.addColorStop(1,'#4A9FD8');
    ctx.beginPath();ctx.fillStyle=g;
    ctx.moveTo(0,-26);ctx.bezierCurveTo(19,-12,22,7,0,26);
    ctx.bezierCurveTo(-22,7,-19,-12,0,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);
    ctx.strokeStyle='rgba(242,232,207,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    if(prog<100)requestAnimationFrame(draw);
    else setTimeout(()=>{const pl=document.getElementById('preloader');if(pl)pl.classList.add('hidden');},300);
  }
  requestAnimationFrame(draw);
})();

/* CURSEUR */
(function(){
  const cur=document.getElementById('cursor');
  const trail=document.getElementById('cursor-trail');
  if(!cur||!trail)return;
  let mx=0,my=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
  (function loop(){tx+=(mx-tx)*.12;ty+=(my-ty)*.12;trail.style.left=tx+'px';trail.style.top=ty+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button,input,select').forEach(el=>{
    el.addEventListener('mouseenter',()=>cur.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cur.classList.remove('hover'));
  });
})();

/* PARTICULES */
document.addEventListener('click',e=>{
  const emojis=['🍃','🌿','🍀','✨','🌱','💫','🕊️'];
  for(let i=0;i<6;i++){
    const p=document.createElement('div');p.className='particle';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),3000);
  }
});

/* THREE.JS BACKGROUND */
window.addEventListener('load',function(){
  const canvas=document.getElementById('bg-canvas');
  if(!canvas||typeof THREE==='undefined')return;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
  camera.position.set(0,0,6);
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  resize();window.addEventListener('resize',resize);
  scene.add(new THREE.AmbientLight(0xffffff,.3));

/* PASSWORD STRENGTH */
function evaluatePasswordStrength(password) {
  let score = 0;
  if (!password) return 0;
  if (password.length >= 8) score += 2;
  else if (password.length >= 6) score += 1;
  if (/[0-9]/.test(password)) score += 1;
  if (/[a-z]/.test(password)) score += 1;
  if (/[A-Z]/.test(password)) score += 1;
  if (/[^a-zA-Z0-9]/.test(password)) score += 1;
  return Math.min(score, 6);
}

function updateStrengthIndicator(password) {
  const score = evaluatePasswordStrength(password);
  const bars = document.querySelectorAll('#strengthBars .bar');
  const strengthTextEl = document.getElementById('strengthText');
  bars.forEach(bar => bar.classList.remove('active', 'weak', 'medium', 'strong'));
  let strengthType = 'weak';
  let label = 'TRÈS FAIBLE';
  if (score >= 5) { strengthType = 'strong'; label = 'FORT ✓ - Accepté'; }
  else if (score >= 3) { strengthType = 'medium'; label = 'MOYEN ✗ - Non accepté'; }
  else if (score >= 1) { strengthType = 'weak'; label = 'FAIBLE ✗ - Non accepté'; }
  else { label = 'Saisir un mot de passe'; }
  for (let i = 0; i < score; i++) { if (bars[i]) bars[i].classList.add('active', strengthType); }
  strengthTextEl.textContent = label;
  strengthTextEl.classList.remove('weak', 'medium', 'strong');
  if (score >= 5) strengthTextEl.classList.add('strong');
  else if (score >= 3) strengthTextEl.classList.add('medium');
  else if (score >= 1) strengthTextEl.classList.add('weak');
}

/* FORM HANDLER */
const form = document.getElementById('form-register');
const msgBox = document.getElementById('msg');
const btn = document.getElementById('btn-submit');
const mdpInput = document.getElementById('mdp');
const mdp2Input = document.getElementById('mdp2');

function checkFormValidity() {
  const mdp = mdpInput.value;
  const mdp2 = mdp2Input.value;
  const score = evaluatePasswordStrength(mdp);
  btn.disabled = !(score >= 5 && mdp === mdp2 && mdp.length >= 6);
}

mdpInput.addEventListener('input', function() {
  const mdp = this.value;
  const score = evaluatePasswordStrength(mdp);
  updateStrengthIndicator(mdp);
  if (!mdp) { document.getElementById('err-mdp').style.display = 'none'; this.classList.remove('invalid'); }
  else if (mdp.length < 6) {
    document.getElementById('err-mdp').textContent = 'Minimum 6 caractères.';
    document.getElementById('err-mdp').style.display = 'block'; this.classList.add('invalid');
  }
  else if (score < 5) {
    document.getElementById('err-mdp').textContent = '❌ Utilisez : 8+ caractères, Majuscule, Minuscule, Chiffre ET Symbole';
    document.getElementById('err-mdp').style.display = 'block'; this.classList.add('invalid');
  }
  else { document.getElementById('err-mdp').style.display = 'none'; this.classList.remove('invalid'); }
  const mdp2 = mdp2Input.value;
  if (mdp2 && mdp !== mdp2) {
    document.getElementById('err-mdp2').textContent = 'Les mots de passe ne correspondent pas.';
    document.getElementById('err-mdp2').style.display = 'block'; mdp2Input.classList.add('invalid');
  } else if (mdp2) {
    document.getElementById('err-mdp2').style.display = 'none'; mdp2Input.classList.remove('invalid');
  }
  checkFormValidity();
});

mdp2Input.addEventListener('input', function() {
  const mdp = mdpInput.value;
  const mdp2 = this.value;
  if (mdp !== mdp2) {
    document.getElementById('err-mdp2').textContent = 'Les mots de passe ne correspondent pas.';
    document.getElementById('err-mdp2').style.display = 'block'; this.classList.add('invalid');
  } else {
    document.getElementById('err-mdp2').style.display = 'none'; this.classList.remove('invalid');
  }
  checkFormValidity();
});

function showMsg(text, ok) {
  msgBox.textContent = text;
  msgBox.className = 'msg ' + (ok ? 'ok' : 'error');
  msgBox.style.display = 'block';
}

function fieldError(id, msg) {
  const el = document.getElementById('err-' + id);
  const inp = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
  if (inp) inp.classList.toggle('invalid', !!msg);
}

function clearErrors() {
  ['nom','prenom','email','mdp','mdp2'].forEach(id => fieldError(id, ''));
  msgBox.style.display = 'none';
}

function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function getRecaptchaToken() {
  return new Promise((resolve, reject) => {
    if (typeof grecaptcha !== 'undefined') {
      const response = grecaptcha.getResponse();
      if (response) {
        resolve(response);
      } else {
        reject('Veuillez compléter le CAPTCHA');
      }
    } else {
      reject('reCAPTCHA non chargé');
    }
  });
}

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  clearErrors();
  
  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const email = document.getElementById('email').value.trim();
  const mdp = document.getElementById('mdp').value;
  const mdp2 = document.getElementById('mdp2').value;
  const role = document.getElementById('role').value;
  
  let valid = true;
  
  if (!nom) { fieldError('nom','Le nom est obligatoire.'); valid = false; }
  else if (/\d/.test(nom)) { fieldError('nom','Le nom ne doit pas contenir de chiffres.'); valid = false; }
  
  if (!prenom) { fieldError('prenom','Le prénom est obligatoire.'); valid = false; }
  else if (/\d/.test(prenom)) { fieldError('prenom','Le prénom ne doit pas contenir de chiffres.'); valid = false; }
  
  if (!email) { fieldError('email',"L'email est obligatoire."); valid = false; }
  else if (!validateEmail(email)) { fieldError('email',"Format d'email invalide."); valid = false; }
  
  const score = evaluatePasswordStrength(mdp);
  if (!mdp) { fieldError('mdp','Le mot de passe est obligatoire.'); valid = false; }
  else if (mdp.length < 6) { fieldError('mdp','Minimum 6 caractères.'); valid = false; }
  else if (score < 5) { fieldError('mdp','❌ Mot de passe REFUSÉ ! Utilisez : 8+ caractères, Maj, Min, Chiffre ET Symbole.'); valid = false; }
  
  if (!mdp2) { fieldError('mdp2','Veuillez confirmer le mot de passe.'); valid = false; }
  else if (mdp !== mdp2) { fieldError('mdp2','Les mots de passe ne correspondent pas.'); valid = false; }
  
  if (!valid) { checkFormValidity(); return; }
  
  // Vérification du reCAPTCHA
  let recaptchaToken;
  try {
    recaptchaToken = await getRecaptchaToken();
  } catch (err) {
    showMsg(err, false);
    return;
  }
  
  btn.disabled = true; 
  btn.textContent = 'Inscription...';
  
  try {
    const response = await fetch('../backend/users/register.php', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        nom, prenom, email, mdp, role
      })
    });
    
    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) { 
      throw new Error('Le serveur ne renvoie pas du JSON.'); 
    }
    
    const result = await response.json();
    
    if (result.success) {
      showMsg('✅ Inscription réussie ! Redirection...', true);
      form.reset(); 
      updateStrengthIndicator(''); 
      btn.disabled = true;
      
      // Réinitialiser le reCAPTCHA
      if (typeof grecaptcha !== 'undefined') {
        grecaptcha.reset();
      }
      
      setTimeout(() => { 
        window.location.href = 'login.html'; 
      }, 2000);
    } else { 
      showMsg(result.message || "Erreur lors de l'inscription.", false); 
      btn.disabled = false; 
      btn.textContent = "S'inscrire"; 
      checkFormValidity();
      
      // Réinitialiser le reCAPTCHA en cas d'erreur
      if (typeof grecaptcha !== 'undefined') {
        grecaptcha.reset();
      }
    }
  } catch (err) {
    console.error('Erreur inscription:', err);
    showMsg('Impossible de contacter le serveur.', false);
    btn.disabled = false; 
    btn.textContent = "S'inscrire"; 
    checkFormValidity();
    
    // Réinitialiser le reCAPTCHA
    if (typeof grecaptcha !== 'undefined') {
      grecaptcha.reset();
    }
  }
});

function aiRespond(question){

  if(q.includes('email')) return "L'email doit être valide et unique. Utilisez une adresse que vous consultez régulièrement. 📧";
  if(q.includes('rôle')||q.includes('role')) return "Vous pouvez choisir : Utilisateur, Nutritionniste ou Écologiste selon votre profil. 🌿";
  if(q.includes('inscription')||q.includes('créer')) return "Remplissez tous les champs, le mot de passe doit être FORT, puis cliquez sur 'S'inscrire'. ✅";
  return "Je vous aide à créer votre compte ! Choisissez un mot de passe fort (8+ caractères avec maj, min, chiffre, symbole). 😊";
}
