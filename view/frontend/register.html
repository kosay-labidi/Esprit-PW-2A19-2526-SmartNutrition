<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - GaiaLumen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --green:#1F3D2B;--sand:#F2E8CF;--violet:#5B3E96;--blue:#3A86C4;
  --bg:#0a1a10;--text:#F2E8CF;--muted:#a8b8a0;
  --card-bg:rgba(15,35,24,0.85);--glass:rgba(31,61,43,0.45);
  --shadow:0 20px 60px rgba(0,0,0,0.5);
}
[data-theme="light"]{
  --bg:#f5f0e8;--text:#1F3D2B;--muted:#5a6e5a;
  --card-bg:rgba(242,232,207,0.85);--glass:rgba(242,232,207,0.6);
  --shadow:0 20px 60px rgba(31,61,43,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Lato',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:none;
  transition:background 0.3s,color 0.3s;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;}
#cursor{
  position:fixed;top:0;left:0;z-index:9999;pointer-events:none;
  width:14px;height:14px;border-radius:50%;
  background:var(--violet);
  box-shadow:0 0 12px var(--violet),0 0 24px var(--blue);
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s;
  mix-blend-mode:screen;
}
#cursor.hover{width:28px;height:28px;background:var(--blue);}
#cursor-trail{
  position:fixed;top:0;left:0;z-index:9998;pointer-events:none;
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid rgba(91,62,150,.5);
  transform:translate(-50%,-50%);
}
#preloader{
  position:fixed;inset:0;z-index:10000;
  background:#050e08;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s,visibility .8s;
}
#preloader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#pl-canvas{width:140px;height:140px;}
#pl-text{
  margin-top:20px;
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;letter-spacing:.3em;color:var(--sand);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
.container{
  position:relative;z-index:2;
  max-width:480px;width:90%;
  background:var(--card-bg);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:20px;
  padding:40px 35px;
  box-shadow:var(--shadow);
  border:1px solid rgba(91,62,150,0.3);
  animation:slideUp .8s ease;
  margin-left:auto;
  margin-right:10%;
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
.logo{text-align:center;margin-bottom:24px;}
.logo h1{
  font-size:1.85rem;
  background:linear-gradient(135deg,var(--sand),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.logo p{color:rgba(242,232,207,0.7);font-size:0.85rem;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;margin-bottom:6px;font-size:0.85rem;color:var(--sand);font-weight:600;}
.form-group input, .form-group select{
  width:100%;padding:12px 14px;
  background:rgba(31,61,43,0.4);
  border:1px solid rgba(91,62,150,0.3);
  border-radius:10px;color:var(--sand);font-size:0.95rem;transition:all 0.3s;
}
.form-group input:focus, .form-group select:focus{
  outline:none;border-color:var(--violet);
  background:rgba(31,61,43,0.6);box-shadow:0 0 20px rgba(91,62,150,0.3);
}
.form-group input::placeholder{color:rgba(242,232,207,0.4);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.form-row{grid-template-columns:1fr;}}

/* --- INDICATEUR FORCE MOT DE PASSE : 6 BARRES --- */
.password-strength {
  margin-top: 8px;
  width: 100%;
}
.strength-bars {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}
.bar {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 6px;
  transition: background 0.2s ease, box-shadow 0.2s;
}
.bar.active.weak {
  background: #e74c3c;
  box-shadow: 0 0 6px #e74c3c;
}
.bar.active.medium {
  background: #f39c12;
  box-shadow: 0 0 6px #f39c12;
}
.bar.active.strong {
  background: #2ecc71;
  box-shadow: 0 0 6px #2ecc71;
}
.strength-text {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  color: var(--muted);
  transition: color 0.3s;
}
.strength-text.weak { color: #e74c3c; }
.strength-text.medium { color: #f39c12; }
.strength-text.strong { color: #2ecc71; }

.btn-submit{
  width:100%;padding:12px;
  background:linear-gradient(135deg,var(--violet),var(--blue));
  border:none;border-radius:10px;color:#fff;font-size:0.95rem;font-weight:600;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.3s;
  position:relative;overflow:hidden;margin-top:8px;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(91,62,150,0.5);}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.links{text-align:center;margin-top:20px;}
.links a{color:var(--blue);text-decoration:none;font-size:0.85rem;transition:color 0.3s;}
.links a:hover{color:var(--violet);text-decoration:underline;}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:.88rem;display:none;}
.msg.error{background:rgba(180,40,40,.25);border:1px solid rgba(255,100,100,.4);color:#fca5a5;}
.msg.ok{background:rgba(40,120,60,.25);border:1px solid rgba(100,200,120,.4);color:#6ee7b7;}
.field-error{font-size:0.78rem;color:#fca5a5;margin-top:4px;display:none;}
input.invalid{border-color:rgba(255,100,100,.6) !important;}
.particle{position:fixed;pointer-events:none;z-index:1;font-size:20px;animation:float 3s ease-out forwards;}
@keyframes float{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(-100px) rotate(360deg);}}
#theme-toggle{
  position:fixed;top:20px;right:20px;z-index:1000;
  width:50px;height:50px;border-radius:50%;
  border:2px solid rgba(91,62,150,0.4);background:var(--glass);backdrop-filter:blur(10px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;
}
#theme-toggle:hover{transform:scale(1.1);border-color:var(--violet);}
.earth-hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:30px;
  font-size:0.9rem;z-index:100;animation:fadeInOut 4s ease-in-out;pointer-events:none;
}
@keyframes fadeInOut{0%,100%{opacity:0;}10%,90%{opacity:1;}}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-trail"></div>
<div id="preloader">
  <canvas id="pl-canvas"></canvas>
  <div id="pl-text">GAIALUMEN</div>
</div>
<canvas id="bg-canvas"></canvas>
<div class="earth-hint">🌍 Cliquez et faites glisser pour faire tourner la Terre</div>
<button id="theme-toggle" aria-label="Changer le thème">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="container">
  <div class="logo">
    <h1>🌿 Créer un compte</h1>
    <p>Rejoignez GaiaLumen</p>
  </div>

  <form id="form-register" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Farhani" autocomplete="family-name"/>

      <div class="form-group">
        <label for="prenom">Prénom</label>

      </div>
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="text" id="email" name="email" placeholder="ahmed@gmail.com" autocomplete="email"/>
      <span class="field-error" id="err-email"></span>
    </div>
    
    <!-- Groupe mot de passe avec indicateur de force -->
    <div class="form-group">
      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" name="mdp" placeholder="8+ caractères, Maj, Min, Chiffre, Symbole" autocomplete="new-password"/>
      <!-- Indicateur visuel 6 barres -->
      <div class="password-strength">
        <div class="strength-bars" id="strengthBars">
          <div class="bar" data-index="0"></div>
          <div class="bar" data-index="1"></div>
          <div class="bar" data-index="2"></div>

  </form>

  <div id="msg" class="msg" role="alert"></div>

  <div class="links">
    <a href="login.html">Déjà un compte ? Se connecter</a>
    <div style="margin-top:10px;"><a href="index.html">← Accueil</a></div>
  </div>
</div>

<script>
/* ═══ PRELOADER ═══ */
(function(){
  const c=document.getElementById('pl-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=140;c.height=140;
  let a=0,prog=0;
  function draw(){
    prog=Math.min(prog+2,100);a+=.04;
    ctx.clearRect(0,0,140,140);
    ctx.save();ctx.translate(70,70);ctx.rotate(a);
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(0,0,48-i*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i===0?'58,134,196':i===1?'91,62,150':'31,61,43'},${.6-i*.15})`;
      ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.rotate(-a*.3);
    const g=ctx.createLinearGradient(-18,-26,18,26);
    g.addColorStop(0,'#1F3D2B');g.addColorStop(1,'#3A86C4');
    ctx.beginPath();ctx.fillStyle=g;
    ctx.moveTo(0,-26);ctx.bezierCurveTo(19,-12,22,7,0,26);
    ctx.bezierCurveTo(-22,7,-19,-12,0,-26);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,24);
    ctx.strokeStyle='rgba(242,232,207,.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
    if(prog<100)requestAnimationFrame(draw);
    else setTimeout(()=>{const pl=document.getElementById('preloader');if(pl)pl.classList.add('hidden');},300);
  }
  requestAnimationFrame(draw);
})();

/* ═══ CURSEUR ═══ */
(function(){
  const cur=document.getElementById('cursor');
  const trail=document.getElementById('cursor-trail');
  if(!cur||!trail)return;
  let mx=0,my=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
  (function loop(){tx+=(mx-tx)*.12;ty+=(my-ty)*.12;trail.style.left=tx+'px';trail.style.top=ty+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button,input,select').forEach(el=>{
    el.addEventListener('mouseenter',()=>cur.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cur.classList.remove('hover'));
  });
})();

/* ═══ PARTICULES ═══ */
document.addEventListener('click',e=>{
  const emojis=['🍃','🌿','🍀','✨','🌱'];
  for(let i=0;i<6;i++){
    const p=document.createElement('div');p.className='particle';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),3000);
  }
});

/* ═══ THREE.JS BACKGROUND ═══ */
window.addEventListener('load',function(){
  const canvas=document.getElementById('bg-canvas');
  if(!canvas||typeof THREE==='undefined')return;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
  camera.position.set(0,0,6);
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  resize();window.addEventListener('resize',resize);
  scene.add(new THREE.AmbientLight(0xffffff,.3));
  const dl=new THREE.DirectionalLight(0x3A86C4,1);dl.position.set(5,3,5);scene.add(dl);
  const pl=new THREE.PointLight(0x5B3E96,1.5,20);pl.position.set(-3,2,2);scene.add(pl);
  const loader=new THREE.TextureLoader();
  const earth=new THREE.Mesh(new THREE.SphereGeometry(2,64,64),new THREE.MeshPhongMaterial({map:loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),specular:new THREE.Color(0x3A86C4),shininess:28}));
  earth.position.set(-4,0,-2);scene.add(earth);
  const clouds=new THREE.Mesh(new THREE.SphereGeometry(2.03,64,64),new THREE.MeshPhongMaterial({map:loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),transparent:true,opacity:.28}));
  clouds.position.copy(earth.position);scene.add(clouds);
  const PC=1200,pp=new Float32Array(PC*3),pc=new Float32Array(PC*3);
  const pal=[new THREE.Color(0x1F3D2B),new THREE.Color(0x3A86C4),new THREE.Color(0x5B3E96),new THREE.Color(0xF2E8CF)];
  for(let i=0;i<PC;i++){pp[i*3]=(Math.random()-.5)*20;pp[i*3+1]=(Math.random()-.5)*20;pp[i*3+2]=(Math.random()-.5)*10;const c=pal[Math.floor(Math.random()*4)];pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b;}
  const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.03,vertexColors:true,transparent:true,opacity:.6}));scene.add(pts);
  let mx=0,my=0;document.addEventListener('mousemove',e=>{mx=(e.clientX/window.innerWidth-.5)*2;my=(e.clientY/window.innerHeight-.5)*2;});
  (function anim(){requestAnimationFrame(anim);earth.rotation.y+=.003;clouds.rotation.y+=.0035;pts.rotation.y+=.0003;pts.rotation.x+=.0001;camera.position.x+=(mx*.5-camera.position.x)*.05;camera.position.y+=(-my*.5-camera.position.y)*.05;camera.lookAt(0,0,0);renderer.render(scene,camera);})();
});

/* ═══ THEME TOGGLE ═══ */
const themeToggle=document.getElementById('theme-toggle');
const html=document.documentElement;
let isDark=localStorage.getItem('gaialumen-theme')!=='light';
html.setAttribute('data-theme',isDark?'dark':'light');
themeToggle.addEventListener('click',()=>{isDark=!isDark;html.setAttribute('data-theme',isDark?'dark':'light');localStorage.setItem('gaialumen-theme',isDark?'dark':'light');});

/* ═══════════════════════════════════════════════════
   INDICATEUR DE FORCE DU MOT DE PASSE (6 BARRES)
   ACCEPTE UNIQUEMENT LES MOTS DE PASSE FORTS (score >= 5)
═══════════════════════════════════════════════════ */

// Fonction d'évaluation du mot de passe (score sur 6)
function evaluatePasswordStrength(password) {
  let score = 0;
  if (!password) return 0;
  
  // Longueur : 0-5:0, 6-7:1, >=8:2
  if (password.length >= 8) score += 2;
  else if (password.length >= 6) score += 1;
  
  if (/[0-9]/.test(password)) score += 1;       // chiffre
  if (/[a-z]/.test(password)) score += 1;       // minuscule
  if (/[A-Z]/.test(password)) score += 1;       // majuscule
  if (/[^a-zA-Z0-9]/.test(password)) score += 1; // symbole spécial
  
  return Math.min(score, 6);
}

// Mise à jour de l'affichage des barres
function updateStrengthIndicator(password) {
  const score = evaluatePasswordStrength(password);
  const bars = document.querySelectorAll('#strengthBars .bar');
  const strengthTextEl = document.getElementById('strengthText');
  
  // Reset classes
  bars.forEach(bar => {
    bar.classList.remove('active', 'weak', 'medium', 'strong');
  });
  
  // Déterminer le type de force
  let strengthType = 'weak';
  let label = 'TRÈS FAIBLE';
  if (score >= 5) {
    strengthType = 'strong';
    label = 'FORT ✅ - Accepté';
  } else if (score >= 3) {
    strengthType = 'medium';
    label = 'MOYEN ❌ - Non accepté';
  } else if (score >= 1) {
    strengthType = 'weak';
    label = 'FAIBLE ❌ - Non accepté';
  } else {
    label = 'SAISIR UN MOT DE PASSE';
  }
  
  // Activer les barres selon le score
  for (let i = 0; i < score; i++) {
    if (bars[i]) {
      bars[i].classList.add('active', strengthType);
    }
  }
  
  // Changer le texte
  strengthTextEl.textContent = label;
  strengthTextEl.classList.remove('weak', 'medium', 'strong');
  if (score >= 5) strengthTextEl.classList.add('strong');
  else if (score >= 3) strengthTextEl.classList.add('medium');
  else if (score >= 1) strengthTextEl.classList.add('weak');
}

/* ═══ GESTION DU FORMULAIRE ═══ */
(function(){
  const form   = document.getElementById('form-register');
  const msgBox = document.getElementById('msg');
  const btn    = document.getElementById('btn-submit');
  const mdpInput = document.getElementById('mdp');
  const mdp2Input = document.getElementById('mdp2');
  
  // Fonction pour vérifier si le formulaire est valide (mot de passe fort + confirmation)
  function checkFormValidity() {
    const mdp = mdpInput.value;
    const mdp2 = mdp2Input.value;
    const score = evaluatePasswordStrength(mdp);
    
    // Le bouton est activé UNIQUEMENT si : score >= 5 ET mdp === mdp2 ET mdp.length >= 6
    if (score >= 5 && mdp === mdp2 && mdp.length >= 6) {
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  }
  
  /* --- Validation en temps réel du mot de passe --- */
  mdpInput.addEventListener('input', function() {
    const mdp = this.value;
    const score = evaluatePasswordStrength(mdp);
    
    // Mettre à jour l'affichage des barres
    updateStrengthIndicator(mdp);
    
    // Validation du mot de passe
    if (!mdp) {
      document.getElementById('err-mdp').textContent = '';
      document.getElementById('err-mdp').style.display = 'none';
      this.classList.remove('invalid');
    }
    else if (mdp.length < 6) {
      document.getElementById('err-mdp').textContent = 'Minimum 6 caractères.';
      document.getElementById('err-mdp').style.display = 'block';
      this.classList.add('invalid');
    }
    else if (score < 5) {
      document.getElementById('err-mdp').textContent = '❌ MOT DE PASSE REFUSÉ ! Utilisez : 8+ caractères, Majuscule, Minuscule, Chiffre ET Symbole spécial (@#$%!&*)';
      document.getElementById('err-mdp').style.display = 'block';
      this.classList.add('invalid');
    }
    else {
      document.getElementById('err-mdp').style.display = 'none';
      this.classList.remove('invalid');
    }
    
    // Vérifier la confirmation
    const mdp2 = mdp2Input.value;
    if (mdp2 && mdp !== mdp2) {
      document.getElementById('err-mdp2').textContent = 'Les mots de passe ne correspondent pas.';
      document.getElementById('err-mdp2').style.display = 'block';
      mdp2Input.classList.add('invalid');
    } else if (mdp2) {
      document.getElementById('err-mdp2').style.display = 'none';
      mdp2Input.classList.remove('invalid');
    }
    
    // Vérifier la validité globale du formulaire
    checkFormValidity();
  });
  
  /* --- Validation en temps réel de la confirmation --- */
  mdp2Input.addEventListener('input', function() {
    const mdp = mdpInput.value;
    const mdp2 = this.value;
    
    if (mdp !== mdp2) {
      document.getElementById('err-mdp2').textContent = 'Les mots de passe ne correspondent pas.';
      document.getElementById('err-mdp2').style.display = 'block';
      this.classList.add('invalid');
    } else {
      document.getElementById('err-mdp2').style.display = 'none';
      this.classList.remove('invalid');
    }
    
    checkFormValidity();
  });
  
  /* --- Validation nom/prenom sans chiffres --- */
  document.getElementById('nom').addEventListener('input', function(){
    if (/\d/.test(this.value)) {
      document.getElementById('err-nom').textContent = 'Le nom ne doit pas contenir de chiffres.';
      document.getElementById('err-nom').style.display = 'block';
      this.classList.add('invalid');
    } else {
      document.getElementById('err-nom').style.display = 'none';
      this.classList.remove('invalid');
    }
  });
  
  document.getElementById('prenom').addEventListener('input', function(){
    if (/\d/.test(this.value)) {
      document.getElementById('err-prenom').textContent = 'Le prénom ne doit pas contenir de chiffres.';
      document.getElementById('err-prenom').style.display = 'block';
      this.classList.add('invalid');
    } else {
      document.getElementById('err-prenom').style.display = 'none';
      this.classList.remove('invalid');
    }
  });
  
  /* --- Helpers pour les messages --- */
  function showMsg(text, ok) {
    msgBox.textContent = text;
    msgBox.className   = 'msg ' + (ok ? 'ok' : 'error');
    msgBox.style.display = 'block';
  }
  
  function fieldError(id, msg) {
    const el = document.getElementById('err-' + id);
    const inp = document.getElementById(id);
    if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
    if (inp) { inp.classList.toggle('invalid', !!msg); }
  }
  
  function clearErrors() {
    ['nom','prenom','email','mdp','mdp2'].forEach(id => fieldError(id, ''));
    msgBox.style.display = 'none';
  }
  
  function validateEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }
  
  /* --- Soumission du formulaire --- */
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearErrors();
    
    const nom    = document.getElementById('nom').value.trim();
    const prenom = document.getElementById('prenom').value.trim();
    const email  = document.getElementById('email').value.trim();
    const mdp    = document.getElementById('mdp').value;
    const mdp2   = document.getElementById('mdp2').value;
    const role   = document.getElementById('role').value;
    
    let valid = true;
    
    // Validation nom
    if (!nom) { fieldError('nom','Le nom est obligatoire.'); valid = false; }
    else if (/\d/.test(nom)) { fieldError('nom','Le nom ne doit pas contenir de chiffres.'); valid = false; }
    
    // Validation prénom
    if (!prenom) { fieldError('prenom','Le prénom est obligatoire.'); valid = false; }
    else if (/\d/.test(prenom)) { fieldError('prenom','Le prénom ne doit pas contenir de chiffres.'); valid = false; }
    
    // Validation email
    if (!email) { fieldError('email',"L'email est obligatoire."); valid = false; }
    else if (!validateEmail(email)) { fieldError('email',"Format d'email invalide."); valid = false; }
    
    // Validation mot de passe (doit être FORT)
    const score = evaluatePasswordStrength(mdp);
    if (!mdp) { fieldError('mdp','Le mot de passe est obligatoire.'); valid = false; }
    else if (mdp.length < 6) { fieldError('mdp','Minimum 6 caractères.'); valid = false; }
    else if (score < 5) { 
      fieldError('mdp','❌ MOT DE PASSE REFUSÉ ! Un mot de passe FORT est requis : 8+ caractères, une majuscule, une minuscule, un chiffre ET un symbole spécial (@#$%!&*).');
      valid = false;
    }
    
    // Validation confirmation
    if (!mdp2) { fieldError('mdp2','Veuillez confirmer le mot de passe.'); valid = false; }
    else if (mdp !== mdp2) { fieldError('mdp2','Les mots de passe ne correspondent pas.'); valid = false; }
    
    if (!valid) {
      // Réactiver la vérification pour que le bouton reste désactivé si besoin
      checkFormValidity();
      return;
    }
    
    btn.disabled    = true;
    btn.textContent = 'Envoi…';
    
    try {
      const response = await fetch(
        'http://localhost/Esprit-PW-2A19-2526-SmartNutrition/view/backend/users/addUser.php',
        {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ nom, prenom, email, mdp, role })
        }
      );
      
      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        const raw = await response.text();
        console.error('Réponse non-JSON:', raw);
        throw new Error('Le serveur ne renvoie pas du JSON.');
      }
      
      const result = await response.json();
      
      if (result.success) {
        showMsg('✅ Inscription réussie ! Redirection vers la connexion…', true);
        form.reset();
        updateStrengthIndicator(''); // reset barres
        btn.disabled = true; // désactiver à nouveau le bouton après reset
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } else {
        showMsg(result.message || "Erreur lors de l'inscription.", false);
        btn.disabled    = false;
        btn.textContent = "S'inscrire";
        checkFormValidity(); // revérifier
      }
      
    } catch (err) {
      console.error('Erreur inscription:', err);
      showMsg('Impossible de contacter le serveur : ' + err.message, false);
      btn.disabled    = false;
      btn.textContent = "S'inscrire";
      checkFormValidity();
    }
  });
})();
</script>
