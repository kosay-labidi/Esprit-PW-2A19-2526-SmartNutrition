<section class="content-section" id="profile">
  <div class="section-header">
    <h2 class="module-title">👤 Mon Profil</h2>
    <p>Gérez vos informations personnelles</p>
  </div>

  <div class="profile-container">
    <div class="profile-card" id="profile-info">
      <!-- Chargé dynamiquement -->
    </div>

    <div class="profile-actions">
      <button class="btn btn-primary" onclick="window.location.href='users/updateProfile.php'">
        ✏️ Modifier mon profil
      </button>
      <button class="btn btn-secondary" onclick="window.location.href='../../view/frontend/login.html'">
        🚪 Déconnexion
      </button>
    </div>
  </div>
</section>

<style>
.module-title {
  background: linear-gradient(135deg, var(--text), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.profile-container {
  max-width: 800px;
  margin: 0 auto;
}

.profile-card {
  background: var(--surface);
  padding: 32px;
  border-radius: 16px;
  border: 1px solid rgba(168, 184, 160, 0.2);
  margin-bottom: 24px;
}

.profile-avatar {
  text-align: center;
  margin-bottom: 24px;
}

.profile-avatar img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--blue);
}

.profile-info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 24px;
}

.profile-info-item {
  padding: 16px;
  background: rgba(168, 184, 160, 0.1);
  border-radius: 12px;
}

.profile-info-label {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 4px;
}

.profile-info-value {
  font-size: 1.1rem;
  font-weight: 600;
}

.profile-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}
</style>

<script>
function loadProfile() {
  const userId = 1; // À remplacer par l'ID de l'utilisateur connecté
  
  fetch('../../controller/user.controller.php?action=readOne&id=' + userId)
    .then(response => response.json())
    .then(result => {
      if(result.success) {
        displayProfile(result.data);
      }
    });
}

function displayProfile(user) {
  const html = `
    <div class="profile-avatar">
      ${user.avatar ? 
        `<img src="${user.avatar}" alt="Avatar">` : 
        `<div style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; margin: 0 auto;">
          ${user.prenom.charAt(0)}${user.nom.charAt(0)}
        </div>`
      }
      <h2 style="margin-top: 16px;">${user.prenom} ${user.nom}</h2>
      <p style="color: var(--muted);">${user.email}</p>
    </div>

    <div class="profile-info-grid">
      <div class="profile-info-item">
        <div class="profile-info-label">Téléphone</div>
        <div class="profile-info-value">${user.telephone || 'Non renseigné'}</div>
      </div>
      <div class="profile-info-item">
        <div class="profile-info-label">Date de naissance</div>
        <div class="profile-info-value">${user.date_naissance || 'Non renseigné'}</div>
      </div>
      <div class="profile-info-item">
        <div class="profile-info-label">Ville</div>
        <div class="profile-info-value">${user.ville || 'Non renseigné'}</div>
      </div>
      <div class="profile-info-item">
        <div class="profile-info-label">Code postal</div>
        <div class="profile-info-value">${user.code_postal || 'Non renseigné'}</div>
      </div>
      <div class="profile-info-item">
        <div class="profile-info-label">Rôle</div>
        <div class="profile-info-value">${user.role === 'admin' ? '👑 Admin' : '👤 Utilisateur'}</div>
      </div>
      <div class="profile-info-item">
        <div class="profile-info-label">Membre depuis</div>
        <div class="profile-info-value">${new Date(user.created_at).toLocaleDateString('fr-FR')}</div>
      </div>
    </div>
  `;
  
  document.getElementById('profile-info').innerHTML = html;
}

window.addEventListener('load', loadProfile);
</script>
